            </div>}
        </div>
      </div>}

      {/* Save template modal */}
      {showSaveTemplateModal&&<Modal title="Save as Template" onClose={()=>setShowSaveTemplateModal(false)}>
        <div className="col">
          <div style={{fontSize:13,color:'var(--text2)'}}>Saving meals from <b>{selectedDate}</b> as a template.</div>
          <div className="form-group"><label className="form-label">Template name</label>
            <input value={templateNameInput} onChange={e=>setTemplateNameInput(e.target.value)} placeholder="e.g. High Protein Day" autoFocus onKeyDown={e=>e.key==='Enter'&&saveTemplate()}/></div>
          <button className="btn btn-primary" onClick={saveTemplate}>Save Template</button>
        </div>
      </Modal>}

      {showScanner&&<BarcodeScanner onResult={handleBarcodeScan} onClose={()=>setShowScanner(false)}/>}

      {/* Add meal modal */}
      {showAddModal&&<Modal title={`Add to ${addSlot}`} onClose={()=>{setShowAddModal(false);setBarcodeNotice('');}}>
        <div className="col">
          {barcodeNotice&&<div style={{background:'var(--amber-dim)',border:'1px solid var(--amber)',borderRadius:8,padding:'10px 14px',fontSize:12,color:'var(--amber)',lineHeight:1.5}}>{barcodeNotice}</div>}
          <div className="form-group">
            <label className="form-label">Food name</label>
            <FoodSearch value={mealForm.name}
              onChange={name=>{ setMealForm(p=>({...p,name})); setBaseNutrition(null); setPortionInput('1'); }}
              onSelect={(name,cal,pro,car,fat)=>{
                const grams = extractGrams(name);
                setBaseNutrition({cal,p:pro,c:car,f:fat,grams});
                setPortionInput(grams ? String(grams) : '1');
                setMealForm(prev=>({...prev,name,calories:cal,protein:pro,carbs:car,fat}));
              }}
              onKeyDown={e=>e.key==='Enter'&&addMeal()} autoFocus
              onScanClick={()=>setShowScanner(true)}/>
          </div>

          {/* Portion scaler — only shown when food is picked from DB */}
          {baseNutrition&&(
            <div className="form-group">
              <label className="form-label" style={{display:'flex',justifyContent:'space-between',alignItems:'center'}}>
                <span>{baseNutrition.grams ? 'Amount (g)' : 'Servings'}</span>
                <span style={{fontSize:11,color:'var(--text3)',fontWeight:400}}>
                  {baseNutrition.grams ? `${baseNutrition.grams}g = 1 serving` : '1 = as listed · 2 = double'}
                </span>
              </label>
              <input type="number" min="1" step={baseNutrition.grams?'10':'0.5'} value={portionInput} onChange={e=>handlePortion(e.target.value)}/>
            </div>
          )}

          <div className="form-group">
            <label className="form-label">Calories</label>
            <input type="number" min="0" value={mealForm.calories}
              onChange={e=>{ setBaseNutrition(null); setMealForm(p=>({...p,calories:e.target.value})); }} placeholder="kcal"/>
          </div>
          <div style={{fontSize:12,color:'var(--text3)',marginTop:-4}}>Macros (optional — auto-filled from database)</div>
          <div className="form-row">
            <div className="form-group">
              <label className="form-label" style={{color:'var(--blue)'}}>Protein (g)</label>
              <input type="number" min="0" value={mealForm.protein}
                onChange={e=>{ setBaseNutrition(null); setMealForm(p=>({...p,protein:e.target.value})); }} placeholder="0"/>
            </div>
            <div className="form-group">
              <label className="form-label" style={{color:'var(--amber)'}}>Carbs (g)</label>
              <input type="number" min="0" value={mealForm.carbs}
                onChange={e=>{ setBaseNutrition(null); setMealForm(p=>({...p,carbs:e.target.value})); }} placeholder="0"/>
            </div>
            <div className="form-group">
              <label className="form-label" style={{color:'var(--red)'}}>Fat (g)</label>
              <input type="number" min="0" value={mealForm.fat}
                onChange={e=>{ setBaseNutrition(null); setMealForm(p=>({...p,fat:e.target.value})); }} placeholder="0"/>
            </div>
          </div>
          <button className="btn btn-primary" onClick={addMeal}>Add Meal</button>
        </div>
      </Modal>}

      {/* Goal modal */}
      {showGoalModal&&<Modal title="Daily Calorie Goal" onClose={()=>setShowGoalModal(false)}>
        <div className="col">
          <div className="form-group">
            <label className="form-label">Target calories per day</label>
            <input type="number" min="0" value={goalInput} onChange={e=>setGoalInput(e.target.value)} placeholder="e.g. 2000" autoFocus onKeyDown={e=>e.key==='Enter'&&saveGoal()}/>
          </div>
          <div style={{fontSize:12,color:'var(--text3)'}}>Common targets: 1500 (cut) · 2000 (maintain) · 2500+ (bulk)</div>
          <div style={{display:'flex',gap:8}}>
            <button className="btn btn-primary" style={{flex:1,justifyContent:'center'}} onClick={saveGoal}>Save Goal</button>
            {calorieGoal>0&&<button className="btn btn-ghost btn-sm" onClick={()=>{setCalorieGoal(0);save('calorieGoal',0);setShowGoalModal(false);}}>Remove</button>}
          </div>
        </div>
      </Modal>}
    </div>
  );
};

// ── ICS parser ────────────────────────────────────────────────────────────
const parseICS = text => {
  const events = [];
  const blocks = text.split(/BEGIN:VEVENT/i).slice(1);
  for (const block of blocks) {
    const get = key => {
      const m = block.match(new RegExp(`^${key}[^:\\r\\n]*:(.+)$`, 'im'));
      return m ? m[1].trim().replace(/\\n/g,'\n').replace(/\\,/g,',').replace(/\\;/g,';') : '';
    };
    const summary = get('SUMMARY');
    if (!summary) continue;
    const dtstart = get('DTSTART');
    let date = null;
    const dm = dtstart.match(/(\d{4})(\d{2})(\d{2})/);
    if (dm) date = `${dm[1]}-${dm[2]}-${dm[3]}`;
    const description = get('DESCRIPTION');
    events.push({ summary, date, description });
  }
  return events;
};

// ── PLANNING ──────────────────────────────────────────────────────────────
const PlanningSection = ({ tasks, setTasks, habits, setHabits, habitLogs, setHabitLogs, futurePlans, setFuturePlans, markActive }) => {
  const [tab, setTab] = useState('calendar');
  const [calMonth, setCalMonth] = useState(() => new Date());
  const [selectedDate, setSelectedDate] = useState(TODAY);
  const [showTaskModal, setShowTaskModal] = useState(false);
  const [showHabitModal, setShowHabitModal] = useState(false);
  const [taskForm, setTaskForm] = useState({ text:'', priority:'medium' });
  const [habitForm, setHabitForm] = useState('');
  // Future plans
  const [showPlanModal, setShowPlanModal] = useState(false);
  const [planForm, setPlanForm] = useState({ title:'', notes:'', targetDate:'', priority:'medium' });
  const [planFilter, setPlanFilter] = useState('active'); // 'active' | 'done' | 'all'
  // ICS import
  const icsInputRef = useRef(null);
  const [importPreview, setImportPreview] = useState(null); // [{summary,date,description,selected}]

  // Calendar grid
  const year = calMonth.getFullYear();
  const month = calMonth.getMonth();
  const monthLabel = calMonth.toLocaleDateString('en-US', { month:'long', year:'numeric' });
  const firstDay = new Date(year, month, 1).getDay();
  const daysInMonth = new Date(year, month + 1, 0).getDate();
  const calDays = useMemo(() => {
    const days = Array(firstDay).fill(null);
    for (let i = 1; i <= daysInMonth; i++)
      days.push(`${year}-${String(month+1).padStart(2,'0')}-${String(i).padStart(2,'0')}`);
    return days;
  }, [year, month, firstDay, daysInMonth]);

  const selectedTasks = tasks
    .filter(t => t.date === selectedDate)
    .sort((a,b) => ({high:0,medium:1,low:2}[a.priority] - {high:0,medium:1,low:2}[b.priority]));
  const doneCount = selectedTasks.filter(t => t.done).length;

  const addTask = () => {
    if (!taskForm.text.trim()) return;
    const t = { id:Date.now(), text:taskForm.text.trim(), priority:taskForm.priority, date:selectedDate, done:false };
    setTasks(prev => { const n=[...prev,t]; save('tasks',n); return n; });
    markActive(selectedDate);
    setTaskForm({ text:'', priority:'medium' }); setShowTaskModal(false);
  };
  const toggleDone = id => setTasks(prev => { const n=prev.map(t=>t.id===id?{...t,done:!t.done}:t); save('tasks',n); return n; });
  const deleteTask = id => setTasks(prev => { const n=prev.filter(t=>t.id!==id); save('tasks',n); return n; });

  // Habits
  const todayDone = habitLogs[TODAY] || [];
  const addHabit = () => {
    if (!habitForm.trim()) return;
    setHabits(prev => { const n=[...prev,{id:Date.now(),text:habitForm.trim()}]; save('habits',n); return n; });
    setHabitForm(''); setShowHabitModal(false);
  };
  const deleteHabit = id => setHabits(prev => { const n=prev.filter(h=>h.id!==id); save('habits',n); return n; });
  const toggleHabit = id => setHabitLogs(prev => {
    const day = prev[TODAY] || [];
    const updated = day.includes(id) ? day.filter(i=>i!==id) : [...day, id];
    const n = {...prev, [TODAY]: updated}; save('habitLogs',n); return n;
  });

  // Future plans handlers
  const addPlan = () => {
    if (!planForm.title.trim()) return;
    const p = { id:Date.now(), title:planForm.title.trim(), notes:planForm.notes.trim(), targetDate:planForm.targetDate, priority:planForm.priority, done:false };
    setFuturePlans(prev => { const n=[...prev,p]; save('futurePlans',n); return n; });
    setPlanForm({ title:'', notes:'', targetDate:'', priority:'medium' });
    setShowPlanModal(false);
  };
  const togglePlan = id => setFuturePlans(prev => { const n=prev.map(p=>p.id===id?{...p,done:!p.done}:p); save('futurePlans',n); return n; });
  const deletePlan = id => setFuturePlans(prev => { const n=prev.filter(p=>p.id!==id); save('futurePlans',n); return n; });

  const visiblePlans = futurePlans
    .filter(p => planFilter==='all' ? true : planFilter==='done' ? p.done : !p.done)
    .sort((a,b) => {
      if (a.done !== b.done) return a.done ? 1 : -1;
      if (a.targetDate && b.targetDate) return a.targetDate.localeCompare(b.targetDate);
      if (a.targetDate) return -1;
      if (b.targetDate) return 1;
      return ({high:0,medium:1,low:2}[a.priority] - {high:0,medium:1,low:2}[b.priority]);
    });

  // ICS import handlers
  const handleICSFile = e => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = ev => {
      const events = parseICS(ev.target.result);
      if (!events.length) { alert('No events found in this file.'); return; }
      setImportPreview(events.map(ev => ({...ev, selected: true})));
    };
    reader.readAsText(file);
    e.target.value = '';
  };

  const confirmImport = () => {
    if (!importPreview) return;
    const toImport = importPreview.filter(e => e.selected);
    const newTasks = toImport.map(e => ({
      id: Date.now() + Math.random(),
      text: e.summary,
      priority: 'medium',
      date: e.date || TODAY,
      done: false,
      notes: e.description || '',
    }));
    setTasks(prev => { const n=[...prev,...newTasks]; save('tasks',n); return n; });
    setImportPreview(null);
  };

  const pColor = p => p==='high'?'var(--red)':p==='medium'?'var(--amber)':'var(--text3)';
  const pClass = p => p==='high'?'badge-red':p==='medium'?'badge-amber':'badge-gray';

  return (
    <div className="section">
      <div style={{display:'flex',alignItems:'flex-start',justifyContent:'space-between',marginBottom:24,flexWrap:'wrap',gap:10}}>
        <div className="section-title">Planning</div>
        <div style={{display:'flex',gap:8}}>
          {tab==='calendar' && <>
            <button className="btn btn-ghost btn-sm" onClick={()=>icsInputRef.current?.click()}>📅 Import .ics</button>
            <input ref={icsInputRef} type="file" accept=".ics" style={{display:'none'}} onChange={handleICSFile}/>
            <button className="btn btn-primary btn-sm" onClick={()=>{setTaskForm({text:'',priority:'medium'});setShowTaskModal(true);}}><Icon name="plus" size={15}/>Add Task</button>
          </>}
          {tab==='habits'  && <button className="btn btn-primary btn-sm" onClick={()=>setShowHabitModal(true)}><Icon name="plus" size={15}/>Add Habit</button>}
          {tab==='future'  && <button className="btn btn-primary btn-sm" onClick={()=>{setPlanForm({title:'',notes:'',targetDate:'',priority:'medium'});setShowPlanModal(true);}}><Icon name="plus" size={15}/>Add Plan</button>}
        </div>
      </div>

      <div className="tab-bar">
        {[['calendar','Calendar'],['habits','Daily Habits'],['future','Future Plans']].map(([id,label])=>(
          <button key={id} className={`tab-btn ${tab===id?'active':''}`} onClick={()=>setTab(id)}>{label}</button>
        ))}
      </div>

      {tab==='calendar' && <div className="col">
        {/* Month nav */}
        <div className="card" style={{padding:'16px 20px'}}>
          <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:16,gap:6}}>
            <button className="btn btn-ghost btn-sm" onClick={()=>setCalMonth(new Date(year,month-1,1))} style={{padding:'6px 10px',fontSize:18,lineHeight:1}}>‹</button>
            <div style={{display:'flex',alignItems:'center',gap:8}}>
              <span style={{fontSize:15,fontWeight:700}}>{monthLabel}</span>
              {(year!==new Date().getFullYear()||month!==new Date().getMonth())&&
                <button className="btn btn-ghost btn-sm" style={{fontSize:11,padding:'3px 8px'}} onClick={()=>{setCalMonth(new Date());setSelectedDate(TODAY);}}>Today</button>}
            </div>
            <button className="btn btn-ghost btn-sm" onClick={()=>setCalMonth(new Date(year,month+1,1))} style={{padding:'6px 10px',fontSize:18,lineHeight:1}}>›</button>
          </div>

          {/* Weekday headers */}
          <div style={{display:'grid',gridTemplateColumns:'repeat(7,1fr)',marginBottom:6}}>
            {['Su','Mo','Tu','We','Th','Fr','Sa'].map(d=>(
              <div key={d} style={{textAlign:'center',fontSize:11,fontWeight:600,color:'var(--text3)',padding:'4px 0'}}>{d}</div>
            ))}
          </div>

          {/* Day cells */}
          <div style={{display:'grid',gridTemplateColumns:'repeat(7,1fr)',gap:3}}>
            {calDays.map((date, i) => {
              if (!date) return <div key={`e${i}`}/>;
              const dayNum = parseInt(date.split('-')[2]);
              const isToday = date === TODAY;
              const isSelected = date === selectedDate;
              const dayTasks = tasks.filter(t=>t.date===date);
              const dots = dayTasks.slice(0,3);
              return (
                <div key={date} onClick={()=>setSelectedDate(date)}
                  style={{textAlign:'center',padding:'6px 2px',borderRadius:8,cursor:'pointer',minHeight:44,display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',
                    background: isSelected ? 'var(--accent-dim)' : isToday ? 'var(--bg4)' : 'transparent',
                    border: `2px solid ${isSelected ? 'var(--accent)' : isToday ? 'var(--border)' : 'transparent'}`,
                    transition:'all 0.12s'}}>
                  <span style={{fontSize:13,fontWeight:isToday?700:400,color:isSelected?'var(--accent)':isToday?'var(--accent)':'var(--text)',lineHeight:1}}>{dayNum}</span>
                  {dots.length > 0 && (
                    <div style={{display:'flex',gap:2,marginTop:4,justifyContent:'center'}}>
                      {dots.map(t=><div key={t.id} style={{width:4,height:4,borderRadius:'50%',background:pColor(t.priority),opacity:t.done?0.35:1}}/>)}
                    </div>
                  )}
                </div>
              );
            })}
          </div>
        </div>

        {/* Tasks for selected day */}
        <div>
          <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:10}}>
            <div style={{fontSize:14,fontWeight:600,color:'var(--text)'}}>
              {new Date(selectedDate+'T12:00').toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric'})}
              {selectedDate===TODAY && <span style={{fontSize:12,color:'var(--accent)',marginLeft:8}}>today</span>}
            </div>
            {selectedTasks.length>0 && <span style={{fontSize:12,color:'var(--text3)'}}>{doneCount}/{selectedTasks.length}{doneCount===selectedTasks.length?' 🎉':''}</span>}
          </div>
          {selectedTasks.length===0
            ? <div style={{textAlign:'center',padding:'20px',color:'var(--text3)',fontSize:13,background:'var(--bg2)',border:'1px solid var(--border)',borderRadius:'var(--radius)'}}>No tasks — tap "Add Task" to add one for this day</div>
            : <div className="col" style={{gap:8}}>
                {selectedTasks.map(t=>(
                  <div key={t.id} className="card" style={{display:'flex',alignItems:'center',gap:12,padding:'12px 14px',opacity:t.done?0.55:1,transition:'opacity 0.2s'}}>
                    <button onClick={()=>toggleDone(t.id)} style={{width:22,height:22,borderRadius:6,flexShrink:0,display:'flex',alignItems:'center',justifyContent:'center',
                      border:`2px solid ${t.done?'var(--accent)':'var(--border)'}`,background:t.done?'var(--accent)':'transparent',transition:'all 0.15s',cursor:'pointer'}}>
                      {t.done&&<Icon name="check" size={12}/>}
                    </button>
                    <span style={{flex:1,fontSize:14,textDecoration:t.done?'line-through':'none',minWidth:0,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{t.text}</span>
                    <span className={`badge ${pClass(t.priority)}`} style={{flexShrink:0}}>{t.priority}</span>
                    <button className="btn btn-icon btn-danger" onClick={()=>deleteTask(t.id)}><Icon name="trash" size={14}/></button>
                  </div>
                ))}
              </div>}
        </div>
      </div>}

      {tab==='habits' && <div className="col">
        {habits.length > 0 && (
          <div style={{background:'var(--accent-dim)',border:'1px solid var(--accent-border)',borderRadius:12,padding:'14px 20px',display:'flex',alignItems:'center',justifyContent:'space-between'}}>
            <div>
              <div style={{fontSize:12,color:'var(--text2)',marginBottom:2}}>Today's Progress</div>
              <div style={{fontSize:13,color:'var(--text3)'}}>
                {todayDone.length === habits.length && habits.length > 0 ? '🎉 All done!' : `${todayDone.length} of ${habits.length} completed`}
              </div>
            </div>
            <span style={{fontSize:32,fontWeight:700,fontFamily:'var(--mono)',color:'var(--accent)'}}>{todayDone.length}<span style={{fontSize:16,color:'var(--text3)'}}>/{habits.length}</span></span>
          </div>
        )}
        {habits.length === 0
          ? <div className="empty-state">No daily habits yet.<br/>Add things you want to do every single day.</div>
          : <div className="col" style={{gap:8}}>
              {habits.map(h => {
                const done = todayDone.includes(h.id);
                return (
                  <div key={h.id} className="card" style={{display:'flex',alignItems:'center',gap:12,padding:'14px 16px',
                    opacity:done?0.65:1,transition:'all 0.2s',
                    borderColor:done?'var(--accent-border)':'var(--border)'}}>
                    <button onClick={()=>toggleHabit(h.id)} style={{width:24,height:24,borderRadius:6,flexShrink:0,display:'flex',alignItems:'center',justifyContent:'center',
                      border:`2px solid ${done?'var(--accent)':'var(--border)'}`,background:done?'var(--accent)':'transparent',transition:'all 0.15s',cursor:'pointer'}}>
                      {done && <Icon name="check" size={13}/>}
                    </button>
                    <span style={{flex:1,fontSize:14,textDecoration:done?'line-through':'none'}}>{h.text}</span>
                    <button className="btn btn-icon btn-danger" onClick={()=>deleteHabit(h.id)}><Icon name="trash" size={14}/></button>
                  </div>
                );
              })}
            </div>}
      </div>}

      {/* ── FUTURE PLANS ── */}
      {tab==='future' && <div className="col">
        {/* Filter chips */}
        <div style={{display:'flex',gap:6}}>
          {[['active','Active'],['done','Done'],['all','All']].map(([id,label])=>(
            <button key={id} onClick={()=>setPlanFilter(id)}
              style={{padding:'5px 14px',borderRadius:99,fontSize:12,fontWeight:500,cursor:'pointer',transition:'all 0.15s',
                border:`1px solid ${planFilter===id?'var(--accent)':'var(--border)'}`,
                background:planFilter===id?'var(--accent-dim)':'transparent',
                color:planFilter===id?'var(--accent)':'var(--text2)'}}>
              {label} {id==='active'?`(${futurePlans.filter(p=>!p.done).length})`:id==='done'?`(${futurePlans.filter(p=>p.done).length})`:`(${futurePlans.length})`}
            </button>
          ))}
        </div>

        {visiblePlans.length===0
          ? <div className="empty-state">{futurePlans.length===0?'No future plans yet.\nAdd goals, dreams, or things you want to do someday.':'Nothing here.'}</div>
          : <div className="col" style={{gap:10}}>
              {visiblePlans.map(p=>(
                <div key={p.id} className="card" style={{opacity:p.done?0.6:1,transition:'opacity 0.2s',borderColor:p.done?'var(--border)':p.priority==='high'?'var(--red-dim)':p.priority==='medium'?'var(--amber-dim)':'var(--border)'}}>
                  <div style={{display:'flex',alignItems:'flex-start',gap:12}}>
                    <button onClick={()=>togglePlan(p.id)} style={{width:22,height:22,borderRadius:6,flexShrink:0,marginTop:2,display:'flex',alignItems:'center',justifyContent:'center',
                      border:`2px solid ${p.done?'var(--accent)':'var(--border)'}`,background:p.done?'var(--accent)':'transparent',transition:'all 0.15s',cursor:'pointer'}}>
                      {p.done&&<Icon name="check" size={12}/>}
                    </button>
                    <div style={{flex:1,minWidth:0}}>
                      <div style={{fontSize:14,fontWeight:600,textDecoration:p.done?'line-through':'none',marginBottom:p.notes?4:0}}>{p.title}</div>
                      {p.notes&&<div style={{fontSize:12,color:'var(--text2)',lineHeight:1.5}}>{p.notes}</div>}
                      <div style={{display:'flex',gap:8,marginTop:8,flexWrap:'wrap',alignItems:'center'}}>
                        <span className={`badge ${pClass(p.priority)}`}>{p.priority}</span>
                        {p.targetDate&&<span style={{fontSize:11,color:'var(--text3)',fontFamily:'var(--mono)'}}>🎯 {new Date(p.targetDate+'T12:00').toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'})}</span>}
                      </div>
                    </div>
                    <button className="btn btn-icon btn-danger" style={{flexShrink:0}} onClick={()=>deletePlan(p.id)}><Icon name="trash" size={14}/></button>
                  </div>
                </div>
              ))}
            </div>}
      </div>}

      {/* ── MODALS ── */}
      {showTaskModal && (
        <Modal title={`Add task — ${new Date(selectedDate+'T12:00').toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'})}`} onClose={()=>setShowTaskModal(false)}>
          <div className="col">
            <div className="form-group"><label className="form-label">Task</label>
              <input value={taskForm.text} onChange={e=>setTaskForm(p=>({...p,text:e.target.value}))} placeholder="What needs to be done?" autoFocus onKeyDown={e=>e.key==='Enter'&&addTask()}/></div>
            <div className="form-group"><label className="form-label">Priority</label>
              <select value={taskForm.priority} onChange={e=>setTaskForm(p=>({...p,priority:e.target.value}))}>
                <option value="high">🔴 High</option><option value="medium">🟡 Medium</option><option value="low">⚪ Low</option>
              </select></div>
            <button className="btn btn-primary" onClick={addTask}>Add Task</button>
          </div>
        </Modal>
      )}

      {showHabitModal && (
        <Modal title="New Daily Habit" onClose={()=>setShowHabitModal(false)}>
          <div className="col">
            <div className="form-group"><label className="form-label">What do you want to do every day?</label>
              <input value={habitForm} onChange={e=>setHabitForm(e.target.value)} placeholder="e.g. Drink 8 glasses of water" autoFocus onKeyDown={e=>e.key==='Enter'&&addHabit()}/></div>
            <button className="btn btn-primary" onClick={addHabit}>Add Habit</button>
          </div>
        </Modal>
      )}

      {showPlanModal && (
        <Modal title="Add Future Plan" onClose={()=>setShowPlanModal(false)}>
          <div className="col">
            <div className="form-group"><label className="form-label">Title</label>
              <input value={planForm.title} onChange={e=>setPlanForm(p=>({...p,title:e.target.value}))} placeholder="e.g. Run a marathon" autoFocus onKeyDown={e=>e.key==='Enter'&&addPlan()}/></div>
            <div className="form-group"><label className="form-label">Notes (optional)</label>
              <textarea value={planForm.notes} onChange={e=>setPlanForm(p=>({...p,notes:e.target.value}))} rows={2} placeholder="Any details or steps…"/></div>
            <div className="form-row">
              <div className="form-group"><label className="form-label">Target Date (optional)</label>
                <input type="date" value={planForm.targetDate} onChange={e=>setPlanForm(p=>({...p,targetDate:e.target.value}))}/></div>
              <div className="form-group"><label className="form-label">Priority</label>
                <select value={planForm.priority} onChange={e=>setPlanForm(p=>({...p,priority:e.target.value}))}>
                  <option value="high">🔴 High</option><option value="medium">🟡 Medium</option><option value="low">⚪ Low</option>
                </select></div>
            </div>
            <button className="btn btn-primary" onClick={addPlan}>Add Plan</button>
          </div>
        </Modal>
      )}

      {importPreview && (
        <Modal title={`Import ${importPreview.length} events`} onClose={()=>setImportPreview(null)}>
          <div className="col">
            <div style={{fontSize:13,color:'var(--text2)',marginBottom:4}}>
              Select which events to import as tasks. Events without a date will be added to today.
            </div>
            <div style={{display:'flex',gap:8,marginBottom:4}}>
              <button className="btn btn-ghost btn-sm" onClick={()=>setImportPreview(p=>p.map(e=>({...e,selected:true})))}>Select all</button>
              <button className="btn btn-ghost btn-sm" onClick={()=>setImportPreview(p=>p.map(e=>({...e,selected:false})))}>Deselect all</button>
            </div>
            <div className="col" style={{gap:6,maxHeight:320,overflowY:'auto'}}>
              {importPreview.map((ev,i)=>(
                <div key={i} onClick={()=>setImportPreview(p=>p.map((e,j)=>j===i?{...e,selected:!e.selected}:e))}
                  style={{display:'flex',alignItems:'flex-start',gap:10,padding:'10px 12px',borderRadius:8,cursor:'pointer',
                    background:ev.selected?'var(--accent-dim)':'var(--bg3)',
                    border:`1px solid ${ev.selected?'var(--accent-border)':'var(--border)'}`,transition:'all 0.12s'}}>
                  <div style={{width:18,height:18,borderRadius:4,flexShrink:0,marginTop:1,display:'flex',alignItems:'center',justifyContent:'center',
                    border:`2px solid ${ev.selected?'var(--accent)':'var(--border)'}`,background:ev.selected?'var(--accent)':'transparent'}}>
                    {ev.selected&&<Icon name="check" size={11}/>}
                  </div>
                  <div style={{flex:1,minWidth:0}}>
                    <div style={{fontSize:13,fontWeight:600}}>{ev.summary}</div>
                    <div style={{fontSize:11,color:'var(--text3)',marginTop:2,fontFamily:'var(--mono)'}}>
                      {ev.date ? new Date(ev.date+'T12:00').toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric',year:'numeric'}) : 'No date → added to today'}
                    </div>
                    {ev.description&&<div style={{fontSize:11,color:'var(--text2)',marginTop:2,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{ev.description}</div>}
                  </div>
                </div>
              ))}
            </div>
            <button className="btn btn-primary" onClick={confirmImport} disabled={!importPreview.some(e=>e.selected)}>
              Import {importPreview.filter(e=>e.selected).length} events as tasks
            </button>
          </div>
        </Modal>
      )}
    </div>
  );
};

// ── PROGRESS ──────────────────────────────────────────────────────────────
const ProgressSection = ({ weightLogs, setWeightLogs, checkIns, setCheckIns, markActive, userProfile, setUserProfile, bodyMeasurements, setBodyMeasurements }) => {
  const [tab, setTab] = useState('overview');
  const [showWeightModal, setShowWeightModal] = useState(false);
  const [showCheckInModal, setShowCheckInModal] = useState(false);
  const [showMeasureModal, setShowMeasureModal] = useState(false);
  const [weightForm, setWeightForm] = useState({ date:TODAY, weight:'' });
  const [checkForm, setCheckForm] = useState({ date:TODAY, energy:5, mood:5, notes:'' });
  const [measureForm, setMeasureForm] = useState({ date:TODAY, chest:'', waist:'', hips:'', arms:'', thighs:'' });
  const [profileForm, setProfileForm] = useState({ height: userProfile?.height||'', targetWeight: userProfile?.targetWeight||'' });

  const saveProfile = () => {
    const p = { ...userProfile, height:parseFloat(profileForm.height)||null, targetWeight:parseFloat(profileForm.targetWeight)||null };
    setUserProfile(p); save('userProfile', p);
  };

  const addWeight=()=>{
    if(!weightForm.weight)return;
    const w={id:Date.now(),date:weightForm.date,value:parseFloat(weightForm.weight)};
    setWeightLogs(prev=>{const n=[...prev.filter(x=>x.date!==weightForm.date),w].sort((a,b)=>a.date.localeCompare(b.date));save('weightLogs',n);return n;});
    markActive(weightForm.date);setWeightForm({date:TODAY,weight:''});setShowWeightModal(false);
  };
  const addCheckIn=()=>{
    const c={id:Date.now(),...checkForm};
    setCheckIns(prev=>{const n=[...prev.filter(x=>x.date!==checkForm.date),c].sort((a,b)=>a.date.localeCompare(b.date));save('checkIns',n);return n;});
    markActive(checkForm.date);setCheckForm({date:TODAY,energy:5,mood:5,notes:''});setShowCheckInModal(false);
  };
  const addMeasure=()=>{
    const m={id:Date.now(),...measureForm};
    setBodyMeasurements(prev=>{const n=[...prev.filter(x=>x.date!==measureForm.date),m].sort((a,b)=>a.date.localeCompare(b.date));save('bodyMeasurements',n);return n;});
    setMeasureForm({date:TODAY,chest:'',waist:'',hips:'',arms:'',thighs:''});setShowMeasureModal(false);
  };
  const deleteWeight=id=>setWeightLogs(prev=>{const n=prev.filter(w=>w.id!==id);save('weightLogs',n);return n;});
  const deleteCheckIn=id=>setCheckIns(prev=>{const n=prev.filter(c=>c.id!==id);save('checkIns',n);return n;});
  const deleteMeasure=id=>setBodyMeasurements(prev=>{const n=prev.filter(m=>m.id!==id);save('bodyMeasurements',n);return n;});

  const lw=weightLogs[weightLogs.length-1], lc=checkIns[checkIns.length-1];
  const wd=weightLogs.length>=2?(weightLogs[weightLogs.length-1].value-weightLogs[weightLogs.length-2].value).toFixed(1):null;
  const bmi = lw && userProfile?.height ? (lw.value / Math.pow(userProfile.height/100, 2)).toFixed(1) : null;
  const bmiLabel = bmi ? (bmi<18.5?'Underweight':bmi<25?'Normal':bmi<30?'Overweight':'Obese') : '';
  const bmiColor = bmi ? (bmi<18.5?'var(--blue)':bmi<25?'var(--accent)':bmi<30?'var(--amber)':'var(--red)') : 'var(--text)';

  return (
    <div className="section">
      <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:24,flexWrap:'wrap',gap:10}}>
        <div className="section-title">Progress</div>
        {tab==='overview'&&<button className="btn btn-ghost btn-sm" onClick={()=>setShowCheckInModal(true)}><Icon name="plus" size={14}/>Check-in</button>}
        {tab==='body'&&<button className="btn btn-ghost btn-sm" onClick={()=>setShowMeasureModal(true)}><Icon name="plus" size={14}/>Log</button>}
      </div>

      <div className="tab-bar">
        {[['overview','Overview'],['body','Body']].map(([id,label])=>(
          <button key={id} className={`tab-btn ${tab===id?'active':''}`} onClick={()=>setTab(id)}>{label}</button>
        ))}
      </div>

      {tab==='overview'&&<div className="col">
        <div className="grid-2">
          <div className="card" style={{display:'flex',alignItems:'center',justifyContent:'space-between',gap:12}}>
            <div style={{minWidth:0}}>
              <div className="card-title">Current Weight</div>
              <div style={{fontSize:28,fontWeight:700,fontFamily:'var(--mono)',color:'var(--accent)'}}>{lw?`${lw.value} kg`:'—'}</div>
              {wd!==null&&<div style={{fontSize:11,color:parseFloat(wd)<0?'var(--accent)':'var(--red)',marginTop:2,fontFamily:'var(--mono)'}}>{parseFloat(wd)>0?'+':''}{wd} kg from last</div>}
              {lw&&<div style={{fontSize:11,color:'var(--text3)',marginTop:2}}>{lw.date}</div>}
            </div>
            <button className="btn btn-ghost btn-sm" onClick={()=>setShowWeightModal(true)} style={{flexShrink:0}}><Icon name="plus" size={14}/>Log</button>
          </div>
          <div className="card" style={{display:'flex',alignItems:'center',justifyContent:'space-between',gap:12}}>
            <div style={{minWidth:0}}>
              <div className="card-title">Last Check-in</div>
              {lc?<div style={{display:'flex',gap:16,marginTop:4}}>
                <div><div style={{fontSize:11,color:'var(--text3)'}}>Mood</div><div style={{fontSize:20,fontWeight:700,fontFamily:'var(--mono)',color:'var(--amber)'}}>{lc.mood}<span style={{fontSize:13}}>/10</span></div></div>
                <div><div style={{fontSize:11,color:'var(--text3)'}}>Energy</div><div style={{fontSize:20,fontWeight:700,fontFamily:'var(--mono)',color:'var(--accent)'}}>{lc.energy}<span style={{fontSize:13}}>/10</span></div></div>
              </div>:<div style={{color:'var(--text3)',fontSize:13,marginTop:4}}>No check-in yet</div>}
              {lc&&<div style={{fontSize:11,color:'var(--text3)',marginTop:2}}>{lc.date}</div>}
            </div>
            <button className="btn btn-ghost btn-sm" onClick={()=>setShowCheckInModal(true)} style={{flexShrink:0}}><Icon name="plus" size={14}/>Log</button>
          </div>
        </div>
        {bmi&&<div className="card">
          <div className="card-title">BMI</div>
          <div style={{display:'flex',alignItems:'baseline',gap:12,marginTop:4}}>
            <div style={{fontSize:32,fontWeight:700,fontFamily:'var(--mono)',color:bmiColor}}>{bmi}</div>
            <div style={{fontSize:14,color:bmiColor,fontWeight:600}}>{bmiLabel}</div>
          </div>
          <div style={{fontSize:11,color:'var(--text3)',marginTop:4}}>Based on {lw.value} kg · {userProfile.height} cm</div>
        </div>}
        <div className="card">
          <div className="card-title">Weight Over Time</div>
          <LineChart data={weightLogs.map(w=>({date:w.date.slice(5),value:w.value}))} label="weight" goalLine={userProfile?.targetWeight||null}/>
          {userProfile?.targetWeight&&<div style={{fontSize:11,color:'var(--amber)',marginTop:4,fontFamily:'var(--mono)'}}>Target: {userProfile.targetWeight} kg</div>}
        </div>
        <div className="grid-2">
          <div className="card"><div className="card-title">Mood</div><LineChart data={checkIns.map(c=>({date:c.date.slice(5),value:c.mood}))} color="var(--amber)" height={90} label="mood"/></div>
          <div className="card"><div className="card-title">Energy</div><LineChart data={checkIns.map(c=>({date:c.date.slice(5),value:c.energy}))} color="var(--blue)" height={90} label="energy"/></div>
        </div>
        {weightLogs.length>0&&<div className="card"><div className="card-title">Weight Log</div>
          <div className="col" style={{gap:6}}>{[...weightLogs].reverse().slice(0,8).map(w=>(
            <div key={w.id} style={{display:'flex',alignItems:'center',gap:12,padding:'6px 0',borderBottom:'1px solid var(--border)'}}>
              <div style={{fontSize:12,color:'var(--text3)',fontFamily:'var(--mono)',minWidth:80}}>{w.date}</div>
              <div style={{flex:1,fontSize:14,fontWeight:600,fontFamily:'var(--mono)',color:'var(--accent)'}}>{w.value} kg</div>
              <button className="btn btn-icon btn-danger" style={{padding:4}} onClick={()=>deleteWeight(w.id)}><Icon name="trash" size={13}/></button>
            </div>))}</div>
        </div>}
        {checkIns.length>0&&<div className="card"><div className="card-title">Check-in History</div>
          <div className="col" style={{gap:6}}>{[...checkIns].reverse().slice(0,6).map(c=>(
            <div key={c.id} style={{display:'flex',alignItems:'center',gap:12,padding:'8px 0',borderBottom:'1px solid var(--border)'}}>
              <div style={{fontSize:12,color:'var(--text3)',fontFamily:'var(--mono)',minWidth:80}}>{c.date}</div>
              <div style={{fontSize:12}}>Mood <span style={{color:'var(--amber)',fontWeight:600}}>{c.mood}/10</span></div>
              <div style={{fontSize:12}}>Energy <span style={{color:'var(--accent)',fontWeight:600}}>{c.energy}/10</span></div>
              {c.notes&&<div style={{fontSize:12,color:'var(--text2)',flex:1,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}} title={c.notes}>{c.notes}</div>}
              <button className="btn btn-icon btn-danger" style={{padding:4,flexShrink:0}} onClick={()=>deleteCheckIn(c.id)}><Icon name="trash" size={13}/></button>
            </div>))}</div>
        </div>}
      </div>}

      {tab==='body'&&<div className="col">
        {/* Goals / profile */}
        <div className="card">
          <div className="card-title">Goals & Profile</div>
          <div className="form-row" style={{marginTop:8}}>
            <div className="form-group"><label className="form-label">Height (cm)</label>
              <input type="number" min="100" max="250" value={profileForm.height} onChange={e=>setProfileForm(p=>({...p,height:e.target.value}))} placeholder="175" onBlur={saveProfile}/></div>
            <div className="form-group"><label className="form-label">Target Weight (kg)</label>
              <input type="number" min="30" max="300" step="0.1" value={profileForm.targetWeight} onChange={e=>setProfileForm(p=>({...p,targetWeight:e.target.value}))} placeholder="70" onBlur={saveProfile}/></div>
          </div>
          <div style={{fontSize:11,color:'var(--text3)'}}>Changes save automatically on blur. Target weight shows as a goal line on the weight chart.</div>
        </div>
        {/* Measurements log */}
        <div className="card">
          <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:12}}>
            <div className="card-title" style={{marginBottom:0}}>Body Measurements</div>
            <button className="btn btn-ghost btn-sm" onClick={()=>setShowMeasureModal(true)}><Icon name="plus" size={14}/>Log</button>
          </div>
          {bodyMeasurements.length===0?<div className="empty-state">No measurements logged yet</div>
            :<div className="col" style={{gap:10}}>
              {[...bodyMeasurements].reverse().slice(0,5).map(m=>(
                <div key={m.id} style={{borderBottom:'1px solid var(--border)',paddingBottom:10}}>
                  <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:6}}>
                    <span style={{fontSize:12,color:'var(--text3)',fontFamily:'var(--mono)'}}>{m.date}</span>
                    <button className="btn btn-icon btn-danger" style={{padding:4}} onClick={()=>deleteMeasure(m.id)}><Icon name="trash" size={13}/></button>
                  </div>
                  <div style={{display:'flex',flexWrap:'wrap',gap:'6px 16px'}}>
                    {[['Chest',m.chest],['Waist',m.waist],['Hips',m.hips],['Arms',m.arms],['Thighs',m.thighs]].filter(([,v])=>v).map(([label,val])=>(
                      <div key={label} style={{fontSize:12}}>
                        <span style={{color:'var(--text3)'}}>{label} </span>
                        <span style={{fontWeight:600,fontFamily:'var(--mono)',color:'var(--accent)'}}>{val} cm</span>
                      </div>
                    ))}
                  </div>
                </div>
              ))}
            </div>}
        </div>
      </div>}

      {showWeightModal&&<Modal title="Log Weight" onClose={()=>setShowWeightModal(false)}>
        <div className="col">
          <div className="form-row">
            <div className="form-group"><label className="form-label">Weight (kg)</label>
              <input type="number" min="0" step="0.1" value={weightForm.weight} onChange={e=>setWeightForm(p=>({...p,weight:e.target.value}))} placeholder="75.5" autoFocus onKeyDown={e=>e.key==='Enter'&&addWeight()}/></div>
            <div className="form-group"><label className="form-label">Date</label>
              <input type="date" value={weightForm.date} onChange={e=>setWeightForm(p=>({...p,date:e.target.value}))}/></div>
          </div>
          <button className="btn btn-primary" onClick={addWeight}>Save Weight</button>
        </div>
      </Modal>}
      {showCheckInModal&&<Modal title="Weekly Check-in" onClose={()=>setShowCheckInModal(false)}>
        <div className="col">
          <div className="form-group"><label className="form-label">Date</label>
            <input type="date" value={checkForm.date} onChange={e=>setCheckForm(p=>({...p,date:e.target.value}))}/></div>
          <div className="form-group">
            <label className="form-label">Energy — <span style={{color:'var(--accent)',fontFamily:'var(--mono)'}}>{checkForm.energy}/10</span></label>
            <input type="range" min="1" max="10" value={checkForm.energy} onChange={e=>setCheckForm(p=>({...p,energy:parseInt(e.target.value)}))} style={{background:'var(--bg4)',accentColor:'var(--accent)',width:'100%'}}/></div>
          <div className="form-group">
            <label className="form-label">Mood — <span style={{color:'var(--amber)',fontFamily:'var(--mono)'}}>{checkForm.mood}/10</span></label>
            <input type="range" min="1" max="10" value={checkForm.mood} onChange={e=>setCheckForm(p=>({...p,mood:parseInt(e.target.value)}))} style={{background:'var(--bg4)',accentColor:'var(--amber)',width:'100%'}}/></div>
          <div className="form-group"><label className="form-label">Notes</label>
            <textarea value={checkForm.notes} onChange={e=>setCheckForm(p=>({...p,notes:e.target.value}))} rows={3} placeholder="How was your week?"/></div>
          <button className="btn btn-primary" onClick={addCheckIn}>Save Check-in</button>
        </div>
      </Modal>}
      {showMeasureModal&&<Modal title="Log Measurements" onClose={()=>setShowMeasureModal(false)}>
        <div className="col">
          <div className="form-group"><label className="form-label">Date</label>
            <input type="date" value={measureForm.date} onChange={e=>setMeasureForm(p=>({...p,date:e.target.value}))}/></div>
          <div className="form-row">
            <div className="form-group"><label className="form-label">Chest (cm)</label><input type="number" min="0" step="0.5" value={measureForm.chest} onChange={e=>setMeasureForm(p=>({...p,chest:e.target.value}))} placeholder="100"/></div>
            <div className="form-group"><label className="form-label">Waist (cm)</label><input type="number" min="0" step="0.5" value={measureForm.waist} onChange={e=>setMeasureForm(p=>({...p,waist:e.target.value}))} placeholder="80"/></div>
          </div>
          <div className="form-row">
            <div className="form-group"><label className="form-label">Hips (cm)</label><input type="number" min="0" step="0.5" value={measureForm.hips} onChange={e=>setMeasureForm(p=>({...p,hips:e.target.value}))} placeholder="100"/></div>
            <div className="form-group"><label className="form-label">Arms (cm)</label><input type="number" min="0" step="0.5" value={measureForm.arms} onChange={e=>setMeasureForm(p=>({...p,arms:e.target.value}))} placeholder="35"/></div>
          </div>
          <div className="form-group"><label className="form-label">Thighs (cm)</label><input type="number" min="0" step="0.5" value={measureForm.thighs} onChange={e=>setMeasureForm(p=>({...p,thighs:e.target.value}))} placeholder="55"/></div>
          <button className="btn btn-primary" onClick={addMeasure}>Save Measurements</button>
        </div>
      </Modal>}
    </div>
  );
};

// ── APP ROOT ──────────────────────────────────────────────────────────────
const NAV = [
  {id:'home',label:'Home',icon:'home'},
  {id:'gym',label:'Gym',icon:'dumbbell'},
  {id:'food',label:'Food',icon:'food'},
  {id:'plan',label:'Plan',icon:'plan'},
  {id:'progress',label:'Progress',icon:'progress'},
];

const App = () => {
  const [authState, setAuthState] = useState('loading');
  const [user, setUser] = useState(null);
  const [activeSection, setActiveSection] = useState('home');

  const [workoutSchemas,  setWorkoutSchemas]  = useState(()=>ls.get('workoutSchemas',[]));
  const [workoutSessions, setWorkoutSessions] = useState(()=>ls.get('workoutSessions',[]));
  const [meals,           setMeals]           = useState(()=>ls.get('meals',{}));
  const [favMeals,        setFavMeals]        = useState(()=>ls.get('favMeals',[]));
  const [tasks,           setTasks]           = useState(()=>ls.get('tasks',[]));
  const [weightLogs,      setWeightLogs]      = useState(()=>ls.get('weightLogs',[]));
  const [checkIns,        setCheckIns]        = useState(()=>ls.get('checkIns',[]));
  const [activeDays,      setActiveDays]      = useState(()=>ls.get('activeDays',[]));
  const [habits,           setHabits]           = useState(()=>ls.get('habits',[]));
  const [habitLogs,        setHabitLogs]        = useState(()=>ls.get('habitLogs',{}));
  const [customExercises,  setCustomExercises]  = useState(()=>ls.get('customExercises',[]));
  const [calorieGoal,      setCalorieGoal]      = useState(()=>ls.get('calorieGoal',0));
  const [waterLogs,        setWaterLogs]        = useState(()=>ls.get('waterLogs',{}));
  const [futurePlans,      setFuturePlans]      = useState(()=>ls.get('futurePlans',[]));
  const [userProfile,      setUserProfile]      = useState(()=>ls.get('userProfile',{}));
  const [bodyMeasurements, setBodyMeasurements] = useState(()=>ls.get('bodyMeasurements',[]));
  const [mealTemplates,    setMealTemplates]    = useState(()=>ls.get('mealTemplates',[]));
  const [accentColor,      setAccentColor]      = useState(()=>ls.get('accentColor','green'));

  const applyCloud = useCallback(cloud => {
    if (!cloud) return;
    const apply = (key, setter) => { if (cloud[key] !== undefined) { setter(cloud[key]); ls.set(key, cloud[key]); } };
    apply('workoutSchemas',  setWorkoutSchemas);
    apply('workoutSessions', setWorkoutSessions);
    apply('meals',           setMeals);
    apply('favMeals',        setFavMeals);
    apply('tasks',           setTasks);
    apply('weightLogs',      setWeightLogs);
    apply('checkIns',        setCheckIns);
    apply('activeDays',      setActiveDays);
    apply('habits',           setHabits);
    apply('habitLogs',        setHabitLogs);
    apply('customExercises',  setCustomExercises);
    apply('calorieGoal',      setCalorieGoal);
    apply('waterLogs',        setWaterLogs);
    apply('futurePlans',      setFuturePlans);
    apply('userProfile',      setUserProfile);
    apply('bodyMeasurements', setBodyMeasurements);
    apply('mealTemplates',    setMealTemplates);
  }, []);

  const handleAuth = useCallback(async user => {
    _uid = user.id;
    setUser(user);
    const cloud = await loadCloud();
    applyCloud(cloud);
    setAuthState('app');
  }, [applyCloud]);

  const signOut = useCallback(async () => {
    await db.auth.signOut();
    _uid = null; setUser(null); ls.clear(); setAuthState('auth');
  }, []);

  const markActive = useCallback(date => {
    setActiveDays(prev => {
      if (prev.includes(date)) return prev;
      const n = [...prev, date]; save('activeDays', n); return n;
    });
  }, []);

  // Refresh from cloud whenever the tab/app becomes visible again
  useEffect(() => {
    const onVisible = () => {
      if (document.visibilityState === 'visible' && _uid) {
        loadCloud().then(cloud => { if (cloud) applyCloud(cloud); });
      }
    };
    document.addEventListener('visibilitychange', onVisible);
    return () => document.removeEventListener('visibilitychange', onVisible);
  }, [applyCloud]);

  // Reload at midnight so TODAY constant stays correct
  useEffect(() => {
    const now = new Date();
    const msUntilMidnight = new Date(now.getFullYear(), now.getMonth(), now.getDate()+1, 0, 0, 5).getTime() - now.getTime();
    const t = setTimeout(() => window.location.reload(), msUntilMidnight);
    return () => clearTimeout(t);
  }, []);

  // Apply accent color on mount and when changed
  useEffect(() => { applyAccent(accentColor); }, [accentColor]);

  const changeAccent = color => { setAccentColor(color); ls.set('accentColor', color); };

  const exportData = () => {
    const data = { workoutSchemas, workoutSessions, meals, favMeals, tasks, weightLogs, checkIns, activeDays, habits, habitLogs, customExercises, calorieGoal, waterLogs, futurePlans, userProfile, bodyMeasurements, mealTemplates };
    const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = `mhealth-${TODAY}.json`; a.click();
    URL.revokeObjectURL(url);
  };

  useEffect(() => {
    db.auth.getSession().then(({ data: { session } }) => {
      if (session?.user) { handleAuth(session.user); }
      else { setAuthState('auth'); }
    });
    const { data: { subscription } } = db.auth.onAuthStateChange((event, session) => {
      if (event === 'SIGNED_OUT') { _uid = null; setUser(null); setAuthState('auth'); }
    });
    return () => subscription.unsubscribe();
  }, [handleAuth]);

  const navigate = section => { setActiveSection(section); document.querySelector('.main')?.scrollTo({top:0,behavior:'smooth'}); };
  const allData = { tasks, meals, workoutSessions, activeDays };

  if (authState === 'loading') return <Spinner text="Loading…"/>;
  if (authState === 'auth')    return <AuthScreen onSignIn={handleAuth}/>;

  return (
    <>
      <aside className="sidebar">
        <div className="sidebar-logo">M<span>Health</span></div>
        <nav className="sidebar-nav">
          {NAV.map(item=>(
            <div key={item.id} className={`sidebar-item ${activeSection===item.id?'active':''}`}
              onClick={()=>navigate(item.id)} role="button" tabIndex={0} onKeyDown={e=>e.key==='Enter'&&navigate(item.id)}>
              <Icon name={item.icon} size={18}/>{item.label}
            </div>
          ))}
        </nav>
        <div className="sidebar-footer">
          {/* Accent color picker */}
          <div style={{marginBottom:14}}>
            <div style={{fontSize:10,color:'var(--text3)',fontWeight:600,letterSpacing:'0.5px',marginBottom:8,textTransform:'uppercase'}}>Accent Color</div>
            <div style={{display:'flex',gap:7,flexWrap:'wrap'}}>
              {ACCENT_PRESETS.map(p=>(
                <button key={p.id} title={p.label} onClick={()=>changeAccent(p.id)} style={{
                  width:22,height:22,borderRadius:'50%',border:`2px solid ${accentColor===p.id?'var(--text)':'transparent'}`,
                  background:p.accent,cursor:'pointer',padding:0,outline:'none',transition:'border 0.15s'
                }}/>
              ))}
            </div>
          </div>
          <button className="btn btn-ghost btn-sm" style={{width:'100%',justifyContent:'center',gap:8,marginBottom:8}} onClick={exportData}>
            ↓ Export Data
          </button>
          <div className="sidebar-email">{user?.email}</div>
          <button className="btn btn-ghost btn-sm" style={{width:'100%',justifyContent:'center',gap:8}} onClick={signOut}>
            <Icon name="logout" size={14}/>Sign out
          </button>
        </div>
      </aside>

      <main className="main">
        {activeSection==='home'     && <HomeSection allData={allData} signOut={signOut} userEmail={user?.email} setWorkoutSessions={setWorkoutSessions} setTasks={setTasks} setMeals={setMeals} markActive={markActive}/>}
        {activeSection==='gym'      && <GymSection workoutSchemas={workoutSchemas} setWorkoutSchemas={setWorkoutSchemas} workoutSessions={workoutSessions} setWorkoutSessions={setWorkoutSessions} customExercises={customExercises} setCustomExercises={setCustomExercises} markActive={markActive}/>}
        {activeSection==='food'     && <FoodSection meals={meals} setMeals={setMeals} favMeals={favMeals} setFavMeals={setFavMeals} calorieGoal={calorieGoal} setCalorieGoal={setCalorieGoal} waterLogs={waterLogs} setWaterLogs={setWaterLogs} markActive={markActive} mealTemplates={mealTemplates} setMealTemplates={setMealTemplates}/>}
        {activeSection==='plan'     && <PlanningSection tasks={tasks} setTasks={setTasks} habits={habits} setHabits={setHabits} habitLogs={habitLogs} setHabitLogs={setHabitLogs} futurePlans={futurePlans} setFuturePlans={setFuturePlans} markActive={markActive}/>}
        {activeSection==='progress' && <ProgressSection weightLogs={weightLogs} setWeightLogs={setWeightLogs} checkIns={checkIns} setCheckIns={setCheckIns} markActive={markActive} userProfile={userProfile} setUserProfile={setUserProfile} bodyMeasurements={bodyMeasurements} setBodyMeasurements={setBodyMeasurements}/>}
      </main>

      <nav className="bottom-nav">
        {NAV.map(item=>(
          <div key={item.id} className={`bottom-nav-item ${activeSection===item.id?'active':''}`}
            onClick={()=>navigate(item.id)} role="button" tabIndex={0} onKeyDown={e=>e.key==='Enter'&&navigate(item.id)}>
            <Icon name={item.icon} size={22}/><span>{item.label}</span>
          </div>
        ))}
      </nav>
    </>
  );
};

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
