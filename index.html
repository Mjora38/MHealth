<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>MHealth</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet" />
<script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg: #0d0d0f; --bg2: #141417; --bg3: #1c1c21; --bg4: #242429;
  --border: #2a2a31; --text: #e8e8ec; --text2: #9898a8; --text3: #5a5a6a;
  --accent: oklch(75% 0.2 145); --accent-dim: oklch(75% 0.2 145 / 0.12); --accent-border: oklch(75% 0.2 145 / 0.3);
  --amber: oklch(75% 0.15 75); --amber-dim: oklch(75% 0.15 75 / 0.12);
  --red: oklch(68% 0.18 25); --red-dim: oklch(68% 0.18 25 / 0.12);
  --blue: oklch(68% 0.18 200);
  --font: 'DM Sans', sans-serif; --mono: 'DM Mono', monospace;
  --sidebar-w: 220px; --nav-h: 64px; --radius: 12px; --radius-sm: 8px;
  --safe-bottom: env(safe-area-inset-bottom, 0px);
}
html, body { height: 100%; background: var(--bg); color: var(--text); font-family: var(--font); -webkit-font-smoothing: antialiased; }
#root { height: 100%; display: flex; }
input, textarea, select, button { font-family: var(--font); }
button { cursor: pointer; border: none; background: none; color: inherit; }
input, textarea, select { background: var(--bg3); border: 1px solid var(--border); color: var(--text); border-radius: var(--radius-sm); padding: 10px 14px; font-size: 14px; outline: none; transition: border-color 0.2s; width: 100%; }
input:focus, textarea:focus, select:focus { border-color: var(--accent); }
input[type="range"] { padding: 0; height: 6px; cursor: pointer; }
select option { background: var(--bg3); }
::-webkit-scrollbar { width: 4px; } ::-webkit-scrollbar-track { background: transparent; } ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }
@keyframes spin { to { transform: rotate(360deg); } }
@keyframes fadein { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

/* SIDEBAR */
.sidebar { width: var(--sidebar-w); min-height: 100vh; background: var(--bg2); border-right: 1px solid var(--border); display: flex; flex-direction: column; padding: 28px 0 24px; flex-shrink: 0; position: fixed; left: 0; top: 0; bottom: 0; z-index: 100; }
.sidebar-logo { font-size: 20px; font-weight: 700; letter-spacing: -0.5px; padding: 0 24px 28px; color: var(--accent); }
.sidebar-logo span { color: var(--text); }
.sidebar-nav { display: flex; flex-direction: column; gap: 2px; flex: 1; padding: 0 12px; }
.sidebar-item { display: flex; align-items: center; gap: 12px; padding: 11px 14px; border-radius: var(--radius-sm); font-size: 14px; font-weight: 500; color: var(--text2); cursor: pointer; transition: all 0.15s; user-select: none; }
.sidebar-item:hover { color: var(--text); background: var(--bg3); }
.sidebar-item.active { color: var(--accent); background: var(--accent-dim); }
.sidebar-item svg { flex-shrink: 0; }
.sidebar-footer { padding: 12px 16px 0; border-top: 1px solid var(--border); margin-top: 8px; }
.sidebar-email { font-size: 11px; color: var(--text3); font-family: var(--mono); margin-bottom: 8px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* BOTTOM NAV */
.bottom-nav { display: none; position: fixed; bottom: 0; left: 0; right: 0; height: calc(var(--nav-h) + var(--safe-bottom)); padding-bottom: var(--safe-bottom); background: var(--bg2); border-top: 1px solid var(--border); z-index: 100; padding-left: 8px; padding-right: 8px; justify-content: space-around; align-items: center; }
.bottom-nav-item { display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 8px 12px; border-radius: var(--radius-sm); font-size: 10px; font-weight: 500; color: var(--text3); cursor: pointer; transition: all 0.15s; flex: 1; min-height: 44px; justify-content: center; -webkit-tap-highlight-color: transparent; }
.bottom-nav-item.active { color: var(--accent); }

/* MAIN */
.main { flex: 1; margin-left: var(--sidebar-w); min-height: 100vh; overflow-y: auto; overflow-x: hidden; display: flex; flex-direction: column; }
.section { flex: 1; padding: 36px 40px; max-width: 900px; width: 100%; margin: 0 auto; animation: fadein 0.2s ease; }

/* TYPE */
.section-title { font-size: 26px; font-weight: 700; letter-spacing: -0.5px; margin-bottom: 4px; }
.card { background: var(--bg2); border: 1px solid var(--border); border-radius: var(--radius); padding: 20px; }
.card-title { font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.8px; color: var(--text3); margin-bottom: 14px; }
.col { display: flex; flex-direction: column; gap: 12px; }
.grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

/* BUTTONS */
.btn { display: inline-flex; align-items: center; gap: 8px; padding: 10px 18px; border-radius: var(--radius-sm); font-size: 14px; font-weight: 600; cursor: pointer; transition: all 0.15s; border: 1px solid transparent; white-space: nowrap; -webkit-tap-highlight-color: transparent; min-height: 40px; }
.btn-primary { background: var(--accent); color: #0d0d0f; }
.btn-primary:hover { filter: brightness(1.1); } .btn-primary:active { filter: brightness(0.95); }
.btn-ghost { border-color: var(--border); color: var(--text2); } .btn-ghost:hover { border-color: var(--accent); color: var(--accent); }
.btn-danger { border-color: var(--red-dim); color: var(--red); } .btn-danger:hover { background: var(--red-dim); }
.btn-sm { padding: 7px 12px; font-size: 13px; min-height: 34px; }
.btn-icon { padding: 8px; border-radius: var(--radius-sm); }

/* BADGES */
.badge { display: inline-flex; align-items: center; padding: 3px 9px; border-radius: 99px; font-size: 11px; font-weight: 600; }
.badge-amber { background: var(--amber-dim); color: var(--amber); }
.badge-red { background: var(--red-dim); color: var(--red); }
.badge-gray { background: var(--bg4); color: var(--text2); }

/* TABS */
.tab-bar { display: flex; gap: 4px; margin-bottom: 24px; background: var(--bg3); padding: 4px; border-radius: 10px; width: fit-content; overflow-x: auto; }
.tab-bar::-webkit-scrollbar { display: none; }
.tab-btn { padding: 7px 16px; border-radius: 8px; font-size: 13px; font-weight: 500; transition: all 0.15s; cursor: pointer; white-space: nowrap; border: 1px solid transparent; -webkit-tap-highlight-color: transparent; }
.tab-btn.active { background: var(--bg2); color: var(--text); border-color: var(--border); }
.tab-btn:not(.active) { color: var(--text3); }

/* FORM */
.form-row { display: flex; gap: 10px; }
.form-group { display: flex; flex-direction: column; gap: 6px; flex: 1; }
.form-label { font-size: 12px; color: var(--text2); font-weight: 500; }

/* MISC */
.divider { height: 1px; background: var(--border); margin: 16px 0; }
.empty-state { text-align: center; padding: 40px 20px; color: var(--text3); font-size: 14px; }
.chart-wrap { position: relative; width: 100%; }
svg.chart { overflow: visible; }
.mobile-account { display: none; }

/* TABLET */
@media (max-width: 1024px) and (min-width: 769px) { :root { --sidebar-w: 180px; } .section { padding: 28px 24px; } }

/* MOBILE */
@media (max-width: 768px) {
  .sidebar { display: none; }
  .bottom-nav { display: flex; }
  .main { margin-left: 0; padding-bottom: calc(var(--nav-h) + var(--safe-bottom)); }
  .section { padding: 20px 16px; }
  .grid-2 { grid-template-columns: 1fr; }
  .form-row { flex-direction: column; }
  .section-title { font-size: 22px; }
  .card { padding: 16px; }
  .mobile-account { display: flex; }
}
@media (max-width: 360px) { .section { padding: 16px 12px; } .bottom-nav-item { padding: 6px 8px; font-size: 9px; } }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
// ── SUPABASE CONFIG ────────────────────────────────────────────────────────

const SUPABASE_URL = 'https://ncbkxzxxpfzagkzmzocb.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5jYmt4enh4cGZ6YWdrem16b2NiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzc4MDA1NTcsImV4cCI6MjA5MzM3NjU1N30.tXY_rjg8LrbGpTuTOgsTBNToaApq23tb4yST6cOwNXU';
const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const { useState, useEffect, useCallback, useMemo, useRef } = React;

// ── Storage ────────────────────────────────────────────────────────────────
let _uid = null;

const DATA_KEYS = ['workoutSchemas','workoutSessions','meals','favMeals','tasks','weightLogs','checkIns','activeDays'];

const ls = {
  get: (k, def) => { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : def; } catch { return def; } },
  set: (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
  clear: () => DATA_KEYS.forEach(k => localStorage.removeItem(k)),
};

const save = (key, value) => {
  ls.set(key, value);
  if (!_uid) return;
  db.from('user_data')
    .upsert({ user_id: _uid, key, value }, { onConflict: 'user_id,key' })
    .then(({ error }) => { if (error) console.warn('sync:', error.message); });
};

const loadCloud = async () => {
  if (!_uid) return null;
  const { data, error } = await db.from('user_data').select('key, value').eq('user_id', _uid);
  if (error || !data?.length) return null;
  return Object.fromEntries(data.map(r => [r.key, r.value]));
};

const TODAY = new Date().toISOString().split('T')[0];

// ── Icons ──────────────────────────────────────────────────────────────────
const Icon = ({ name, size = 20 }) => {
  const icons = {
    home: <svg width={size} height={size} fill="none" stroke="currentColor" strokeWidth="1.8" viewBox="0 0 24 24"><path d="M3 9.5L12 3l9 6.5V21a1 1 0 01-1 1H4a1 1 0 01-1-1V9.5z"/><path d="M9 22V12h6v10"/></svg>,
    dumbbell: <svg width={size} height={size} fill="none" stroke="currentColor" strokeWidth="1.8" viewBox="0 0 24 24"><rect x="1" y="10" width="4" height="4" rx="1"/><rect x="19" y="10" width="4" height="4" rx="1"/><rect x="5" y="8" width="3" height="8" rx="1"/><rect x="16" y="8" width="3" height="8" rx="1"/><line x1="8" y1="12" x2="16" y2="12" strokeWidth="2"/></svg>,
    food: <svg width={size} height={size} fill="none" stroke="currentColor" strokeWidth="1.8" viewBox="0 0 24 24"><path d="M18 8h1a4 4 0 010 8h-1"/><path d="M2 8h16v9a4 4 0 01-4 4H6a4 4 0 01-4-4V8z"/><line x1="6" y1="1" x2="6" y2="4"/><line x1="10" y1="1" x2="10" y2="4"/><line x1="14" y1="1" x2="14" y2="4"/></svg>,
    plan: <svg width={size} height={size} fill="none" stroke="currentColor" strokeWidth="1.8" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/><path d="M8 14h.01M12 14h.01M16 14h.01M8 18h.01M12 18h.01"/></svg>,
    progress: <svg width={size} height={size} fill="none" stroke="currentColor" strokeWidth="1.8" viewBox="0 0 24 24"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>,
    plus: <svg width={size} height={size} fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>,
    check: <svg width={size} height={size} fill="none" stroke="currentColor" strokeWidth="2.5" viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>,
    trash: <svg width={size} height={size} fill="none" stroke="currentColor" strokeWidth="1.8" viewBox="0 0 24 24"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14H6L5 6"/><path d="M10 11v6M14 11v6"/><path d="M9 6V4h6v2"/></svg>,
    starEmpty: <svg width={size} height={size} fill="none" stroke="currentColor" strokeWidth="1.8" viewBox="0 0 24 24"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg>,
    close: <svg width={size} height={size} fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path d="M18 6L6 18M6 6l12 12"/></svg>,
    logout: <svg width={size} height={size} fill="none" stroke="currentColor" strokeWidth="1.8" viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>,
    mail: <svg width={size} height={size} fill="none" stroke="currentColor" strokeWidth="1.8" viewBox="0 0 24 24"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="M2 7l10 7 10-7"/></svg>,
    lock: <svg width={size} height={size} fill="none" stroke="currentColor" strokeWidth="1.8" viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0110 0v4"/></svg>,
  };
  return icons[name] || null;
};

const QUOTES = [
  { text: "The only bad workout is the one that didn't happen.", author: "Unknown" },
  { text: "Take care of your body. It's the only place you have to live.", author: "Jim Rohn" },
  { text: "A year from now you'll wish you had started today.", author: "Karen Lamb" },
  { text: "It always seems impossible until it's done.", author: "Nelson Mandela" },
  { text: "Small steps in the right direction beat big steps in the wrong one.", author: "Unknown" },
  { text: "Your body can stand almost anything. It's your mind you have to convince.", author: "Unknown" },
  { text: "Don't wish for it. Work for it.", author: "Unknown" },
  { text: "Discipline is the bridge between goals and accomplishment.", author: "Jim Rohn" },
  { text: "Strive for progress, not perfection.", author: "Unknown" },
  { text: "It never gets easier. You just get stronger.", author: "Unknown" },
];

// ── Spinner ────────────────────────────────────────────────────────────────
const Spinner = ({ text = '' }) => (
  <div style={{height:'100vh',display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',background:'var(--bg)',gap:16}}>
    <div style={{width:32,height:32,border:'3px solid var(--border)',borderTopColor:'var(--accent)',borderRadius:'50%',animation:'spin 0.7s linear infinite'}}/>
    {text && <div style={{fontSize:13,color:'var(--text3)'}}>{text}</div>}
  </div>
);

// ── Auth Screen ────────────────────────────────────────────────────────────
const AuthScreen = ({ onSignIn }) => {
  const [mode, setMode] = useState('login');
  const [email, setEmail] = useState('');
  const [password, setPassword] = useState('');
  const [err, setErr] = useState('');
  const [loading, setLoading] = useState(false);
  const [emailSent, setEmailSent] = useState(false);

  const submit = async () => {
    if (!email.trim() || !password) return;
    setLoading(true); setErr('');
    if (mode === 'login') {
      const { data, error } = await db.auth.signInWithPassword({ email: email.trim(), password });
      setLoading(false);
      if (error) { setErr(error.message); return; }
      if (data.user) onSignIn(data.user);
    } else {
      const { data, error } = await db.auth.signUp({ email: email.trim(), password });
      setLoading(false);
      if (error) { setErr(error.message); return; }
      if (data.user?.identities?.length === 0) { setErr('Account already exists. Please sign in.'); return; }
      if (!data.session) { setEmailSent(true); return; }
      if (data.user) onSignIn(data.user);
    }
  };

  if (emailSent) return (
    <div style={{height:'100vh',display:'flex',alignItems:'center',justifyContent:'center',background:'var(--bg)',padding:24}}>
      <div style={{maxWidth:400,width:'100%',textAlign:'center'}}>
        <div style={{fontSize:40,marginBottom:16}}>📬</div>
        <div style={{fontSize:20,fontWeight:700,marginBottom:8}}>Check your email</div>
        <div style={{fontSize:14,color:'var(--text2)',marginBottom:24,lineHeight:1.6}}>
          We sent a confirmation link to <strong style={{color:'var(--text)'}}>{email}</strong>.<br/>Click it to activate your account, then sign in.
        </div>
        <button className="btn btn-ghost" onClick={() => { setEmailSent(false); setMode('login'); }}>Back to sign in</button>
      </div>
    </div>
  );

  return (
    <div style={{height:'100vh',display:'flex',alignItems:'center',justifyContent:'center',background:'var(--bg)',padding:24}}>
      <div style={{maxWidth:400,width:'100%'}}>
        <div style={{fontSize:28,fontWeight:700,letterSpacing:'-0.5px',marginBottom:4}}>
          <span style={{color:'var(--accent)'}}>M</span><span style={{color:'var(--text)'}}>Health</span>
        </div>
        <div style={{fontSize:14,color:'var(--text2)',marginBottom:32}}>
          {mode === 'login' ? 'Sign in to sync your data across all your devices' : 'Create your account to get started'}
        </div>
        <div className="col" style={{gap:14}}>
          <div className="form-group">
            <label className="form-label">Email</label>
            <div style={{position:'relative'}}>
              <span style={{position:'absolute',left:12,top:'50%',transform:'translateY(-50%)',color:'var(--text3)',pointerEvents:'none',display:'flex'}}><Icon name="mail" size={15}/></span>
              <input type="email" value={email} onChange={e=>setEmail(e.target.value)} placeholder="you@example.com"
                autoFocus autoComplete="email" style={{paddingLeft:36}} onKeyDown={e=>e.key==='Enter'&&submit()}/>
            </div>
          </div>
          <div className="form-group">
            <label className="form-label">Password</label>
            <div style={{position:'relative'}}>
              <span style={{position:'absolute',left:12,top:'50%',transform:'translateY(-50%)',color:'var(--text3)',pointerEvents:'none',display:'flex'}}><Icon name="lock" size={15}/></span>
              <input type="password" value={password} onChange={e=>setPassword(e.target.value)}
                placeholder={mode==='signup'?'At least 6 characters':'••••••••'}
                autoComplete={mode==='login'?'current-password':'new-password'}
                style={{paddingLeft:36}} onKeyDown={e=>e.key==='Enter'&&submit()}/>
            </div>
          </div>
          {err && <div style={{fontSize:13,color:'var(--red)',background:'var(--red-dim)',borderRadius:8,padding:'10px 14px'}}>{err}</div>}
          <button className="btn btn-primary" onClick={submit} disabled={loading} style={{justifyContent:'center',marginTop:4}}>
            {loading
              ? <span style={{width:16,height:16,border:'2px solid rgba(0,0,0,0.3)',borderTopColor:'#0d0d0f',borderRadius:'50%',animation:'spin 0.7s linear infinite',display:'inline-block'}}/>
              : mode==='login' ? 'Sign in' : 'Create account'}
          </button>
          <div style={{textAlign:'center',fontSize:13,color:'var(--text3)'}}>
            {mode==='login'
              ? <>Don't have an account? <button onClick={()=>{setMode('signup');setErr('');}} style={{color:'var(--accent)',fontWeight:600,cursor:'pointer',background:'none',border:'none',font:'inherit',padding:0}}>Sign up</button></>
              : <>Already have an account? <button onClick={()=>{setMode('login');setErr('');}} style={{color:'var(--accent)',fontWeight:600,cursor:'pointer',background:'none',border:'none',font:'inherit',padding:0}}>Sign in</button></>}
          </div>
        </div>
      </div>
    </div>
  );
};

// ── Line Chart ─────────────────────────────────────────────────────────────
const LineChart = ({ data, color = 'var(--accent)', height = 120, label = '' }) => {
  const ref = useRef(null);
  const [width, setWidth] = useState(500);
  useEffect(() => {
    if (!ref.current) return;
    const ro = new ResizeObserver(entries => { for (const e of entries) setWidth(e.contentRect.width || 500); });
    ro.observe(ref.current); setWidth(ref.current.offsetWidth || 500);
    return () => ro.disconnect();
  }, []);
  if (!data || data.length < 2) return <div className="empty-state" style={{padding:'20px 0'}}>Not enough data yet</div>;
  const vals = data.map(d=>d.value), min=Math.min(...vals), max=Math.max(...vals), range=max-min||1;
  const W=width, H=height, pad=10;
  const pts = data.map((d,i)=>[(i/(data.length-1))*(W-pad*2)+pad, H-((d.value-min)/range)*(H-pad*2)-pad]);
  const lineD = pts.map((p,i)=>`${i===0?'M':'L'}${p[0].toFixed(1)},${p[1].toFixed(1)}`).join(' ');
  const areaD = lineD+` L${pts[pts.length-1][0].toFixed(1)},${H} L${pts[0][0].toFixed(1)},${H} Z`;
  const gid = `g-${label.replace(/\s/g,'_')}`;
  return (
    <div className="chart-wrap" ref={ref}>
      <svg viewBox={`0 0 ${W} ${H}`} className="chart" style={{width:'100%',height:H,display:'block'}}>
        <defs><linearGradient id={gid} x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stopColor={color} stopOpacity="0.25"/><stop offset="100%" stopColor={color} stopOpacity="0.02"/></linearGradient></defs>
        <path d={areaD} fill={`url(#${gid})`}/>
        <path d={lineD} fill="none" stroke={color} strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"/>
        {pts.map(([x,y],i)=><g key={i}><circle cx={x} cy={y} r="5" fill={color} stroke="var(--bg2)" strokeWidth="2"/><title>{`${data[i].date}: ${data[i].value}`}</title></g>)}
      </svg>
      <div style={{display:'flex',justifyContent:'space-between',marginTop:6,fontSize:11,color:'var(--text3)',fontFamily:'var(--mono)'}}>
        <span>{data[0]?.date}</span><span>{data[data.length-1]?.date}</span>
      </div>
    </div>
  );
};

// ── Streak Ring ────────────────────────────────────────────────────────────
const StreakRing = ({ streak }) => {
  const r=44, circ=2*Math.PI*r, pct=Math.min(streak/30,1);
  return (
    <div style={{position:'relative',width:110,height:110,flexShrink:0}}>
      <svg width="110" height="110" viewBox="0 0 110 110" style={{transform:'rotate(-90deg)'}}>

// ── Modal ──────────────────────────────────────────────────────────────────
const Modal = ({ title, onClose, children }) => {
  useEffect(() => {
    const h = e => { if (e.key==='Escape') onClose(); };
    document.addEventListener('keydown', h); return () => document.removeEventListener('keydown', h);
  }, [onClose]);
  return (
    <div style={{position:'fixed',inset:0,background:'rgba(0,0,0,0.75)',display:'flex',alignItems:'center',justifyContent:'center',zIndex:200,padding:16}}
      onClick={e=>e.target===e.currentTarget&&onClose()}>
      <div style={{background:'var(--bg2)',border:'1px solid var(--border)',borderRadius:16,padding:24,width:'100%',maxWidth:480,maxHeight:'90vh',overflowY:'auto'}}>
        <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:20}}>
          <span style={{fontSize:18,fontWeight:700}}>{title}</span>
          <button className="btn btn-icon btn-ghost" onClick={onClose}><Icon name="close" size={16}/></button>
        </div>
        {children}
      </div>
    </div>
  );
};

const HomeSection = ({ allData, signOut, userEmail }) => {
  const quote = useMemo(()=>QUOTES[new Date().getDate()%QUOTES.length],[]);
  const { tasks, meals, workoutSessions, activeDays } = allData;
  const todayTasks = tasks.filter(t=>t.date===TODAY).slice(0,5);
  const todayMeals = meals[TODAY]||{};
  const todayWorkouts = workoutSessions.filter(w=>w.date===TODAY);
  const totalCals = Object.values(todayMeals).flat().reduce((s,m)=>s+(m?.calories||0),0);
  const hasMeals = ['breakfast','lunch','dinner','snacks'].some(s=>todayMeals[s]?.length>0);
  const streak = useMemo(()=>{
    const days=[...new Set([...activeDays,TODAY])].sort().reverse();
    let s=0,prev=null;
    for(const d of days){if(!prev){s=1;prev=d;continue;}if(Math.round((new Date(prev)-new Date(d))/86400000)===1){s++;prev=d;}else break;}
    return s;
  },[activeDays]);
  return (
    <div className="section">
      <div className="mobile-account" style={{justifyContent:'space-between',alignItems:'center',marginBottom:20}}>
        <span style={{fontSize:12,color:'var(--text3)',fontFamily:'var(--mono)',overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap',maxWidth:'65%'}}>{userEmail}</span>
        <button className="btn btn-ghost btn-sm" onClick={signOut} style={{gap:6,flexShrink:0}}><Icon name="logout" size={13}/>Sign out</button>
      </div>
      <div style={{background:'var(--accent-dim)',border:'1px solid var(--accent-border)',borderRadius:'var(--radius)',padding:'16px 20px',marginBottom:24}}>
        <p style={{fontSize:15,fontWeight:500,lineHeight:1.6,fontStyle:'italic'}}>"{quote.text}"</p>
        <p style={{fontSize:12,color:'var(--accent)',marginTop:8,fontFamily:'var(--mono)'}}>— {quote.author}</p>
      </div>
      <div className="card" style={{display:'flex',alignItems:'center',gap:24,marginBottom:24,flexWrap:'wrap'}}>
        <StreakRing streak={streak}/>
        <div>
          <div style={{fontSize:13,color:'var(--text2)',marginBottom:4}}>Current Streak</div>
          <div style={{fontSize:22,fontWeight:700}}>{streak} day{streak!==1?'s':''} 🔥</div>
          <div style={{fontSize:12,color:'var(--text3)',marginTop:6,fontFamily:'var(--mono)'}}>{new Date().toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric'})}</div>
        </div>
      </div>
      <div className="grid-2" style={{gap:16}}>
        <div className="card">
          <div className="card-title">Today's Tasks</div>
          {todayTasks.length===0?<div style={{color:'var(--text3)',fontSize:13}}>No tasks for today</div>
            :<div className="col" style={{gap:8}}>{todayTasks.map(t=>(
              <div key={t.id} style={{display:'flex',alignItems:'center',gap:10,opacity:t.done?0.5:1}}>
                <div style={{width:8,height:8,borderRadius:'50%',flexShrink:0,background:t.priority==='high'?'var(--red)':t.priority==='medium'?'var(--amber)':'var(--text3)'}}/>
                <span style={{fontSize:13,textDecoration:t.done?'line-through':'none',flex:1}}>{t.text}</span>
              </div>))}</div>}
        </div>
        <div className="card">
          <div className="card-title">Meals Today</div>
          {!hasMeals?<div style={{color:'var(--text3)',fontSize:13}}>No meals logged</div>
            :<div className="col" style={{gap:8}}>
              {['breakfast','lunch','dinner','snacks'].filter(m=>todayMeals[m]?.length>0).map(slot=>(
                <div key={slot} style={{display:'flex',justifyContent:'space-between',alignItems:'center'}}>
                  <span style={{fontSize:12,color:'var(--text2)',textTransform:'capitalize'}}>{slot}</span>
                  <span style={{fontSize:12,color:'var(--text3)',fontFamily:'var(--mono)'}}>{todayMeals[slot].reduce((s,m)=>s+(m.calories||0),0)} kcal</span>

              <div style={{display:'flex',justifyContent:'space-between'}}>

                  <div style={{fontSize:13,fontWeight:600}}>{w.exercise}</div>

// ── FOOD ──────────────────────────────────────────────────────────────────
const FoodSection = ({ meals, setMeals, favMeals, setFavMeals, markActive }) => {
  const [selectedDate, setSelectedDate] = useState(TODAY);
  const [showAddModal, setShowAddModal] = useState(false);
  const [addSlot, setAddSlot] = useState('breakfast');
  const [mealForm, setMealForm] = useState({ name:'', calories:'' });
  const [tab, setTab] = useState('plan');
  const SLOTS=['breakfast','lunch','dinner','snacks'];
  const slotIcon={breakfast:'☀️',lunch:'🌤️',dinner:'🌙',snacks:'🍎'};
  const dayMeals=meals[selectedDate]||{};
  const totalCals=SLOTS.reduce((s,slot)=>s+(dayMeals[slot]||[]).reduce((a,m)=>a+(m.calories||0),0),0);
  const openAdd=slot=>{setAddSlot(slot);setMealForm({name:'',calories:''});setShowAddModal(true);};
  const addMeal=()=>{
    if(!mealForm.name.trim())return;
    const m={id:Date.now(),name:mealForm.name.trim(),calories:parseInt(mealForm.calories)||0};
    setMeals(prev=>{const day=prev[selectedDate]||{};const updated={...prev,[selectedDate]:{...day,[addSlot]:[...(day[addSlot]||[]),m]}};save('meals',updated);return updated;});
    markActive(selectedDate);setShowAddModal(false);
  };
  const removeMeal=(slot,id)=>setMeals(prev=>{const day=prev[selectedDate]||{};const updated={...prev,[selectedDate]:{...day,[slot]:(day[slot]||[]).filter(m=>m.id!==id)}};save('meals',updated);return updated;});
  const saveFav=meal=>{
    if(favMeals.find(f=>f.name===meal.name))return;
    setFavMeals(prev=>{const n=[...prev,{...meal,id:Date.now()}];save('favMeals',n);return n;});
  };
  const addFavToSlot=(fav,slot)=>setMeals(prev=>{const day=prev[selectedDate]||{};const updated={...prev,[selectedDate]:{...day,[slot]:[...(day[slot]||[]),{...fav,id:Date.now()}]}};save('meals',updated);return updated;});
  const deleteFav=id=>setFavMeals(prev=>{const n=prev.filter(f=>f.id!==id);save('favMeals',n);return n;});
  return (
    <div className="section">
      <div style={{display:'flex',alignItems:'flex-start',justifyContent:'space-between',marginBottom:24}}>
        <div className="section-title">Food</div>
        <input type="date" value={selectedDate} onChange={e=>setSelectedDate(e.target.value)} style={{width:'auto',fontSize:13}}/>
      </div>
      <div className="tab-bar">
        {[['plan','Meal Plan'],['favorites','Favorites']].map(([id,label])=>(
          <button key={id} className={`tab-btn ${tab===id?'active':''}`} onClick={()=>setTab(id)}>{label}</button>
        ))}
      </div>
      {tab==='plan'&&<div className="col">
        <div style={{background:'var(--accent-dim)',border:'1px solid var(--accent-border)',borderRadius:12,padding:'14px 20px',display:'flex',alignItems:'center',justifyContent:'space-between'}}>
          <span style={{fontSize:13,color:'var(--text2)'}}>Daily Total</span>
          <span style={{fontSize:24,fontWeight:700,color:'var(--accent)',fontFamily:'var(--mono)'}}>{totalCals} <span style={{fontSize:14}}>kcal</span></span>
        </div>
        {SLOTS.map(slot=>{
          const items=dayMeals[slot]||[];const slotCals=items.reduce((s,m)=>s+(m.calories||0),0);
          return (
            <div key={slot} className="card">
              <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:12}}>
                <div style={{display:'flex',alignItems:'center',gap:8}}>
                  <span style={{fontSize:16}}>{slotIcon[slot]}</span>
                  <div className="card-title" style={{marginBottom:0,textTransform:'capitalize'}}>{slot}</div>
                </div>
                <div style={{display:'flex',alignItems:'center',gap:10}}>

                  <button className="btn btn-icon btn-ghost btn-sm" onClick={()=>openAdd(slot)}><Icon name="plus" size={14}/></button>

              </div>
              {items.length===0?<div style={{fontSize:12,color:'var(--text3)'}}>No items — tap + to add</div>
                :<div className="col" style={{gap:8}}>{items.map(m=>(
                  <div key={m.id} style={{display:'flex',alignItems:'center',gap:8}}>
                    <span style={{fontSize:13,flex:1,minWidth:0,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{m.name}</span>
                    <span style={{fontSize:12,color:'var(--text2)',fontFamily:'var(--mono)',flexShrink:0}}>{m.calories} kcal</span>
                    <button className="btn btn-icon" style={{color:'var(--amber)',padding:4,flexShrink:0}} onClick={()=>saveFav(m)}><Icon name="starEmpty" size={13}/></button>
                    <button className="btn btn-icon btn-danger" style={{padding:4,flexShrink:0}} onClick={()=>removeMeal(slot,m.id)}><Icon name="close" size={13}/></button>
                  </div>))}</div>}
              {favMeals.length>0&&<div style={{marginTop:12,display:'flex',flexWrap:'wrap',gap:6}}>
                {favMeals.map(f=><button key={f.id} onClick={()=>addFavToSlot(f,slot)}
                  style={{fontSize:11,padding:'4px 10px',borderRadius:99,border:'1px dashed var(--border)',color:'var(--text3)',cursor:'pointer',background:'none',transition:'color 0.15s'}}
                  onMouseOver={e=>e.currentTarget.style.color='var(--accent)'}
                  onMouseOut={e=>e.currentTarget.style.color='var(--text3)'}>+ {f.name}</button>)}
              </div>}
            </div>);
        })}
      </div>}
      {tab==='favorites'&&<div className="col">
        {favMeals.length===0?<div className="empty-state">No favorites yet — tap ☆ on a meal to save it</div>

            <div key={f.id} className="card" style={{display:'flex',alignItems:'center',justifyContent:'space-between',gap:12}}>
              <div style={{minWidth:0}}>
                <div style={{fontSize:14,fontWeight:500,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{f.name}</div>
                <div style={{fontSize:12,color:'var(--text2)',fontFamily:'var(--mono)',marginTop:2}}>{f.calories} kcal</div>
              </div>
              <button className="btn btn-icon btn-danger" style={{flexShrink:0}} onClick={()=>deleteFav(f.id)}><Icon name="trash" size={15}/></button>
            </div>))}</div>}
      </div>}
      {showAddModal&&<Modal title={`Add to ${addSlot}`} onClose={()=>setShowAddModal(false)}>
        <div className="col">
          <div className="form-group"><label className="form-label">Meal name</label>
            <input value={mealForm.name} onChange={e=>setMealForm(p=>({...p,name:e.target.value}))} placeholder="Chicken & rice" autoFocus onKeyDown={e=>e.key==='Enter'&&addMeal()}/></div>
          <div className="form-group"><label className="form-label">Calories</label>
            <input type="number" min="0" value={mealForm.calories} onChange={e=>setMealForm(p=>({...p,calories:e.target.value}))} placeholder="450" onKeyDown={e=>e.key==='Enter'&&addMeal()}/></div>
          <button className="btn btn-primary" onClick={addMeal}>Add Meal</button>
        </div>
      </Modal>}
    </div>
  );
};

// ── PLANNING ──────────────────────────────────────────────────────────────
const PlanningSection = ({ tasks, setTasks, markActive }) => {
  const [tab, setTab] = useState('today');
  const [selectedDate, setSelectedDate] = useState(TODAY);
  const [form, setForm] = useState({ text:'', priority:'medium', date:TODAY });
  const [showModal, setShowModal] = useState(false);
  const todayTasks=tasks.filter(t=>t.date===selectedDate).sort((a,b)=>({high:0,medium:1,low:2}[a.priority]-{high:0,medium:1,low:2}[b.priority]));
  const doneCount=todayTasks.filter(t=>t.done).length;
  const addTask=()=>{
    if(!form.text.trim())return;
    const t={id:Date.now(),text:form.text.trim(),priority:form.priority,date:form.date,done:false};
    setTasks(prev=>{const n=[...prev,t];save('tasks',n);return n;});
    markActive(form.date);setForm({text:'',priority:'medium',date:TODAY});setShowModal(false);
  };
  const toggleDone=id=>setTasks(prev=>{const n=prev.map(t=>t.id===id?{...t,done:!t.done}:t);save('tasks',n);return n;});
  const deleteTask=id=>setTasks(prev=>{const n=prev.filter(t=>t.id!==id);save('tasks',n);return n;});
  const weekStart=useMemo(()=>{const d=new Date();d.setDate(d.getDate()-d.getDay());return d;},[]);
  const weekDays=useMemo(()=>Array.from({length:7},(_,i)=>{const d=new Date(weekStart);d.setDate(weekStart.getDate()+i);return d.toISOString().split('T')[0];}),[weekStart]);
  const pClass=p=>p==='high'?'badge-red':p==='medium'?'badge-amber':'badge-gray';
  const pColor=p=>p==='high'?'var(--red)':p==='medium'?'var(--amber)':'var(--text3)';
  return (
    <div className="section">
      <div style={{display:'flex',alignItems:'flex-start',justifyContent:'space-between',marginBottom:24}}>
        <div className="section-title">Planning</div>
        <button className="btn btn-primary btn-sm" onClick={()=>setShowModal(true)}><Icon name="plus" size={15}/>Add Task</button>
      </div>
      <div className="tab-bar">
        {[['today','Daily'],['week','Weekly']].map(([id,label])=>(
          <button key={id} className={`tab-btn ${tab===id?'active':''}`} onClick={()=>setTab(id)}>{label}</button>
        ))}
      </div>
      {tab==='today'&&<div className="col">
        <div style={{display:'flex',gap:10,alignItems:'center',flexWrap:'wrap'}}>
          <input type="date" value={selectedDate} onChange={e=>setSelectedDate(e.target.value)} style={{width:'auto',fontSize:13}}/>
          {todayTasks.length>0&&<span style={{fontSize:12,color:'var(--text3)'}}>{doneCount}/{todayTasks.length} done{doneCount===todayTasks.length&&todayTasks.length>0&&' 🎉'}</span>}
        </div>
        {todayTasks.length===0?<div className="empty-state">No tasks for this day</div>
          :<div className="col" style={{gap:8}}>{todayTasks.map(t=>(
            <div key={t.id} className="card" style={{display:'flex',alignItems:'center',gap:12,padding:'14px 16px',opacity:t.done?0.6:1,transition:'opacity 0.2s'}}>
              <button onClick={()=>toggleDone(t.id)} style={{width:22,height:22,borderRadius:6,flexShrink:0,display:'flex',alignItems:'center',justifyContent:'center',
                border:`2px solid ${t.done?'var(--accent)':'var(--border)'}`,background:t.done?'var(--accent)':'transparent',transition:'all 0.15s',cursor:'pointer'}}>
                {t.done&&<Icon name="check" size={12}/>}
              </button>
              <span style={{flex:1,fontSize:14,textDecoration:t.done?'line-through':'none',minWidth:0,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{t.text}</span>
              <span className={`badge ${pClass(t.priority)}`} style={{flexShrink:0}}>{t.priority}</span>
              <button className="btn btn-icon btn-danger" onClick={()=>deleteTask(t.id)}><Icon name="trash" size={14}/></button>
            </div>))}</div>}
      </div>}
      {tab==='week'&&<div className="col">
        {weekDays.map(date=>{
          const dt=tasks.filter(t=>t.date===date);
          const dn=new Date(date+'T12:00').toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'});
          const it=date===TODAY;
          return (
            <div key={date} className="card" style={{borderColor:it?'var(--accent-border)':'var(--border)'}}>
              <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:dt.length?8:0}}>
                <div style={{fontSize:13,fontWeight:600,color:it?'var(--accent)':'var(--text)'}}>{dn}{it&&<span style={{color:'var(--text3)',fontWeight:400}}> · today</span>}</div>
                <span style={{fontSize:11,color:'var(--text3)',fontFamily:'var(--mono)'}}>{dt.filter(t=>t.done).length}/{dt.length}</span>
              </div>
              {dt.length===0?<div style={{fontSize:12,color:'var(--text3)'}}>—</div>
                :<div style={{display:'flex',flexDirection:'column',gap:6}}>{dt.map(t=>(
                  <div key={t.id} style={{display:'flex',alignItems:'center',gap:8}}>
                    <div style={{width:6,height:6,borderRadius:'50%',flexShrink:0,background:pColor(t.priority)}}/>
                    <span style={{fontSize:12,flex:1,textDecoration:t.done?'line-through':'none',color:t.done?'var(--text3)':'var(--text)',overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{t.text}</span>
                  </div>))}</div>}
            </div>);})}
      </div>}
      {showModal&&<Modal title="Add Task" onClose={()=>setShowModal(false)}>
        <div className="col">
          <div className="form-group"><label className="form-label">Task</label>
            <input value={form.text} onChange={e=>setForm(p=>({...p,text:e.target.value}))} placeholder="What do you need to do?" autoFocus onKeyDown={e=>e.key==='Enter'&&addTask()}/></div>
          <div className="form-row">
            <div className="form-group"><label className="form-label">Priority</label>
              <select value={form.priority} onChange={e=>setForm(p=>({...p,priority:e.target.value}))}>
                <option value="high">🔴 High</option><option value="medium">🟡 Medium</option><option value="low">⚪ Low</option>
              </select></div>
            <div className="form-group"><label className="form-label">Date</label>
              <input type="date" value={form.date} onChange={e=>setForm(p=>({...p,date:e.target.value}))}/></div>
          </div>
          <button className="btn btn-primary" onClick={addTask}>Add Task</button>
        </div>
      </Modal>}
    </div>
  );
};

// ── PROGRESS ──────────────────────────────────────────────────────────────
const ProgressSection = ({ weightLogs, setWeightLogs, checkIns, setCheckIns, markActive }) => {
  const [showWeightModal, setShowWeightModal] = useState(false);
  const [showCheckInModal, setShowCheckInModal] = useState(false);
  const [weightForm, setWeightForm] = useState({ date:TODAY, weight:'' });
  const [checkForm, setCheckForm] = useState({ date:TODAY, energy:5, mood:5, notes:'' });
  const addWeight=()=>{
    if(!weightForm.weight)return;
    const w={id:Date.now(),date:weightForm.date,value:parseFloat(weightForm.weight)};
    setWeightLogs(prev=>{const n=[...prev.filter(x=>x.date!==weightForm.date),w].sort((a,b)=>a.date.localeCompare(b.date));save('weightLogs',n);return n;});
    markActive(weightForm.date);setWeightForm({date:TODAY,weight:''});setShowWeightModal(false);
  };
  const addCheckIn=()=>{
    const c={id:Date.now(),...checkForm};
    setCheckIns(prev=>{const n=[...prev.filter(x=>x.date!==checkForm.date),c].sort((a,b)=>a.date.localeCompare(b.date));save('checkIns',n);return n;});
    markActive(checkForm.date);setCheckForm({date:TODAY,energy:5,mood:5,notes:''});setShowCheckInModal(false);
  };
  const deleteWeight=id=>setWeightLogs(prev=>{const n=prev.filter(w=>w.id!==id);save('weightLogs',n);return n;});
  const deleteCheckIn=id=>setCheckIns(prev=>{const n=prev.filter(c=>c.id!==id);save('checkIns',n);return n;});
  const lw=weightLogs[weightLogs.length-1], lc=checkIns[checkIns.length-1];
  const wd=weightLogs.length>=2?(weightLogs[weightLogs.length-1].value-weightLogs[weightLogs.length-2].value).toFixed(1):null;
  return (
    <div className="section">
      <div className="section-title" style={{marginBottom:24}}>Progress</div>
      <div className="grid-2" style={{marginBottom:16}}>
        <div className="card" style={{display:'flex',alignItems:'center',justifyContent:'space-between',gap:12}}>
          <div style={{minWidth:0}}>
            <div className="card-title">Current Weight</div>
            <div style={{fontSize:28,fontWeight:700,fontFamily:'var(--mono)',color:'var(--accent)'}}>{lw?`${lw.value} kg`:'—'}</div>
            {wd!==null&&<div style={{fontSize:11,color:parseFloat(wd)<0?'var(--accent)':'var(--red)',marginTop:2,fontFamily:'var(--mono)'}}>{parseFloat(wd)>0?'+':''}{wd} kg from last</div>}
            {lw&&<div style={{fontSize:11,color:'var(--text3)',marginTop:2}}>{lw.date}</div>}
          </div>
          <button className="btn btn-ghost btn-sm" onClick={()=>setShowWeightModal(true)} style={{flexShrink:0}}><Icon name="plus" size={14}/>Log</button>
        </div>
        <div className="card" style={{display:'flex',alignItems:'center',justifyContent:'space-between',gap:12}}>
          <div style={{minWidth:0}}>
            <div className="card-title">Last Check-in</div>
            {lc?<div style={{display:'flex',gap:16,marginTop:4}}>
              <div><div style={{fontSize:11,color:'var(--text3)'}}>Mood</div><div style={{fontSize:20,fontWeight:700,fontFamily:'var(--mono)',color:'var(--amber)'}}>{lc.mood}<span style={{fontSize:13}}>/10</span></div></div>
              <div><div style={{fontSize:11,color:'var(--text3)'}}>Energy</div><div style={{fontSize:20,fontWeight:700,fontFamily:'var(--mono)',color:'var(--accent)'}}>{lc.energy}<span style={{fontSize:13}}>/10</span></div></div>
            </div>:<div style={{color:'var(--text3)',fontSize:13,marginTop:4}}>No check-in yet</div>}
            {lc&&<div style={{fontSize:11,color:'var(--text3)',marginTop:2}}>{lc.date}</div>}
          </div>
          <button className="btn btn-ghost btn-sm" onClick={()=>setShowCheckInModal(true)} style={{flexShrink:0}}><Icon name="plus" size={14}/>Log</button>
        </div>
      </div>
      <div className="col">
        <div className="card"><div className="card-title">Weight Over Time</div><LineChart data={weightLogs.map(w=>({date:w.date.slice(5),value:w.value}))} label="weight"/></div>
        <div className="grid-2">
          <div className="card"><div className="card-title">Mood</div><LineChart data={checkIns.map(c=>({date:c.date.slice(5),value:c.mood}))} color="var(--amber)" height={90} label="mood"/></div>
          <div className="card"><div className="card-title">Energy</div><LineChart data={checkIns.map(c=>({date:c.date.slice(5),value:c.energy}))} color="var(--blue)" height={90} label="energy"/></div>
        </div>
        {weightLogs.length>0&&<div className="card"><div className="card-title">Weight Log</div>
          <div className="col" style={{gap:6}}>{[...weightLogs].reverse().slice(0,8).map(w=>(
            <div key={w.id} style={{display:'flex',alignItems:'center',gap:12,padding:'6px 0',borderBottom:'1px solid var(--border)'}}>
              <div style={{fontSize:12,color:'var(--text3)',fontFamily:'var(--mono)',minWidth:80}}>{w.date}</div>
              <div style={{flex:1,fontSize:14,fontWeight:600,fontFamily:'var(--mono)',color:'var(--accent)'}}>{w.value} kg</div>
              <button className="btn btn-icon btn-danger" style={{padding:4}} onClick={()=>deleteWeight(w.id)}><Icon name="trash" size={13}/></button>
            </div>))}</div>
        </div>}
        {checkIns.length>0&&<div className="card"><div className="card-title">Check-in History</div>
          <div className="col" style={{gap:6}}>{[...checkIns].reverse().slice(0,6).map(c=>(
            <div key={c.id} style={{display:'flex',alignItems:'center',gap:12,padding:'8px 0',borderBottom:'1px solid var(--border)'}}>
              <div style={{fontSize:12,color:'var(--text3)',fontFamily:'var(--mono)',minWidth:80}}>{c.date}</div>
              <div style={{fontSize:12}}>Mood <span style={{color:'var(--amber)',fontWeight:600}}>{c.mood}/10</span></div>
              <div style={{fontSize:12}}>Energy <span style={{color:'var(--accent)',fontWeight:600}}>{c.energy}/10</span></div>
              {c.notes&&<div style={{fontSize:12,color:'var(--text2)',flex:1,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}} title={c.notes}>{c.notes}</div>}
              <button className="btn btn-icon btn-danger" style={{padding:4,flexShrink:0}} onClick={()=>deleteCheckIn(c.id)}><Icon name="trash" size={13}/></button>
            </div>))}</div>
        </div>}
      </div>
      {showWeightModal&&<Modal title="Log Weight" onClose={()=>setShowWeightModal(false)}>
        <div className="col">
          <div className="form-row">
            <div className="form-group"><label className="form-label">Weight (kg)</label>
              <input type="number" min="0" step="0.1" value={weightForm.weight} onChange={e=>setWeightForm(p=>({...p,weight:e.target.value}))} placeholder="75.5" autoFocus onKeyDown={e=>e.key==='Enter'&&addWeight()}/></div>
            <div className="form-group"><label className="form-label">Date</label>
              <input type="date" value={weightForm.date} onChange={e=>setWeightForm(p=>({...p,date:e.target.value}))}/></div>
          </div>
          <button className="btn btn-primary" onClick={addWeight}>Save Weight</button>
        </div>
      </Modal>}
      {showCheckInModal&&<Modal title="Weekly Check-in" onClose={()=>setShowCheckInModal(false)}>
        <div className="col">
          <div className="form-group"><label className="form-label">Date</label>
            <input type="date" value={checkForm.date} onChange={e=>setCheckForm(p=>({...p,date:e.target.value}))}/></div>
          <div className="form-group">
            <label className="form-label">Energy — <span style={{color:'var(--accent)',fontFamily:'var(--mono)'}}>{checkForm.energy}/10</span></label>
            <input type="range" min="1" max="10" value={checkForm.energy} onChange={e=>setCheckForm(p=>({...p,energy:parseInt(e.target.value)}))} style={{background:'var(--bg4)',accentColor:'var(--accent)',width:'100%'}}/></div>
          <div className="form-group">
            <label className="form-label">Mood — <span style={{color:'var(--amber)',fontFamily:'var(--mono)'}}>{checkForm.mood}/10</span></label>
            <input type="range" min="1" max="10" value={checkForm.mood} onChange={e=>setCheckForm(p=>({...p,mood:parseInt(e.target.value)}))} style={{background:'var(--bg4)',accentColor:'var(--amber)',width:'100%'}}/></div>
          <div className="form-group"><label className="form-label">Notes</label>
            <textarea value={checkForm.notes} onChange={e=>setCheckForm(p=>({...p,notes:e.target.value}))} rows={3} placeholder="How was your week?"/></div>
          <button className="btn btn-primary" onClick={addCheckIn}>Save Check-in</button>
        </div>
      </Modal>}
    </div>
  );
};

// ── APP ROOT ──────────────────────────────────────────────────────────────
const NAV = [
  {id:'home',label:'Home',icon:'home'},
  {id:'gym',label:'Gym',icon:'dumbbell'},
  {id:'food',label:'Food',icon:'food'},
  {id:'plan',label:'Plan',icon:'plan'},
  {id:'progress',label:'Progress',icon:'progress'},
];

const App = () => {
  const [authState, setAuthState] = useState('loading');
  const [user, setUser] = useState(null);
  const [activeSection, setActiveSection] = useState('home');

  const [workoutSchemas,  setWorkoutSchemas]  = useState(()=>ls.get('workoutSchemas',[]));
  const [workoutSessions, setWorkoutSessions] = useState(()=>ls.get('workoutSessions',[]));
  const [meals,           setMeals]           = useState(()=>ls.get('meals',{}));
  const [favMeals,        setFavMeals]        = useState(()=>ls.get('favMeals',[]));
  const [tasks,           setTasks]           = useState(()=>ls.get('tasks',[]));
  const [weightLogs,      setWeightLogs]      = useState(()=>ls.get('weightLogs',[]));
  const [checkIns,        setCheckIns]        = useState(()=>ls.get('checkIns',[]));
  const [activeDays,      setActiveDays]      = useState(()=>ls.get('activeDays',[]));

  const applyCloud = useCallback(cloud => {
    if (!cloud) return;
    const apply = (key, setter) => { if (cloud[key] !== undefined) { setter(cloud[key]); ls.set(key, cloud[key]); } };
    apply('workoutSchemas',  setWorkoutSchemas);
    apply('workoutSessions', setWorkoutSessions);
    apply('meals',           setMeals);
    apply('favMeals',        setFavMeals);
    apply('tasks',           setTasks);
    apply('weightLogs',      setWeightLogs);
    apply('checkIns',        setCheckIns);
    apply('activeDays',      setActiveDays);
  }, []);

  const handleAuth = useCallback(async user => {
    _uid = user.id;
    setUser(user);
    const cloud = await loadCloud();
    applyCloud(cloud);
    setAuthState('app');
  }, [applyCloud]);

  const signOut = useCallback(async () => {
    await db.auth.signOut();
    _uid = null; setUser(null); ls.clear(); setAuthState('auth');
  }, []);

  const markActive = useCallback(date => {
    setActiveDays(prev => {
      if (prev.includes(date)) return prev;
      const n = [...prev, date]; save('activeDays', n); return n;
    });
  }, []);

  // Refresh from cloud whenever the tab/app becomes visible again
  useEffect(() => {
    const onVisible = () => {
      if (document.visibilityState === 'visible' && _uid) {
        loadCloud().then(cloud => { if (cloud) applyCloud(cloud); });
      }
    };
    document.addEventListener('visibilitychange', onVisible);
    return () => document.removeEventListener('visibilitychange', onVisible);
  }, [applyCloud]);

  useEffect(() => {
    db.auth.getSession().then(({ data: { session } }) => {
      if (session?.user) { handleAuth(session.user); }
      else { setAuthState('auth'); }
    });
    const { data: { subscription } } = db.auth.onAuthStateChange((event, session) => {
      if (event === 'SIGNED_OUT') { _uid = null; setUser(null); setAuthState('auth'); }
    });
    return () => subscription.unsubscribe();
  }, [handleAuth]);

  const navigate = section => { setActiveSection(section); document.querySelector('.main')?.scrollTo({top:0,behavior:'smooth'}); };
  const allData = { tasks, meals, workoutSessions, activeDays };

  if (authState === 'loading') return <Spinner text="Loading…"/>;
  if (authState === 'auth')    return <AuthScreen onSignIn={handleAuth}/>;

  return (
    <>
      <aside className="sidebar">
        <div className="sidebar-logo">M<span>Health</span></div>
        <nav className="sidebar-nav">
          {NAV.map(item=>(
            <div key={item.id} className={`sidebar-item ${activeSection===item.id?'active':''}`}
              onClick={()=>navigate(item.id)} role="button" tabIndex={0} onKeyDown={e=>e.key==='Enter'&&navigate(item.id)}>
              <Icon name={item.icon} size={18}/>{item.label}
            </div>
          ))}
        </nav>
        <div className="sidebar-footer">
          <div className="sidebar-email">{user?.email}</div>
          <button className="btn btn-ghost btn-sm" style={{width:'100%',justifyContent:'center',gap:8}} onClick={signOut}>
            <Icon name="logout" size={14}/>Sign out
          </button>
        </div>
      </aside>

      <main className="main">
        {activeSection==='home'     && <HomeSection allData={allData} signOut={signOut} userEmail={user?.email}/>}
        {activeSection==='gym'      && <GymSection workoutSchemas={workoutSchemas} setWorkoutSchemas={setWorkoutSchemas} workoutSessions={workoutSessions} setWorkoutSessions={setWorkoutSessions} markActive={markActive}/>}
        {activeSection==='food'     && <FoodSection meals={meals} setMeals={setMeals} favMeals={favMeals} setFavMeals={setFavMeals} markActive={markActive}/>}
        {activeSection==='plan'     && <PlanningSection tasks={tasks} setTasks={setTasks} markActive={markActive}/>}
        {activeSection==='progress' && <ProgressSection weightLogs={weightLogs} setWeightLogs={setWeightLogs} checkIns={checkIns} setCheckIns={setCheckIns} markActive={markActive}/>}
      </main>

      <nav className="bottom-nav">
        {NAV.map(item=>(
          <div key={item.id} className={`bottom-nav-item ${activeSection===item.id?'active':''}`}
            onClick={()=>navigate(item.id)} role="button" tabIndex={0} onKeyDown={e=>e.key==='Enter'&&navigate(item.id)}>
            <Icon name={item.icon} size={22}/><span>{item.label}</span>
          </div>
        ))}
      </nav>
    </>
  );
};

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
