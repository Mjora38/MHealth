<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg: #0d0d0f; --bg2: #141417; --bg3: #1c1c21; --bg4: #242429;
  --border: #2a2a31; --text: #e8e8ec; --text2: #9898a8; --text3: #5a5a6a;
  --accent: oklch(75% 0.2 145); --accent-dim: oklch(75% 0.2 145 / 0.12); --accent-border: oklch(75% 0.2 145 / 0.3); --accent-med: oklch(75% 0.2 145 / 0.5);
  --amber: oklch(75% 0.15 75); --amber-dim: oklch(75% 0.15 75 / 0.12);
  --red: oklch(68% 0.18 25); --red-dim: oklch(68% 0.18 25 / 0.12);
  --blue: oklch(68% 0.18 200);
  --font: 'DM Sans', sans-serif; --mono: 'DM Mono', monospace;
  --sidebar-w: 220px; --nav-h: 64px; --radius: 12px; --radius-sm: 8px;
  --safe-bottom: env(safe-area-inset-bottom, 0px);
}
html, body { height: 100%; background: var(--bg); color: var(--text); font-family: var(--font); -webkit-font-smoothing: antialiased; }
#root { height: 100%; display: flex; }
input, textarea, select, button { font-family: var(--font); }
button { cursor: pointer; border: none; background: none; color: inherit; }
input, textarea, select { background: var(--bg3); border: 1px solid var(--border); color: var(--text); border-radius: var(--radius-sm); padding: 10px 14px; font-size: 14px; outline: none; transition: border-color 0.2s; width: 100%; }
input:focus, textarea:focus, select:focus { border-color: var(--accent); }
input[type="range"] { padding: 0; height: 6px; cursor: pointer; }
select option { background: var(--bg3); }
::-webkit-scrollbar { width: 4px; } ::-webkit-scrollbar-track { background: transparent; } ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }
@keyframes spin { to { transform: rotate(360deg); } }
@keyframes fadein { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

/* SIDEBAR */
.sidebar { width: var(--sidebar-w); min-height: 100vh; background: var(--bg2); border-right: 1px solid var(--border); display: flex; flex-direction: column; padding: 28px 0 24px; flex-shrink: 0; position: fixed; left: 0; top: 0; bottom: 0; z-index: 100; }
.sidebar-logo { font-size: 20px; font-weight: 700; letter-spacing: -0.5px; padding: 0 24px 28px; color: var(--accent); }
.sidebar-logo span { color: var(--text); }
.sidebar-nav { display: flex; flex-direction: column; gap: 2px; flex: 1; padding: 0 12px; }
.sidebar-item { display: flex; align-items: center; gap: 12px; padding: 11px 14px; border-radius: var(--radius-sm); font-size: 14px; font-weight: 500; color: var(--text2); cursor: pointer; transition: all 0.15s; user-select: none; }
.sidebar-item:hover { color: var(--text); background: var(--bg3); }
.sidebar-item.active { color: var(--accent); background: var(--accent-dim); }
.sidebar-item svg { flex-shrink: 0; }
.sidebar-footer { padding: 12px 16px 0; border-top: 1px solid var(--border); margin-top: 8px; }
.sidebar-email { font-size: 11px; color: var(--text3); font-family: var(--mono); margin-bottom: 8px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* BOTTOM NAV */
.bottom-nav { display: none; position: fixed; bottom: 0; left: 0; right: 0; height: calc(var(--nav-h) + var(--safe-bottom)); padding-bottom: var(--safe-bottom); background: var(--bg2); border-top: 1px solid var(--border); z-index: 100; padding-left: 8px; padding-right: 8px; justify-content: space-around; align-items: center; }
.bottom-nav-item { display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 8px 12px; border-radius: var(--radius-sm); font-size: 10px; font-weight: 500; color: var(--text3); cursor: pointer; transition: all 0.15s; flex: 1; min-height: 44px; justify-content: center; -webkit-tap-highlight-color: transparent; }
.bottom-nav-item.active { color: var(--accent); }

/* MAIN */
.main { flex: 1; margin-left: var(--sidebar-w); min-height: 100vh; overflow-y: auto; overflow-x: hidden; display: flex; flex-direction: column; }
.section { flex: 1; padding: 36px 40px; max-width: 900px; width: 100%; margin: 0 auto; animation: fadein 0.2s ease; }

/* TYPE */
.section-title { font-size: 26px; font-weight: 700; letter-spacing: -0.5px; margin-bottom: 4px; }
.card { background: var(--bg2); border: 1px solid var(--border); border-radius: var(--radius); padding: 20px; }
.card-title { font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.8px; color: var(--text3); margin-bottom: 14px; }
.col { display: flex; flex-direction: column; gap: 12px; }
.grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

/* BUTTONS */
.btn { display: inline-flex; align-items: center; gap: 8px; padding: 10px 18px; border-radius: var(--radius-sm); font-size: 14px; font-weight: 600; cursor: pointer; transition: all 0.15s; border: 1px solid transparent; white-space: nowrap; -webkit-tap-highlight-color: transparent; min-height: 40px; }
.btn-primary { background: var(--accent); color: #0d0d0f; }
.btn-primary:hover { filter: brightness(1.1); } .btn-primary:active { filter: brightness(0.95); }
.btn-ghost { border-color: var(--border); color: var(--text2); } .btn-ghost:hover { border-color: var(--accent); color: var(--accent); }
.btn-danger { border-color: var(--red-dim); color: var(--red); } .btn-danger:hover { background: var(--red-dim); }
.btn-sm { padding: 7px 12px; font-size: 13px; min-height: 34px; }
.btn-icon { padding: 8px; border-radius: var(--radius-sm); }

/* BADGES */
.badge { display: inline-flex; align-items: center; padding: 3px 9px; border-radius: 99px; font-size: 11px; font-weight: 600; }
.badge-amber { background: var(--amber-dim); color: var(--amber); }
.badge-red { background: var(--red-dim); color: var(--red); }
.badge-gray { background: var(--bg4); color: var(--text2); }

/* TABS */
.tab-bar { display: flex; gap: 4px; margin-bottom: 24px; background: var(--bg3); padding: 4px; border-radius: 10px; width: fit-content; overflow-x: auto; }
.tab-bar::-webkit-scrollbar { display: none; }
.tab-btn { padding: 7px 16px; border-radius: 8px; font-size: 13px; font-weight: 500; transition: all 0.15s; cursor: pointer; white-space: nowrap; border: 1px solid transparent; -webkit-tap-highlight-color: transparent; }
.tab-btn.active { background: var(--bg2); color: var(--text); border-color: var(--border); }
.tab-btn:not(.active) { color: var(--text3); }

/* FORM */
.form-row { display: flex; gap: 10px; }
.form-group { display: flex; flex-direction: column; gap: 6px; flex: 1; }
.form-label { font-size: 12px; color: var(--text2); font-weight: 500; }

/* MISC */
.divider { height: 1px; background: var(--border); margin: 16px 0; }
.empty-state { text-align: center; padding: 40px 20px; color: var(--text3); font-size: 14px; }
.chart-wrap { position: relative; width: 100%; }
svg.chart { overflow: visible; }
.mobile-account { display: none; }
.fav-chip { font-size:11px; padding:4px 10px; border-radius:99px; border:1px dashed var(--border); color:var(--text3); cursor:pointer; background:none; transition:color 0.15s; white-space:nowrap; flex-shrink:0; }
.fav-chip:hover { color: var(--accent); }

/* TABLET */
@media (max-width: 1024px) and (min-width: 769px) { :root { --sidebar-w: 180px; } .section { padding: 28px 24px; } }

/* MOBILE */
@media (max-width: 768px) {
  .sidebar { display: none; }
  .bottom-nav { display: flex; }
  .main { margin-left: 0; padding-bottom: calc(var(--nav-h) + var(--safe-bottom)); }
  .section { padding: 20px 16px; }
  .grid-2 { grid-template-columns: 1fr; }
  .form-row { flex-direction: column; }
  .section-title { font-size: 22px; }
  .card { padding: 14px; }
  .mobile-account { display: flex; }

  /* Prevent iOS Safari from zooming in when tapping inputs */
  input, textarea, select { font-size: 16px !important; }

  /* Tab bar stretches full width so labels never overflow */
  .tab-bar { width: 100%; }
  .tab-btn { flex: 1; text-align: center; padding: 7px 8px; font-size: 12px; }

  /* Section headers wrap instead of squishing */
  .section-header { flex-wrap: wrap; gap: 10px; }

  /* Buttons in tight rows can shrink text */
  .btn { font-size: 13px; padding: 8px 14px; }
  .btn-sm { padding: 6px 10px; font-size: 12px; }

  /* Modal takes full width on small screens */
  .modal-inner { padding: 20px 16px !important; }
}

/* Small phones */
@media (max-width: 390px) {
  .section { padding: 16px 12px; }
  .bottom-nav-item { padding: 6px 6px; font-size: 9px; }
  .card { padding: 12px; }
  .section-title { font-size: 20px; }
  .tab-btn { font-size: 11px; padding: 6px 6px; }
}

/* Very small phones */
@media (max-width: 320px) {
  .bottom-nav-item span { display: none; }
  .bottom-nav-item { min-height: 48px; }
}

/* Quagga2 scanner container — hide debug canvases, stretch video */
[data-quag] canvas { display: none !important; }
[data-quag] video  { width: 100% !important; max-height: 280px !important; object-fit: cover !important; display: block !important; border-radius: 0 !important; }

// ── Food Search input with suggestions (local DB + Open Food Facts API) ───
const FoodSearch = ({ value, onChange, onSelect, onKeyDown, autoFocus, onScanClick }) => {
  const [localResults, setLocalResults] = useState([]);
  const [apiResults,   setApiResults]   = useState([]);
  const [apiLoading,   setApiLoading]   = useState(false);
  const [open, setOpen] = useState(false);
  const [active, setActive] = useState(-1);
  const debounceRef = useRef(null);
  const wrapRef = useRef(null);

  const allResults = [...localResults, ...apiResults];

  useEffect(() => {
    const handler = e => { if (wrapRef.current && !wrapRef.current.contains(e.target)) setOpen(false); };
    document.addEventListener('mousedown', handler);
    return () => document.removeEventListener('mousedown', handler);
  }, []);

  const handleChange = e => {
    const v = e.target.value;
    onChange(v);
    setActive(-1);
    clearTimeout(debounceRef.current);

    if (v.length < 1) { setLocalResults([]); setApiResults([]); setOpen(false); return; }

    // Instant local search
    const q = v.toLowerCase();
    const local = FOOD_DB.filter(f => f.name.toLowerCase().includes(q)).slice(0, 5);
    setLocalResults(local);
    setOpen(true);

    // Debounced Open Food Facts search
    if (v.length >= 2) {
      debounceRef.current = setTimeout(async () => {
        setApiLoading(true);
        try {
          const res = await fetch(`https://world.openfoodfacts.org/cgi/search.pl?search_terms=${encodeURIComponent(v)}&json=1&page_size=6&fields=product_name,brands,nutriments`, { signal: AbortSignal.timeout(5000) });
          const data = await res.json();
          const parseNut = nut => {
            const kcal100 = nut['energy-kcal_100g'] ?? nut['energy-kcal'];
            const kj100   = nut['energy-kj_100g']   ?? nut['energy-kj'] ?? nut['energy_100g'] ?? nut['energy'];
            return {
              cal: Math.round(kcal100 != null ? kcal100 : (kj100 != null ? kj100 / 4.184 : 0)),
              p:   Math.round(nut['proteins_100g'] ?? nut['protein_100g'] ?? nut['proteins'] ?? nut['protein'] ?? 0),
              c:   Math.round(nut['carbohydrates_100g'] ?? nut['carbohydrates'] ?? 0),
              f:   Math.round(nut['fat_100g'] ?? nut['fat'] ?? 0),
            };
          };
          const results = (data.products || [])
            .filter(p => p.product_name && p.nutriments)
            .slice(0, 6)
            .map(p => {
              const { cal, p: pro, c, f } = parseNut(p.nutriments);
              return { name:[p.product_name, p.brands].filter(Boolean).join(' — '), cal, p:pro, c, f, fromApi:true };
            })
            .filter(p => p.cal > 0);
          setApiResults(results);
          if (results.length > 0 || local.length > 0) setOpen(true);
        } catch { /* network error — silent */ }
        setApiLoading(false);
      }, 450);
    } else {
      setApiResults([]);
    }
  };

  const pick = food => {
    onSelect(food.name, food.cal, food.p||0, food.c||0, food.f||0);
    setOpen(false); setActive(-1); setLocalResults([]); setApiResults([]);
  };

  const handleKey = e => {
    if (open && allResults.length > 0) {
      if (e.key === 'ArrowDown') { e.preventDefault(); setActive(a => Math.min(a + 1, allResults.length - 1)); return; }
      if (e.key === 'ArrowUp')   { e.preventDefault(); setActive(a => Math.max(a - 1, -1)); return; }
      if (e.key === 'Enter' && active >= 0) { e.preventDefault(); pick(allResults[active]); return; }
      if (e.key === 'Escape') { setOpen(false); return; }
    }
    onKeyDown && onKeyDown(e);
  };

  return (
    <div ref={wrapRef} style={{position:'relative'}}>
      <div style={{display:'flex',gap:8,alignItems:'center'}}>
        <input
          value={value}
          onChange={handleChange}
          onKeyDown={handleKey}
          onFocus={() => (localResults.length > 0 || apiResults.length > 0) && setOpen(true)}
          placeholder="Search any food, brand, ingredient…"
          autoFocus={autoFocus}
          style={{flex:1}}
        />
        {onScanClick && (
          <button type="button" className="btn btn-ghost btn-sm" style={{flexShrink:0,gap:5,whiteSpace:'nowrap'}} onClick={onScanClick} title="Scan barcode">
            <svg width="16" height="16" fill="none" stroke="currentColor" strokeWidth="1.8" viewBox="0 0 24 24"><rect x="2" y="2" width="5" height="5" rx="1"/><rect x="17" y="2" width="5" height="5" rx="1"/><rect x="2" y="17" width="5" height="5" rx="1"/><line x1="7" y1="4.5" x2="17" y2="4.5"/><line x1="4.5" y1="7" x2="4.5" y2="17"/><line x1="19.5" y1="7" x2="19.5" y2="17"/><line x1="7" y1="19.5" x2="12" y2="19.5"/><line x1="14" y1="17" x2="14" y2="22"/><line x1="17" y1="14" x2="22" y2="14"/><line x1="14" y1="14" x2="19" y2="14"/></svg>
            Scan
          </button>
        )}
      </div>
      {open && (localResults.length > 0 || apiResults.length > 0 || apiLoading) && (
        <div style={{position:'absolute',top:'calc(100% + 4px)',left:0,right:0,background:'var(--bg3)',border:'1px solid var(--border)',borderRadius:'var(--radius-sm)',zIndex:300,maxHeight:260,overflowY:'auto',boxShadow:'0 8px 24px rgba(0,0,0,0.5)',WebkitOverflowScrolling:'touch'}}>
          {localResults.length > 0 && <div style={{fontSize:10,color:'var(--text3)',padding:'6px 14px 2px',fontWeight:600,letterSpacing:'0.5px',textTransform:'uppercase'}}>Local</div>}
          {localResults.map((food, i) => <FoodSuggestionRow key={`l${i}`} food={food} active={i===active} onPick={pick} onHover={()=>setActive(i)} onLeave={()=>setActive(-1)}/>)}
          {(apiResults.length > 0 || apiLoading) && <div style={{fontSize:10,color:'var(--text3)',padding:'6px 14px 2px',fontWeight:600,letterSpacing:'0.5px',textTransform:'uppercase',borderTop: localResults.length>0?'1px solid var(--border)':'none'}}>
            Open Food Facts {apiLoading && <span style={{fontWeight:400}}>…</span>}
          </div>}
          {apiResults.map((food, i) => <FoodSuggestionRow key={`a${i}`} food={food} active={(localResults.length+i)===active} onPick={pick} onHover={()=>setActive(localResults.length+i)} onLeave={()=>setActive(-1)}/>)}
        </div>
      )}
    </div>
  );
};

// ── Line Chart ─────────────────────────────────────────────────────────────
const LineChart = ({ data, color = 'var(--accent)', height = 120, label = '', goalLine = null }) => {
  const ref = useRef(null);
  const [width, setWidth] = useState(500);
  useEffect(() => {
    if (!ref.current) return;
    const ro = new ResizeObserver(entries => { for (const e of entries) setWidth(e.contentRect.width || 500); });
    ro.observe(ref.current); setWidth(ref.current.offsetWidth || 500);
    return () => ro.disconnect();
  }, []);
  if (!data || data.length < 2) return <div className="empty-state" style={{padding:'20px 0'}}>Not enough data yet</div>;
  const vals = data.map(d=>d.value);
  const allVals = goalLine !== null ? [...vals, goalLine] : vals;
  const min=Math.min(...allVals), max=Math.max(...allVals), range=max-min||1;
  const W=width, H=height, pad=10;
  const pts = data.map((d,i)=>[(i/(data.length-1))*(W-pad*2)+pad, H-((d.value-min)/range)*(H-pad*2)-pad]);
  const lineD = pts.map((p,i)=>`${i===0?'M':'L'}${p[0].toFixed(1)},${p[1].toFixed(1)}`).join(' ');
  const areaD = lineD+` L${pts[pts.length-1][0].toFixed(1)},${H} L${pts[0][0].toFixed(1)},${H} Z`;
  const gid = `g-${label.replace(/\s/g,'_')}`;
  const goalY = goalLine !== null ? H-((goalLine-min)/range)*(H-pad*2)-pad : null;
  return (
    <div className="chart-wrap" ref={ref}>
      <svg viewBox={`0 0 ${W} ${H}`} className="chart" style={{width:'100%',height:H,display:'block'}}>
        <defs><linearGradient id={gid} x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stopColor={color} stopOpacity="0.25"/><stop offset="100%" stopColor={color} stopOpacity="0.02"/></linearGradient></defs>
        <path d={areaD} fill={`url(#${gid})`}/>
        {goalY!==null&&<line x1={pad} y1={goalY} x2={W-pad} y2={goalY} stroke="var(--amber)" strokeWidth="1.5" strokeDasharray="5 3" opacity="0.8"/>}
        {goalY!==null&&<text x={W-pad-2} y={goalY-4} fill="var(--amber)" fontSize="9" textAnchor="end" fontFamily="var(--mono)" opacity="0.9">goal {goalLine}</text>}
        <path d={lineD} fill="none" stroke={color} strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"/>
        {pts.map(([x,y],i)=><g key={i}><circle cx={x} cy={y} r="5" fill={color} stroke="var(--bg2)" strokeWidth="2"/><title>{`${data[i].date}: ${data[i].value}`}</title></g>)}
      </svg>
      <div style={{display:'flex',justifyContent:'space-between',marginTop:6,fontSize:11,color:'var(--text3)',fontFamily:'var(--mono)'}}>
        <span>{data[0]?.date}</span><span>{data[data.length-1]?.date}</span>
      </div>
    </div>
  );
};

// ── Barcode Scanner ────────────────────────────────────────────────────────
const BarcodeScanner = ({ onResult, onClose }) => {
  const videoRef  = useRef(null);
  const quagRef   = useRef(null);
  const streamRef = useRef(null);
  const rafRef    = useRef(null);
  const [status,     setStatus]     = useState('Starting camera…');
  const [error,      setError]      = useState(null);
  const [manualCode, setManualCode] = useState('');

  const useNative = 'BarcodeDetector' in window;

  useEffect(() => {
    let cancelled = false;

    if (useNative) {
      // Chrome / Edge / Android Chrome — native BarcodeDetector API
      const detector = new window.BarcodeDetector({ formats: ['ean_13','ean_8','upc_a','upc_e','code_128','code_39','qr_code'] });
      navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment', width:{ ideal:1280 } } })
        .then(stream => {
          if (cancelled) { stream.getTracks().forEach(t => t.stop()); return; }
          streamRef.current = stream;
          videoRef.current.srcObject = stream;
          videoRef.current.play();
          setStatus('Point at a product barcode…');
          const scan = async () => {
            if (cancelled) return;
            const v = videoRef.current;
            if (!v || v.readyState < 2 || !v.videoWidth) { rafRef.current = requestAnimationFrame(scan); return; }
            try {
              const codes = await detector.detect(v);
              if (codes.length > 0) { setStatus('Found!'); onResult(codes[0].rawValue); return; }
            } catch {}
            rafRef.current = requestAnimationFrame(scan);
          };
          rafRef.current = requestAnimationFrame(scan);
        })
        .catch(e => {
          if (!cancelled) setError(e.name === 'NotAllowedError'
            ? 'Camera access denied. Please allow camera permission in your browser settings.'
            : 'Camera not available on this device.');
        });
      return () => {
        cancelled = true;
        cancelAnimationFrame(rafRef.current);
        streamRef.current?.getTracks().forEach(t => t.stop());
      };

    } else if (window.Quagga) {
      // iOS Safari / Firefox / all other browsers — Quagga2 JS fallback
      Quagga.init({
        inputStream: {
          name: 'Live', type: 'LiveStream', target: quagRef.current,
          constraints: { facingMode: 'environment', width: { ideal: 1280 }, height: { ideal: 720 } },
        },
        decoder: {
          readers: ['ean_reader','ean_8_reader','upc_reader','upc_e_reader','code_128_reader','code_39_reader'],
        },
        locator: { patchSize: 'medium', halfSample: true },
        locate: true,
        numOfWorkers: 0,
        frequency: 8,
      }, err => {
        if (cancelled) return;
        if (err) { setError('Could not start camera. ' + (err.message || 'Check camera permission in your browser settings.')); return; }
        Quagga.start();
        setStatus('Point camera at barcode — keep steady & well lit');
      });
      Quagga.onDetected(result => {
        const code = result.codeResult?.code;
        if (code && !cancelled) { cancelled = true; Quagga.stop(); setStatus('Found!'); onResult(code); }
      });
      return () => { cancelled = true; try { Quagga.stop(); } catch {} };

    } else {
      setError('Barcode library is still loading — wait a moment then try again.');
    }
  }, []);

  return (
    <div style={{position:'fixed',inset:0,background:'rgba(0,0,0,0.85)',display:'flex',alignItems:'center',justifyContent:'center',zIndex:300,padding:16}}>
      <div style={{background:'var(--bg2)',border:'1px solid var(--border)',borderRadius:16,padding:24,width:'100%',maxWidth:480}}>
        <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:16}}>
          <span style={{fontSize:18,fontWeight:700}}>Scan Barcode</span>
          <button className="btn btn-icon btn-ghost" onClick={onClose}><Icon name="close" size={16}/></button>
        </div>
        {error
          ? <div style={{color:'var(--red)',textAlign:'center',padding:'20px 0',lineHeight:1.6,fontSize:13}}>{error}</div>
          : <>
              <div style={{position:'relative',borderRadius:12,overflow:'hidden',marginBottom:14,background:'#000',minHeight:220}}>
                {useNative
                  ? <video ref={videoRef} style={{width:'100%',maxHeight:280,objectFit:'cover',display:'block'}} muted playsInline/>
                  : <div ref={quagRef} data-quag="" style={{width:'100%',minHeight:220,position:'relative'}}/>}
                <div style={{position:'absolute',inset:0,display:'flex',alignItems:'center',justifyContent:'center',pointerEvents:'none'}}>
                  <div style={{width:230,height:120,border:'2px solid var(--accent)',borderRadius:8,boxShadow:'0 0 0 2000px rgba(0,0,0,0.35)',filter:'drop-shadow(0 0 6px var(--accent))'}}/>
                </div>
              </div>
              <div style={{textAlign:'center',fontSize:13,color:'var(--text2)',marginBottom:4}}>{status}</div>
              <div style={{textAlign:'center',fontSize:11,color:'var(--text3)',marginBottom:14}}>EAN-13 · UPC · Code 128 · all major formats</div>
              <div style={{borderTop:'1px solid var(--border)',paddingTop:14}}>
                <div style={{fontSize:11,color:'var(--text3)',marginBottom:8,textAlign:'center'}}>Can't scan? Type the barcode number:</div>
                <div style={{display:'flex',gap:8}}>
                  <input type="number" value={manualCode} onChange={e=>setManualCode(e.target.value)}
                    placeholder="e.g. 8690000000000" style={{flex:1,fontSize:14}}
                    onKeyDown={e=>e.key==='Enter'&&manualCode.length>=8&&onResult(manualCode)}/>
                  <button className="btn btn-primary btn-sm" style={{flexShrink:0,whiteSpace:'nowrap'}}
                    disabled={manualCode.length<8} onClick={()=>onResult(manualCode)}>Look up</button>
                </div>
              </div>
            </>}
      </div>
    </div>
  );
};

// ── Activity Heatmap ───────────────────────────────────────────────────────
const ActivityHeatmap = ({ activeDays }) => {
  const today = new Date();
  const cells = [];
  for (let i = 89; i >= 0; i--) {
    const d = new Date(today); d.setDate(today.getDate() - i);
    const key = d.toISOString().split('T')[0];
    cells.push({ key, active: activeDays.includes(key) });
  }
  const weeks = [];
  for (let i = 0; i < cells.length; i += 7) weeks.push(cells.slice(i, i + 7));
  const active = cells.filter(c => c.active).length;
  return (
    <div>
      <div style={{fontSize:11,color:'var(--text3)',marginBottom:8,fontFamily:'var(--mono)'}}>
        {active} active days in last 90
      </div>
      <div style={{display:'flex',gap:2,overflowX:'auto',paddingBottom:2}}>
        {weeks.map((week,wi)=>(
          <div key={wi} style={{display:'flex',flexDirection:'column',gap:2}}>
            {week.map(cell=>(
              <div key={cell.key} title={cell.key} style={{
                width:10,height:10,borderRadius:2,flexShrink:0,
                background:cell.active?'var(--accent)':'var(--bg4)',
                opacity:cell.active?1:0.4,transition:'background 0.2s'
              }}/>
            ))}
          </div>
        ))}
      </div>
    </div>
  );
};

// ── Modal ──────────────────────────────────────────────────────────────────
const Modal = ({ title, onClose, children }) => {
  useEffect(() => {
    const h = e => { if (e.key==='Escape') onClose(); };
    document.addEventListener('keydown', h); return () => document.removeEventListener('keydown', h);
  }, [onClose]);
  return (
    <div style={{position:'fixed',inset:0,background:'rgba(0,0,0,0.75)',display:'flex',alignItems:'center',justifyContent:'center',zIndex:200,padding:16}}
      onClick={e=>e.target===e.currentTarget&&onClose()}>
      <div style={{background:'var(--bg2)',border:'1px solid var(--border)',borderRadius:16,padding:24,width:'100%',maxWidth:480,maxHeight:'90vh',overflowY:'auto'}}>
        <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:20}}>
          <span style={{fontSize:18,fontWeight:700}}>{title}</span>
          <button className="btn btn-icon btn-ghost" onClick={onClose}><Icon name="close" size={16}/></button>
        </div>
        {children}
      </div>
    </div>
  );
};

const HomeSection = ({ allData, signOut, userEmail, setWorkoutSessions, setTasks, setMeals, markActive }) => {

  const { tasks, meals, workoutSessions, activeDays } = allData;
  const todayTasks = tasks.filter(t=>t.date===TODAY).slice(0,5);

  const totalCals = Object.values(todayMeals).flat().reduce((s,m)=>s+(m?.calories||0),0);

  const [qaModal, setQaModal] = useState(null); // 'workout' | 'meal' | 'task'

    if (!qaWorkout.exercise.trim()) return;
    const s = { id:Date.now(), date:TODAY, exercise:qaWorkout.exercise.trim(), sets:parseInt(qaWorkout.sets)||1, reps:parseInt(qaWorkout.reps)||1, weight:parseFloat(qaWorkout.weight)||0 };
    setWorkoutSessions(prev=>{ const n=[...prev,s]; save('workoutSessions',n); return n; });
    markActive(TODAY); setQaWorkout({exercise:'',sets:'',reps:'',weight:''}); setQaModal(null);
  };
  const quickAddMeal = () => {
    if (!qaMeal.name.trim()) return;
    const m = { id:Date.now(), name:qaMeal.name.trim(), calories:parseInt(qaMeal.calories)||0, protein:0, carbs:0, fat:0 };
    setMeals(prev=>{ const day=prev[TODAY]||{}; const slot=[...(day[qaMeal.slot]||[]),m]; const n={...prev,[TODAY]:{...day,[qaMeal.slot]:slot}}; save('meals',n); return n; });
    markActive(TODAY); setQaMeal({name:'',slot:'breakfast',calories:''}); setQaModal(null);
  };
  const quickAddTask = () => {
    if (!qaTask.text.trim()) return;
    const t = { id:Date.now(), text:qaTask.text.trim(), priority:qaTask.priority, date:TODAY, done:false };
    setTasks(prev=>{ const n=[...prev,t]; save('tasks',n); return n; });
    markActive(TODAY); setQaTask({text:'',priority:'medium'}); setQaModal(null);
  };

  const streak = useMemo(()=>{
    const days=[...new Set([...activeDays,TODAY])].sort().reverse();
    let s=0,prev=null;
    for(const d of days){if(!prev){s=1;prev=d;continue;}if(Math.round((new Date(prev)-new Date(d))/86400000)===1){s++;prev=d;}else break;}
    return s;
  },[activeDays]);

  // Weekly summary (Mon–Sun of current week)
  const weekSummary = useMemo(()=>{
    const now = new Date();
    const day = now.getDay(); // 0=Sun
    const mon = new Date(now); mon.setDate(now.getDate() - ((day+6)%7));
    const weekDays = Array.from({length:7},(_,i)=>{ const d=new Date(mon); d.setDate(mon.getDate()+i); return d.toISOString().split('T')[0]; });
    const wWorkouts = workoutSessions.filter(w=>weekDays.includes(w.date)).length;
    const wTasks    = tasks.filter(t=>weekDays.includes(t.date)&&t.done).length;
    const wMealDays = weekDays.filter(d=>Object.values(meals[d]||{}).flat().length>0).length;
    return { workouts:wWorkouts, tasks:wTasks, mealDays:wMealDays };

        <p style={{fontSize:13,color:'var(--text2)',lineHeight:1.6}}>Start by logging a workout in <b>Gym</b>, planning meals in <b>Food</b>, or adding tasks in <b>Plan</b>. Your streak starts today.</p>

      <div style={{background:'var(--bg2)',border:'1px solid var(--border)',borderRadius:'var(--radius)',padding:'16px 20px',marginBottom:20}}>

// ── Rest Timer component ───────────────────────────────────────────────────
const RestTimer = () => {
  const [seconds, setSeconds] = useState(0);
  const [total, setTotal] = useState(90);
  const [running, setRunning] = useState(false);
  const tickRef = useRef(null);

  const start = t => {
    clearInterval(tickRef.current);
    setTotal(t); setSeconds(t); setRunning(true);
    tickRef.current = setInterval(() => {
      setSeconds(s => {
        if (s <= 1) {
          clearInterval(tickRef.current);
          setRunning(false);
          if (navigator.vibrate) navigator.vibrate([300, 150, 300]);
          return 0;
        }
        return s - 1;
      });
    }, 1000);
  };

  const stop = () => { clearInterval(tickRef.current); setRunning(false); setSeconds(0); };
  useEffect(() => () => clearInterval(tickRef.current), []);

  const pct = total > 0 ? ((total - seconds) / total) : 0;
  const mins = Math.floor(seconds / 60), secs = seconds % 60;
  const timeStr = `${mins}:${String(secs).padStart(2,'0')}`;
  const urgent = seconds > 0 && seconds <= 10;

  return (
    <div className="card" style={{padding:'14px 16px'}}>
      <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:10}}>
        <div style={{fontSize:12,fontWeight:600,color:'var(--text3)',textTransform:'uppercase',letterSpacing:'0.8px'}}>⏱ Rest Timer</div>
        {running && <button className="btn btn-danger btn-sm" onClick={stop}>Stop</button>}
      </div>
      {running ? (
        <>
          <div style={{fontSize:36,fontWeight:700,fontFamily:'var(--mono)',color:urgent?'var(--red)':'var(--accent)',textAlign:'center',marginBottom:10,transition:'color 0.3s'}}>{timeStr}</div>
          <div style={{height:6,background:'var(--bg4)',borderRadius:3,overflow:'hidden',marginBottom:4}}>
            <div style={{height:'100%',borderRadius:3,background:urgent?'var(--red)':'var(--accent)',width:`${pct*100}%`,transition:'width 1s linear, background 0.3s'}}/>
          </div>
          <div style={{fontSize:11,color:'var(--text3)',textAlign:'right',fontFamily:'var(--mono)'}}>{seconds}s left</div>
        </>
      ) : (
        <div style={{display:'flex',gap:8,flexWrap:'wrap'}}>
          {[30,60,90,120].map(t => (
            <button key={t} className="btn btn-ghost btn-sm" onClick={()=>start(t)} style={{flex:1,justifyContent:'center',minWidth:52}}>
              {t < 60 ? `${t}s` : `${t/60}:00`}
            </button>
          ))}
        </div>
      )}
    </div>
  );
};

// ── GYM ───────────────────────────────────────────────────────────────────
const GymSection = ({ workoutSchemas, setWorkoutSchemas, workoutSessions, setWorkoutSessions, customExercises, setCustomExercises, markActive }) => {
  const [tab, setTab] = useState('log');
  // log
  const [showLogModal, setShowLogModal] = useState(false);
  const [logForm, setLogForm] = useState({ exercise:'', sets:'', reps:'', weight:'', date:TODAY });
  // schema workout
  const [schemaWorkout, setSchemaWorkout] = useState(null); // { schema, date, entries:[{exercise,sets,reps,weight}] }
  // schemas
  const [showSchemaModal, setShowSchemaModal] = useState(false);
  const [newSchema, setNewSchema] = useState({ name:'' });
  // exercises
  const [bodyPartFilter, setBodyPartFilter] = useState('All');
  const [categoryFilter, setCategoryFilter] = useState('All');
  const [exSearch, setExSearch] = useState('');
  const [showAddExModal, setShowAddExModal] = useState(false);
  const [newExForm, setNewExForm] = useState({ name:'', bodyPart:'Chest', category:'Barbell' });
  const [addToSchemaEx, setAddToSchemaEx] = useState(null);
  // progress
  const [chartExercise, setChartExercise] = useState('');
  const [chartMode, setChartMode] = useState('weight'); // 'weight' | 'volume'

  const loggedExercises = useMemo(()=>[...new Set(workoutSessions.map(w=>w.exercise))].sort(),[workoutSessions]);

  // PR map: exercise → { weight, date }
  const prMap = useMemo(()=>{
    const m = {};
    // Sort ascending so first occurrence of a given weight (earliest date) wins
    [...workoutSessions].sort((a,b)=>a.date.localeCompare(b.date)).forEach(s=>{
      const w = parseFloat(s.weight)||0;
      if (!m[s.exercise] || w > m[s.exercise].weight)
        m[s.exercise] = { weight: w, date: s.date, id: s.id };
    });
    return m;
  },[workoutSessions]);

  const chartData = useMemo(()=>{
    if(!chartExercise)return[];
    const sessions = workoutSessions.filter(w=>w.exercise===chartExercise).sort((a,b)=>a.date.localeCompare(b.date));
    const byDate = {};
    sessions.forEach(s=>{
      if(chartMode==='weight'){
        const w=parseFloat(s.weight)||0;
        if(!byDate[s.date]||w>byDate[s.date]) byDate[s.date]=w;
      } else {
        const vol=(parseInt(s.sets)||0)*(parseInt(s.reps)||0)*(parseFloat(s.weight)||0);
        byDate[s.date]=(byDate[s.date]||0)+vol;
      }
    });
    return Object.entries(byDate).map(([date,value])=>({date:date.slice(5),value:chartMode==='volume'?Math.round(value):value}));
  },[workoutSessions,chartExercise,chartMode]);

  // Monthly stats
  const stats = useMemo(()=>{
    const month = new Date().toISOString().slice(0,7);
    const ms = workoutSessions.filter(s=>s.date.startsWith(month));
    const days = new Set(ms.map(s=>s.date)).size;
    const exCount = {};
    ms.forEach(s=>{ exCount[s.exercise]=(exCount[s.exercise]||0)+1; });
    const topEx = Object.entries(exCount).sort((a,b)=>b[1]-a[1])[0]?.[0];
    const allEx = [...EXERCISE_DB,...customExercises];
    const bpCount = {};
    ms.forEach(s=>{ const ex=allEx.find(e=>e.name===s.exercise); if(ex) bpCount[ex.bodyPart]=(bpCount[ex.bodyPart]||0)+1; });
    const topBP = Object.entries(bpCount).sort((a,b)=>b[1]-a[1])[0]?.[0];
    const vol = Math.round(ms.reduce((sum,s)=>sum+(parseInt(s.sets)||0)*(parseInt(s.reps)||0)*(parseFloat(s.weight)||0),0));
    return { days, topEx, topBP, vol };
  },[workoutSessions,customExercises]);

  // Combined + filtered exercise list
  const allExercises = useMemo(()=>[
    ...EXERCISE_DB.map((e,i)=>({...e,id:`b${i}`,custom:false})),
    ...customExercises.map(e=>({...e,custom:true})),
  ],[customExercises]);

  const filteredExercises = useMemo(()=>{
    const q = exSearch.toLowerCase();
    return allExercises.filter(e=>
      (bodyPartFilter==='All'||e.bodyPart===bodyPartFilter)&&
      (categoryFilter==='All'||e.category===categoryFilter)&&
      (!q||e.name.toLowerCase().includes(q)||e.bodyPart.toLowerCase().includes(q))
    );
  },[allExercises,bodyPartFilter,categoryFilter,exSearch]);

  const addSchema=()=>{
    if(!newSchema.name.trim())return;
    const s={id:Date.now(),name:newSchema.name.trim(),exercises:[]};
    setWorkoutSchemas(prev=>{const n=[...prev,s];save('workoutSchemas',n);return n;});
    setNewSchema({name:''});setShowSchemaModal(false);
  };
  const deleteSchema=id=>setWorkoutSchemas(prev=>{const n=prev.filter(s=>s.id!==id);save('workoutSchemas',n);return n;});
  const removeFromSchema=(schemaId,exIdx)=>setWorkoutSchemas(prev=>{
    const n=prev.map(s=>s.id===schemaId?{...s,exercises:s.exercises.filter((_,i)=>i!==exIdx)}:s);
    save('workoutSchemas',n);return n;
  });

  const addExToSchema=(schemaId,exName)=>{
    setWorkoutSchemas(prev=>{
      const n=prev.map(s=>s.id===schemaId&&!s.exercises.includes(exName)?{...s,exercises:[...s.exercises,exName]}:s);
      save('workoutSchemas',n);return n;
    });
    setAddToSchemaEx(null);
  };

  // Detect PR when logging
  const detectPR = (exercise, weight) => {
    const prev = workoutSessions.filter(s=>s.exercise===exercise);
    const prevMax = prev.reduce((m,s)=>Math.max(m,parseFloat(s.weight)||0),0);
    return (parseFloat(weight)||0) > prevMax && (parseFloat(weight)||0) > 0;
  };

  const logWorkout=()=>{
    if(!logForm.exercise.trim())return;
    const isPR = detectPR(logForm.exercise.trim(), logForm.weight);
    const w={id:Date.now(),...logForm,exercise:logForm.exercise.trim(),isPR};
    setWorkoutSessions(prev=>{const n=[...prev,w];save('workoutSessions',n);return n;});
    markActive(logForm.date);setLogForm({exercise:'',sets:'',reps:'',weight:'',date:TODAY});setShowLogModal(false);
  };

  const logSchemaWorkout=()=>{
    if(!schemaWorkout)return;
    const newSessions = schemaWorkout.entries
      .filter(e=>e.exercise&&(e.sets||e.reps||e.weight))
      .map(e=>({ id:Date.now()+Math.random(), exercise:e.exercise, sets:e.sets, reps:e.reps, weight:e.weight, date:schemaWorkout.date, isPR:detectPR(e.exercise,e.weight) }));
    if(!newSessions.length)return;
    setWorkoutSessions(prev=>{const n=[...prev,...newSessions];save('workoutSessions',n);return n;});
    markActive(schemaWorkout.date);
    setSchemaWorkout(null);
  };

  const updateSchemaEntry=(idx,field,val)=>setSchemaWorkout(sw=>({...sw,entries:sw.entries.map((e,i)=>i===idx?{...e,[field]:val}:e)}));

  const deleteSession=id=>setWorkoutSessions(prev=>{const n=prev.filter(s=>s.id!==id);save('workoutSessions',n);return n;});
  const grouped=useMemo(()=>[...new Set(workoutSessions.map(w=>w.date))].sort().reverse().map(date=>({date,sessions:workoutSessions.filter(w=>w.date===date)})),[workoutSessions]);

  const addCustomEx=()=>{
    if(!newExForm.name.trim())return;
    const e={id:Date.now(),name:newExForm.name.trim(),bodyPart:newExForm.bodyPart,category:newExForm.category,custom:true};
    setCustomExercises(prev=>{const n=[...prev,e];save('customExercises',n);return n;});
    setNewExForm({name:'',bodyPart:'Chest',category:'Barbell'});setShowAddExModal(false);
  };
  const deleteCustomEx=id=>setCustomExercises(prev=>{const n=prev.filter(e=>e.id!==id);save('customExercises',n);return n;});

  return (
    <div className="section">
      <div style={{display:'flex',alignItems:'flex-start',justifyContent:'space-between',marginBottom:24,flexWrap:'wrap',gap:10}}>
        <div className="section-title">Gym</div>
        {tab==='log'       && <button className="btn btn-primary btn-sm" onClick={()=>setShowLogModal(true)}><Icon name="plus" size={15}/>Log Workout</button>}
        {tab==='exercises' && <button className="btn btn-ghost btn-sm" onClick={()=>setShowAddExModal(true)}><Icon name="plus" size={15}/>Add Exercise</button>}
      </div>

      <div className="tab-bar">
        {[['log','Log'],['schemas','Schemas'],['exercises','Exercises'],['progress','Progress']].map(([id,label])=>(
          <button key={id} className={`tab-btn ${tab===id?'active':''}`} onClick={()=>setTab(id)}>{label}</button>
        ))}
      </div>

      {/* ── LOG ── */}
      {tab==='log'&&<div className="col">
        {/* Rest Timer */}
        <RestTimer/>

        {/* Monthly Stats */}
        {workoutSessions.length > 0 && (
          <div className="card" style={{padding:'14px 16px'}}>
            <div className="card-title" style={{marginBottom:12}}>This Month</div>
            <div style={{display:'grid',gridTemplateColumns:'1fr 1fr 1fr',gap:8,textAlign:'center'}}>
              <div>
                <div style={{fontSize:22,fontWeight:700,fontFamily:'var(--mono)',color:'var(--accent)'}}>{stats.days}</div>
                <div style={{fontSize:11,color:'var(--text3)',marginTop:2}}>sessions</div>
              </div>
              <div>
                <div style={{fontSize:13,fontWeight:600,color:'var(--text)',overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}} title={stats.topEx||'—'}>{stats.topEx||'—'}</div>
                <div style={{fontSize:11,color:'var(--text3)',marginTop:2}}>top exercise</div>
              </div>
              <div>
                <div style={{fontSize:13,fontWeight:600,color:stats.topBP?bodyPartColor[stats.topBP]:'var(--text)'}}>{stats.topBP||'—'}</div>
                <div style={{fontSize:11,color:'var(--text3)',marginTop:2}}>top body part</div>
              </div>
            </div>
            {stats.vol > 0 && <div style={{marginTop:12,paddingTop:10,borderTop:'1px solid var(--border)',display:'flex',justifyContent:'space-between',alignItems:'center'}}>
              <span style={{fontSize:12,color:'var(--text3)'}}>Total volume</span>
              <span style={{fontSize:13,fontWeight:600,fontFamily:'var(--mono)',color:'var(--text)'}}>{stats.vol.toLocaleString()} kg</span>
            </div>}
          </div>
        )}

        {grouped.length===0&&<div className="empty-state">No workouts logged yet — tap "Log Workout" to start</div>}
        {grouped.map(({date,sessions})=>(
          <div key={date} className="card">
            <div className="card-title">{new Date(date+'T12:00').toLocaleDateString('en-US',{weekday:'long',month:'short',day:'numeric'})}</div>
            <div className="col" style={{gap:8}}>
              {sessions.map(w=>(
                <div key={w.id} style={{display:'flex',alignItems:'center',justifyContent:'space-between',gap:10}}>
                  <div style={{flex:1,minWidth:0}}>
                    <div style={{fontSize:14,fontWeight:500,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap',display:'flex',alignItems:'center',gap:6}}>
                      {w.exercise}
                      {w.isPR && <span style={{fontSize:10,background:'#f5a62322',color:'#f5a623',borderRadius:4,padding:'1px 5px',fontWeight:700,flexShrink:0}}>🏆 PR</span>}
                    </div>
                    <div style={{fontSize:11,color:'var(--text2)',fontFamily:'var(--mono)',marginTop:1}}>{w.sets}×{w.reps} @ {w.weight}kg</div>
                  </div>
                  <button className="btn btn-icon btn-danger" onClick={()=>deleteSession(w.id)}><Icon name="trash" size={15}/></button>
                </div>))}
            </div>
          </div>))}
      </div>}

      {/* ── SCHEMAS ── */}
      {tab==='schemas'&&<div className="col">
        <button className="btn btn-ghost" style={{width:'fit-content'}} onClick={()=>setShowSchemaModal(true)}><Icon name="plus" size={16}/>New Schema</button>
        {workoutSchemas.length===0&&<div className="empty-state">Create schemas like Push / Pull / Legs, then add exercises from the Exercises tab</div>}
        <div className="col">
          {workoutSchemas.map(s=>(
            <div key={s.id} className="card">
              <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:12}}>
                <div style={{fontSize:16,fontWeight:700}}>{s.name}</div>
                <div style={{display:'flex',gap:8}}>
                  {s.exercises.length > 0 && (
                    <button className="btn btn-primary btn-sm"
                      onClick={()=>setSchemaWorkout({schema:s, date:TODAY, entries:s.exercises.map(e=>({exercise:e,sets:'',reps:'',weight:''}))})}>
                      Start Workout
                    </button>
                  )}
                  <button className="btn btn-icon btn-danger" onClick={()=>deleteSchema(s.id)}><Icon name="trash" size={15}/></button>
                </div>
              </div>
              {s.exercises.length===0
                ? <div style={{fontSize:12,color:'var(--text3)'}}>No exercises yet — go to Exercises tab and tap + to add</div>
                : <div style={{display:'flex',flexWrap:'wrap',gap:6}}>
                    {s.exercises.map((e,i)=>(
                      <div key={i} style={{display:'flex',alignItems:'center',gap:4,background:'var(--bg4)',borderRadius:99,paddingLeft:10,paddingRight:4,paddingTop:3,paddingBottom:3}}>
                        <span style={{fontSize:12,fontWeight:500,color:'var(--text2)'}}>{e}</span>
                        <button onClick={()=>removeFromSchema(s.id,i)} style={{display:'flex',alignItems:'center',color:'var(--text3)',cursor:'pointer',padding:2,borderRadius:'50%',background:'none',border:'none'}}><Icon name="close" size={11}/></button>
                      </div>
                    ))}
                  </div>}
            </div>))}
        </div>
      </div>}

      {/* ── EXERCISES ── */}
      {tab==='exercises'&&<div className="col">
        <input value={exSearch} onChange={e=>setExSearch(e.target.value)} placeholder="Search exercises…"/>
        <FilterRow label="Body Part" options={BODY_PARTS} value={bodyPartFilter} onChange={setBodyPartFilter}/>
        <FilterRow label="Category" options={CATEGORIES} value={categoryFilter} onChange={setCategoryFilter}/>
        <div style={{fontSize:12,color:'var(--text3)'}}>{filteredExercises.length} exercise{filteredExercises.length!==1?'s':''}</div>
        {filteredExercises.length===0
          ? <div className="empty-state">No exercises match your filters</div>
          : <div className="col" style={{gap:8}}>
              {filteredExercises.map(ex=>(
                <div key={ex.id} className="card" style={{display:'flex',alignItems:'center',gap:12,padding:'12px 14px'}}>
                  <div style={{width:4,alignSelf:'stretch',borderRadius:2,background:bodyPartColor[ex.bodyPart]||'var(--border)',flexShrink:0}}/>
                  <div style={{flex:1,minWidth:0}}>
                    <div style={{fontSize:14,fontWeight:600,display:'flex',alignItems:'center',gap:6,flexWrap:'wrap'}}>
                      {ex.name}
                      {ex.custom&&<span style={{fontSize:10,background:'var(--accent-dim)',color:'var(--accent)',borderRadius:4,padding:'1px 5px',fontWeight:600}}>custom</span>}
                      {prMap[ex.name]&&<span style={{fontSize:10,background:'#f5a62322',color:'#f5a623',borderRadius:4,padding:'1px 5px',fontWeight:700}}>🏆 {prMap[ex.name].weight}kg</span>}
                    </div>
                    <div style={{display:'flex',gap:6,marginTop:5,flexWrap:'wrap'}}>
                      <span style={{fontSize:11,fontWeight:500,padding:'2px 8px',borderRadius:99,background:bodyPartColor[ex.bodyPart]+'22',color:bodyPartColor[ex.bodyPart]||'var(--text2)'}}>{ex.bodyPart}</span>
                      <span style={{fontSize:11,fontWeight:500,padding:'2px 8px',borderRadius:99,background:'var(--bg4)',color:'var(--text2)'}}>{ex.category}</span>
                    </div>
                  </div>
                  <div style={{display:'flex',gap:6,flexShrink:0}}>
                    {ex.custom&&<button className="btn btn-icon btn-danger" style={{padding:6}} onClick={()=>deleteCustomEx(ex.id)}><Icon name="trash" size={13}/></button>}
                    <button className="btn btn-icon btn-ghost" style={{padding:6}} onClick={()=>setAddToSchemaEx(ex)}><Icon name="plus" size={15}/></button>
                  </div>
                </div>
              ))}
            </div>}
      </div>}

      {/* ── PROGRESS ── */}
      {tab==='progress'&&<div className="col">
        {/* PR board */}
        {Object.keys(prMap).length > 0 && (
          <div className="card">
            <div className="card-title">Personal Records 🏆</div>
            <div className="col" style={{gap:6}}>
              {Object.entries(prMap).sort((a,b)=>b[1].weight-a[1].weight).slice(0,8).map(([ex,pr])=>(
                <div key={ex} style={{display:'flex',alignItems:'center',justifyContent:'space-between',gap:8,padding:'6px 0',borderBottom:'1px solid var(--border)'}}>
                  <span style={{fontSize:13,flex:1,minWidth:0,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{ex}</span>
                  <span style={{fontSize:13,fontWeight:700,fontFamily:'var(--mono)',color:'#f5a623',flexShrink:0}}>{pr.weight} kg</span>
                  <span style={{fontSize:11,color:'var(--text3)',fontFamily:'var(--mono)',flexShrink:0}}>{pr.date.slice(5)}</span>
                </div>
              ))}
            </div>
          </div>
        )}

        <div className="card">
          <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:16}}>
            <div className="card-title" style={{marginBottom:0}}>Progress Chart</div>
            <div style={{display:'flex',gap:4,background:'var(--bg3)',padding:3,borderRadius:8}}>
              {[['weight','Weight'],['volume','Volume']].map(([m,l])=>(
                <button key={m} onClick={()=>setChartMode(m)}
                  style={{padding:'4px 10px',borderRadius:6,fontSize:11,fontWeight:500,cursor:'pointer',transition:'all 0.15s',
                    background:chartMode===m?'var(--bg2)':'transparent',
                    color:chartMode===m?'var(--text)':'var(--text3)',
                    border:chartMode===m?'1px solid var(--border)':'1px solid transparent'}}>
                  {l}
                </button>
              ))}
            </div>
          </div>
          {loggedExercises.length===0?<div className="empty-state">Log workouts to see your progress</div>:<>
            <select value={chartExercise} onChange={e=>setChartExercise(e.target.value)} style={{marginBottom:16}}>
              <option value="">— Select exercise —</option>
              {loggedExercises.map(e=><option key={e} value={e}>{e}</option>)}
            </select>
            {chartExercise&&<>
              <LineChart data={chartData} label={chartExercise}/>
              <div style={{fontSize:11,color:'var(--text3)',marginTop:8,textAlign:'center',fontFamily:'var(--mono)'}}>
                {chartMode==='weight'?'Max weight (kg)':'Total volume (kg) per session'}
              </div>
            </>}
          </>}
        </div>
      </div>}

      {/* ── MODALS ── */}
      {showSchemaModal&&<Modal title="New Schema" onClose={()=>setShowSchemaModal(false)}>
        <div className="col">
          <div className="form-group"><label className="form-label">Schema Name</label>
            <input value={newSchema.name} onChange={e=>setNewSchema(p=>({...p,name:e.target.value}))} placeholder="Push Day" autoFocus onKeyDown={e=>e.key==='Enter'&&addSchema()}/></div>
          <button className="btn btn-primary" onClick={addSchema}>Create Schema</button>
        </div>
      </Modal>}

      {showLogModal&&<Modal title="Log Workout" onClose={()=>setShowLogModal(false)}>
        <div className="col">
          <div className="form-row">
            <div className="form-group"><label className="form-label">Exercise</label>
              <input value={logForm.exercise} onChange={e=>setLogForm(p=>({...p,exercise:e.target.value}))} placeholder="Bench Press" list="ex-list" autoFocus/>
              <datalist id="ex-list">{[...loggedExercises,...allExercises.map(e=>e.name)].filter((v,i,a)=>a.indexOf(v)===i).map(e=><option key={e} value={e}/>)}</datalist></div>
            <div className="form-group"><label className="form-label">Date</label>
              <input type="date" value={logForm.date} onChange={e=>setLogForm(p=>({...p,date:e.target.value}))}/></div>
          </div>
          <div className="form-row">
            <div className="form-group"><label className="form-label">Sets</label>
              <input type="number" min="1" value={logForm.sets} onChange={e=>setLogForm(p=>({...p,sets:e.target.value}))} placeholder="3"/></div>
            <div className="form-group"><label className="form-label">Reps</label>
              <input type="number" min="1" value={logForm.reps} onChange={e=>setLogForm(p=>({...p,reps:e.target.value}))} placeholder="8"/></div>
            <div className="form-group"><label className="form-label">Weight (kg)</label>
              <input type="number" min="0" step="0.5" value={logForm.weight} onChange={e=>setLogForm(p=>({...p,weight:e.target.value}))} placeholder="80"/></div>
          </div>
          <button className="btn btn-primary" onClick={logWorkout}>Log Workout</button>
        </div>
      </Modal>}

      {/* Schema workout modal */}
      {schemaWorkout&&<Modal title={`${schemaWorkout.schema.name} — ${schemaWorkout.date}`} onClose={()=>setSchemaWorkout(null)}>
        <div className="col">
          <div className="form-group" style={{marginBottom:4}}>
            <label className="form-label">Date</label>
            <input type="date" value={schemaWorkout.date} onChange={e=>setSchemaWorkout(sw=>({...sw,date:e.target.value}))}/>
          </div>
          <div className="divider"/>
          {schemaWorkout.entries.map((entry,idx)=>(
            <div key={idx} style={{padding:'12px 0',borderBottom:'1px solid var(--border)'}}>
              <div style={{fontSize:14,fontWeight:600,marginBottom:10,color:'var(--text)'}}>{entry.exercise}</div>
              <div className="form-row">
                <div className="form-group"><label className="form-label">Sets</label>
                  <input type="number" min="1" value={entry.sets} onChange={e=>updateSchemaEntry(idx,'sets',e.target.value)} placeholder="3"/></div>
                <div className="form-group"><label className="form-label">Reps</label>
                  <input type="number" min="1" value={entry.reps} onChange={e=>updateSchemaEntry(idx,'reps',e.target.value)} placeholder="8"/></div>
                <div className="form-group"><label className="form-label">Weight (kg)</label>
                  <input type="number" min="0" step="0.5" value={entry.weight} onChange={e=>updateSchemaEntry(idx,'weight',e.target.value)} placeholder="80"/></div>
              </div>
            </div>
          ))}
          <button className="btn btn-primary" style={{marginTop:8}} onClick={logSchemaWorkout}>Log All Exercises</button>
        </div>
      </Modal>}

      {showAddExModal&&<Modal title="Add Custom Exercise" onClose={()=>setShowAddExModal(false)}>
        <div className="col">
          <div className="form-group"><label className="form-label">Exercise name</label>
            <input value={newExForm.name} onChange={e=>setNewExForm(p=>({...p,name:e.target.value}))} placeholder="e.g. Cable Fly" autoFocus onKeyDown={e=>e.key==='Enter'&&addCustomEx()}/></div>
          <div className="form-row">
            <div className="form-group"><label className="form-label">Body Part</label>
              <select value={newExForm.bodyPart} onChange={e=>setNewExForm(p=>({...p,bodyPart:e.target.value}))}>
                {BODY_PARTS.filter(b=>b!=='All').map(b=><option key={b} value={b}>{b}</option>)}
              </select></div>
            <div className="form-group"><label className="form-label">Category</label>
              <select value={newExForm.category} onChange={e=>setNewExForm(p=>({...p,category:e.target.value}))}>
                {CATEGORIES.filter(c=>c!=='All').map(c=><option key={c} value={c}>{c}</option>)}
              </select></div>
          </div>
          <button className="btn btn-primary" onClick={addCustomEx}>Add Exercise</button>
        </div>
      </Modal>}

      {addToSchemaEx&&<Modal title={`Add "${addToSchemaEx.name}" to schema`} onClose={()=>setAddToSchemaEx(null)}>
        {workoutSchemas.length===0
          ? <div style={{textAlign:'center',padding:'20px 0'}}>
              <div style={{color:'var(--text3)',fontSize:13,marginBottom:16}}>No schemas yet.</div>
              <button className="btn btn-primary" onClick={()=>{setAddToSchemaEx(null);setShowSchemaModal(true);}}>Create a Schema first</button>
            </div>
          : <div className="col" style={{gap:8}}>
              {workoutSchemas.map(s=>{
                const already=s.exercises.includes(addToSchemaEx.name);
                return (
                  <button key={s.id} onClick={()=>!already&&addExToSchema(s.id,addToSchemaEx.name)}
                    style={{display:'flex',alignItems:'center',justifyContent:'space-between',padding:'14px 16px',borderRadius:'var(--radius-sm)',
                      border:`1px solid ${already?'var(--accent-border)':'var(--border)'}`,
                      background:already?'var(--accent-dim)':'var(--bg3)',cursor:already?'default':'pointer',transition:'all 0.15s',width:'100%',textAlign:'left'}}>
                    <span style={{fontSize:14,fontWeight:500,color:already?'var(--accent)':'var(--text)'}}>{s.name}</span>
                    {already
                      ? <span style={{fontSize:11,color:'var(--accent)',display:'flex',alignItems:'center',gap:4}}><Icon name="check" size={13}/>Added</span>
                      : <span style={{fontSize:11,color:'var(--text3)'}}>Tap to add</span>}
                  </button>
                );
              })}
            </div>}
      </Modal>}
    </div>
  );
};

// ── FOOD ──────────────────────────────────────────────────────────────────
const MacroBar = ({ protein, carbs, fat }) => {
  const total = protein + carbs + fat;
  if (!total) return null;
  const pPct = (protein/total)*100, cPct = (carbs/total)*100, fPct = (fat/total)*100;
  return (
    <div>
      <div style={{display:'flex',height:6,borderRadius:3,overflow:'hidden',gap:1,marginBottom:6}}>
        {protein>0&&<div style={{width:`${pPct}%`,background:'var(--blue)',borderRadius:3}}/>}
        {carbs>0&&<div style={{width:`${cPct}%`,background:'var(--amber)',borderRadius:3}}/>}
        {fat>0&&<div style={{width:`${fPct}%`,background:'var(--red)',borderRadius:3}}/>}
      </div>
      <div style={{display:'flex',gap:12,fontSize:11,fontFamily:'var(--mono)'}}>
        <span style={{color:'var(--blue)'}}>P {protein}g</span>
        <span style={{color:'var(--amber)'}}>C {carbs}g</span>
        <span style={{color:'var(--red)'}}>F {fat}g</span>
      </div>
    </div>
  );
};

const FoodSection = ({ meals, setMeals, favMeals, setFavMeals, calorieGoal, setCalorieGoal, waterLogs, setWaterLogs, markActive, mealTemplates, setMealTemplates }) => {
  const [selectedDate, setSelectedDate] = useState(TODAY);
  const [showAddModal, setShowAddModal] = useState(false);
  const [addSlot, setAddSlot] = useState('breakfast');
  const [mealForm, setMealForm] = useState({ name:'', calories:'', protein:'', carbs:'', fat:'' });
  const [baseNutrition, setBaseNutrition] = useState(null); // per-serving values from DB
  const [portionInput, setPortionInput] = useState('1');
  const [tab, setTab] = useState('plan');
  const [showGoalModal, setShowGoalModal] = useState(false);
  const [goalInput, setGoalInput] = useState('');
  const [showSaveTemplateModal, setShowSaveTemplateModal] = useState(false);
  const [templateNameInput, setTemplateNameInput] = useState('');
  const [showScanner, setShowScanner] = useState(false);

  // Extract gram amount from food name e.g. "Chicken breast 100g" → 100
  const extractGrams = name => { const m = name.match(/(\d+)\s*g\b/i); return m ? parseInt(m[1]) : null; };

  const handlePortion = val => {
    setPortionInput(val);
    if (!baseNutrition) return;
    const num = parseFloat(val);
    if (!num || num <= 0) return;
    const ratio = baseNutrition.grams ? num / baseNutrition.grams : num;
    setMealForm(prev => ({
      ...prev,
      calories: Math.round(baseNutrition.cal * ratio),
      protein:  Math.round(baseNutrition.p   * ratio),
      carbs:    Math.round(baseNutrition.c   * ratio),
      fat:      Math.round(baseNutrition.f   * ratio),
    }));
  };

  const SLOTS = ['breakfast','lunch','dinner','snacks'];
  const slotIcon = { breakfast:'☀️', lunch:'🌤️', dinner:'🌙', snacks:'🍎' };
  const dayMeals = meals[selectedDate] || {};

  // Totals for selected day
  const totals = useMemo(() => {
    const all = SLOTS.flatMap(s => dayMeals[s] || []);
    return {
      cal: all.reduce((s,m)=>s+(m.calories||0),0),
      p:   all.reduce((s,m)=>s+(m.protein||0),0),
      c:   all.reduce((s,m)=>s+(m.carbs||0),0),
      f:   all.reduce((s,m)=>s+(m.fat||0),0),
    };
  }, [dayMeals]);

  // Water
  const waterToday = waterLogs[selectedDate] || 0;
  const WATER_GOAL = 8;
  const addWater    = () => setWaterLogs(prev=>{const n={...prev,[selectedDate]:Math.min((prev[selectedDate]||0)+1,20)};save('waterLogs',n);return n;});
  const removeWater = () => setWaterLogs(prev=>{
    const cur=prev[selectedDate]||0; if(!cur)return prev;
    const next=cur-1;
    const n={...prev};
    if(next===0) delete n[selectedDate]; else n[selectedDate]=next;
    save('waterLogs',n); return n;
  });

  // 7-day calorie history for Stats tab
  const calHistory = useMemo(() => {
    return Array.from({length:7},(_,i)=>{
      const d=new Date(); d.setDate(d.getDate()-(6-i));
      const date=d.toISOString().split('T')[0];
      const dm=meals[date]||{};
      const cal=SLOTS.flatMap(s=>dm[s]||[]).reduce((s,m)=>s+(m.calories||0),0);
      return {date:date.slice(5),value:cal,full:date};
    });
  },[meals]);

  const weeklyAvg = useMemo(()=>{
    const days=calHistory.filter(d=>d.value>0);
    if(!days.length)return null;
    const avgCal=Math.round(days.reduce((_,d)=>_+d.value,0)/days.length);
    const avgP=Math.round(days.reduce((_,d)=>{const dm=meals[d.full]||{};return _+SLOTS.flatMap(s=>dm[s]||[]).reduce((s,m)=>s+(m.protein||0),0);},0)/days.length);
    const avgC=Math.round(days.reduce((_,d)=>{const dm=meals[d.full]||{};return _+SLOTS.flatMap(s=>dm[s]||[]).reduce((s,m)=>s+(m.carbs||0),0);},0)/days.length);
    const avgF=Math.round(days.reduce((_,d)=>{const dm=meals[d.full]||{};return _+SLOTS.flatMap(s=>dm[s]||[]).reduce((s,m)=>s+(m.fat||0),0);},0)/days.length);
    return {avgCal,avgP,avgC,avgF};
  },[calHistory,meals]);

  const openAdd = slot => {
    setAddSlot(slot);
    setMealForm({name:'',calories:'',protein:'',carbs:'',fat:''});
    setBaseNutrition(null);
    setPortionInput('1');
    setShowAddModal(true);
  };

  const addMeal = () => {
    if (!mealForm.name.trim()) return;
    const m = { id:Date.now(), name:mealForm.name.trim(), calories:parseInt(mealForm.calories)||0, protein:parseInt(mealForm.protein)||0, carbs:parseInt(mealForm.carbs)||0, fat:parseInt(mealForm.fat)||0 };
    setMeals(prev=>{const day=prev[selectedDate]||{};const updated={...prev,[selectedDate]:{...day,[addSlot]:[...(day[addSlot]||[]),m]}};save('meals',updated);return updated;});
    markActive(selectedDate); setShowAddModal(false);
  };

  const removeMeal = (slot,id) => setMeals(prev=>{const day=prev[selectedDate]||{};const updated={...prev,[selectedDate]:{...day,[slot]:(day[slot]||[]).filter(m=>m.id!==id)}};save('meals',updated);return updated;});
  const saveFav = meal => { if(favMeals.find(f=>f.name===meal.name))return; setFavMeals(prev=>{const n=[...prev,{...meal,id:Date.now()}];save('favMeals',n);return n;}); };
  const addFavToSlot = (fav,slot) => setMeals(prev=>{const day=prev[selectedDate]||{};const updated={...prev,[selectedDate]:{...day,[slot]:[...(day[slot]||[]),{...fav,id:Date.now()}]}};save('meals',updated);return updated;});
  const deleteFav = id => setFavMeals(prev=>{const n=prev.filter(f=>f.id!==id);save('favMeals',n);return n;});

  const saveGoal = () => { const g=parseInt(goalInput)||0; setCalorieGoal(g); save('calorieGoal',g); setShowGoalModal(false); };

  const [barcodeNotice, setBarcodeNotice] = useState('');
  const handleBarcodeScan = async code => {
    setShowScanner(false);
    setBarcodeNotice('');
    setShowAddModal(true);
    setMealForm({ name:'', calories:'', protein:'', carbs:'', fat:'' });
    setBaseNutrition(null); setPortionInput('1');
    try {
      const res = await fetch(`https://world.openfoodfacts.org/api/v0/product/${encodeURIComponent(code)}.json`);
      const data = await res.json();
      if (data.status === 1 && data.product) {
        const prod = data.product;
        const nut  = prod.nutriments || {};
        const name = [prod.product_name, prod.brands].filter(Boolean).join(' — ') || code;

        // Scan every possible key Open Food Facts might use for each nutrient
        const firstPos = (keys) => { for (const k of keys) { if (nut[k] > 0) return nut[k]; } return null; };
        const scanKeys = (includes, excludes=[]) => {
          for (const [k,v] of Object.entries(nut)) {
            if (typeof v !== 'number' || v <= 0) continue;
            if (excludes.some(x=>k.includes(x))) continue;
            if (includes.every(x=>k.includes(x))) return v;
          }
          return null;
        };

        // Calories: try kcal keys, then kJ keys (÷4.184), then scan all energy keys
        const kcalVal = firstPos(['energy-kcal_100g','energy-kcal_serving','energy-kcal']);
        const kjVal   = firstPos(['energy-kj_100g','energy-kj_serving','energy-kj','energy_100g','energy_serving','energy'])
                     ?? scanKeys(['energy'],['label','unit','modifier','_unit']);
        const cal = Math.round(kcalVal ?? (kjVal != null ? kjVal/4.184 : 0));

        // Protein: singular and plural, _100g and bare key
        const pro = Math.round(firstPos(['proteins_100g','protein_100g','proteins_serving','protein_serving','proteins','protein']) ?? 0);
        const car = Math.round(firstPos(['carbohydrates_100g','carbohydrates_serving','carbohydrates','carbs_100g','carbs']) ?? 0);
        const fat = Math.round(firstPos(['fat_100g','fat_serving','fat','lipids_100g','lipids']) ?? 0);
        setBaseNutrition({ cal, p:pro, c:car, f:fat, grams:100 });
        setPortionInput('100');
        setMealForm(prev => ({ ...prev, name:`${name} 100g`, calories:cal||'', protein:pro||'', carbs:car||'', fat:fat||'' }));
        setBarcodeNotice(cal === 0
          ? `Found: ${name} — but nutrition data is missing from the Open Food Facts database. Check the product label and fill in below.`
          : '');
      } else {
        // Product not in Open Food Facts — let user fill in manually
        setMealForm(prev => ({ ...prev, name:`Product ${code}` }));
        setBarcodeNotice(`Barcode ${code} not found in database — fill in the details below.`);
      }
    } catch {
      setMealForm(prev => ({ ...prev, name:`Product ${code}` }));
      setBarcodeNotice('Could not reach the food database — fill in details manually.');
    }
  };

  const saveTemplate = () => {
    if (!templateNameInput.trim()) return;
    const dayData = meals[selectedDate] || {};
    const hasData = ['breakfast','lunch','dinner','snacks'].some(s=>(dayData[s]||[]).length>0);
    if (!hasData) { alert('No meals to save for this day.'); return; }
    const t = { id:Date.now(), name:templateNameInput.trim(), meals:JSON.parse(JSON.stringify(dayData)) };
    setMealTemplates(prev=>{ const n=[...prev,t]; save('mealTemplates',n); return n; });
    setTemplateNameInput(''); setShowSaveTemplateModal(false);
  };
  const loadTemplate = (tmpl) => {
    if (!window.confirm(`Load "${tmpl.name}" into ${selectedDate}? This will replace existing meals for that day.`)) return;
    const newMeals = JSON.parse(JSON.stringify(tmpl.meals));
    // Re-assign IDs to avoid collisions
    ['breakfast','lunch','dinner','snacks'].forEach(s=>{ if(newMeals[s]) newMeals[s]=newMeals[s].map(m=>({...m,id:Date.now()+Math.random()})); });
    setMeals(prev=>{ const n={...prev,[selectedDate]:newMeals}; save('meals',n); return n; });
    markActive(selectedDate); setTab('plan');
  };
  const deleteTemplate = id => setMealTemplates(prev=>{ const n=prev.filter(t=>t.id!==id); save('mealTemplates',n); return n; });

  const goalPct = calorieGoal>0 ? Math.min(totals.cal/calorieGoal,1) : 0;
  const overGoal = calorieGoal>0 && totals.cal>calorieGoal;

  return (
    <div className="section">
      <div style={{display:'flex',alignItems:'flex-start',justifyContent:'space-between',marginBottom:24,flexWrap:'wrap',gap:10}}>
        <div className="section-title">Food</div>
        <input type="date" value={selectedDate} onChange={e=>setSelectedDate(e.target.value)} style={{width:'auto',fontSize:13}}/>
      </div>

      <div className="tab-bar">
        {[['plan','Meal Plan'],['stats','Stats'],['favorites','Favorites'],['templates','Templates']].map(([id,label])=>(
          <button key={id} className={`tab-btn ${tab===id?'active':''}`} onClick={()=>setTab(id)}>{label}</button>
        ))}
      </div>

      {tab==='plan'&&<div className="col">
        {/* Calorie summary card */}
        <div className="card" style={{padding:'18px 20px'}}>
          <div style={{display:'flex',alignItems:'flex-start',justifyContent:'space-between',marginBottom:calorieGoal>0?12:8}}>
            <div>
              <div style={{fontSize:28,fontWeight:700,fontFamily:'var(--mono)',color:overGoal?'var(--red)':'var(--accent)',lineHeight:1}}>
                {totals.cal.toLocaleString()}
                <span style={{fontSize:14,color:'var(--text2)',fontWeight:400,marginLeft:4}}>kcal</span>
              </div>
              {calorieGoal>0&&<div style={{fontSize:12,color:'var(--text3)',marginTop:4}}>
                {overGoal
                  ? <span style={{color:'var(--red)'}}>+{(totals.cal-calorieGoal).toLocaleString()} over goal</span>
                  : <span>{(calorieGoal-totals.cal).toLocaleString()} kcal remaining</span>}
              </div>}
            </div>
            <button className="btn btn-ghost btn-sm" onClick={()=>{setGoalInput(calorieGoal||'');setShowGoalModal(true);}}>
              {calorieGoal>0 ? `Goal: ${calorieGoal.toLocaleString()}` : 'Set Goal'}
            </button>
          </div>

          {calorieGoal>0&&(
            <div style={{marginBottom:12}}>
              <div style={{height:8,background:'var(--bg4)',borderRadius:4,overflow:'hidden'}}>
                <div style={{height:'100%',borderRadius:4,background:overGoal?'var(--red)':'var(--accent)',width:`${goalPct*100}%`,transition:'width 0.4s ease'}}/>
              </div>
              <div style={{display:'flex',justifyContent:'space-between',marginTop:4,fontSize:11,color:'var(--text3)',fontFamily:'var(--mono)'}}>
                <span>0</span><span>{Math.round(goalPct*100)}%</span><span>{calorieGoal.toLocaleString()}</span>
              </div>
            </div>
          )}

          <MacroBar protein={totals.p} carbs={totals.c} fat={totals.f}/>
        </div>

        {/* Water tracker */}
        <div className="card" style={{padding:'14px 16px'}}>
          <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:10}}>
            <div style={{display:'flex',alignItems:'center',gap:8}}>
              <span style={{fontSize:18}}>💧</span>
              <div className="card-title" style={{marginBottom:0}}>Water Intake</div>
            </div>
            <span style={{fontSize:13,fontWeight:600,fontFamily:'var(--mono)',color:waterToday>=WATER_GOAL?'var(--accent)':'var(--text2)'}}>{waterToday} / {WATER_GOAL} glasses</span>
          </div>
          <div style={{display:'flex',gap:4,marginBottom:10,flexWrap:'wrap'}}>
            {Array.from({length:WATER_GOAL},(_,i)=>(
              <div key={i} style={{fontSize:18,opacity:i<waterToday?1:0.25,transition:'opacity 0.2s',cursor:'pointer'}} onClick={i<waterToday?removeWater:addWater}>💧</div>
            ))}
          </div>
          <div style={{display:'flex',gap:8}}>
            <button className="btn btn-ghost btn-sm" onClick={removeWater} disabled={!waterToday} style={{flex:1,justifyContent:'center'}}>− glass</button>
            <button className="btn btn-primary btn-sm" onClick={addWater} style={{flex:1,justifyContent:'center'}}>+ glass</button>
          </div>
        </div>

        {/* Meal slots */}
        {SLOTS.map(slot=>{
          const items = dayMeals[slot]||[];
          const sc = items.reduce((s,m)=>s+(m.calories||0),0);
          const sp = items.reduce((s,m)=>s+(m.protein||0),0);
          const sca= items.reduce((s,m)=>s+(m.carbs||0),0);
          const sf = items.reduce((s,m)=>s+(m.fat||0),0);
          return (
            <div key={slot} className="card">
              <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:items.length?12:0}}>
                <div style={{display:'flex',alignItems:'center',gap:8}}>
                  <span style={{fontSize:18}}>{slotIcon[slot]}</span>
                  <div style={{fontSize:13,fontWeight:600,textTransform:'capitalize',color:'var(--text)'}}>{slot}</div>
                </div>
                <div style={{display:'flex',alignItems:'center',gap:8}}>
                  {sc>0&&<span style={{fontSize:12,color:'var(--accent)',fontFamily:'var(--mono)',fontWeight:600}}>{sc} kcal</span>}
                  <button className="btn btn-icon btn-ghost btn-sm" onClick={()=>openAdd(slot)}><Icon name="plus" size={14}/></button>
                </div>
              </div>

              {items.length===0&&<div style={{fontSize:12,color:'var(--text3)',paddingTop:4}}>Empty — tap + to add</div>}

              {items.length>0&&<>
                <div className="col" style={{gap:8,marginBottom:10}}>
                  {items.map(m=>(
                    <div key={m.id} style={{display:'flex',alignItems:'center',gap:8}}>
                      <div style={{flex:1,minWidth:0}}>
                        <div style={{fontSize:13,fontWeight:500,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{m.name}</div>
                        <div style={{display:'flex',gap:8,marginTop:2,fontSize:11,fontFamily:'var(--mono)'}}>
                          <span style={{color:'var(--accent)'}}>{m.calories}kcal</span>
                          {m.protein>0&&<span style={{color:'var(--blue)'}}>P{m.protein}</span>}
                          {m.carbs>0&&<span style={{color:'var(--amber)'}}>C{m.carbs}</span>}
                          {m.fat>0&&<span style={{color:'var(--red)'}}>F{m.fat}</span>}
                        </div>
                      </div>
                      <button className="btn btn-icon" style={{color:'var(--amber)',padding:4,flexShrink:0}} title="Save as favorite" onClick={()=>saveFav(m)}><Icon name="starEmpty" size={13}/></button>
                      <button className="btn btn-icon btn-danger" style={{padding:4,flexShrink:0}} onClick={()=>removeMeal(slot,m.id)}><Icon name="close" size={13}/></button>
                    </div>
                  ))}
                </div>
                <MacroBar protein={sp} carbs={sca} fat={sf}/>
              </>}

              {favMeals.length>0&&<div style={{marginTop:12,display:'flex',flexWrap:'wrap',gap:6}}>
                {favMeals.map(f=><button key={f.id} className="fav-chip" onClick={()=>addFavToSlot(f,slot)}>+ {f.name}</button>)}
              </div>}
            </div>
          );
        })}
      </div>}

      {tab==='stats'&&<div className="col">
        {/* 7-day calorie chart */}
        <div className="card">
          <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:16}}>
            <div className="card-title" style={{marginBottom:0}}>7-Day Calories</div>
            {calorieGoal>0&&<span style={{fontSize:11,color:'var(--text3)',fontFamily:'var(--mono)'}}>goal: {calorieGoal.toLocaleString()}</span>}
          </div>
          <LineChart data={calHistory.filter(d=>d.value>0)} color="var(--accent)" label="calories7d"/>
          {calHistory.every(d=>d.value===0)&&<div className="empty-state" style={{padding:'16px 0'}}>No calorie data yet</div>}
        </div>

        {/* Macro weekly averages */}
        {weeklyAvg&&(
          <div className="card">
            <div className="card-title">Weekly Average</div>
            <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:12,marginBottom:16}}>
              {[['Calories','var(--accent)',`${weeklyAvg.avgCal} kcal`],['Protein','var(--blue)',`${weeklyAvg.avgP}g`],['Carbs','var(--amber)',`${weeklyAvg.avgC}g`],['Fat','var(--red)',`${weeklyAvg.avgF}g`]].map(([label,color,val])=>(
                <div key={label} style={{background:'var(--bg3)',borderRadius:8,padding:'12px 14px'}}>
                  <div style={{fontSize:11,color:'var(--text3)',marginBottom:4}}>{label}</div>
                  <div style={{fontSize:20,fontWeight:700,fontFamily:'var(--mono)',color}}>{val}</div>
                </div>
              ))}
            </div>
            <MacroBar protein={weeklyAvg.avgP} carbs={weeklyAvg.avgC} fat={weeklyAvg.avgF}/>
          </div>
        )}
      </div>}

      {tab==='favorites'&&<div className="col">
        {favMeals.length===0
          ? <div className="empty-state">No favorites yet — tap ☆ on any meal to save it here</div>
          : <div className="grid-2">
              {favMeals.map(f=>(
                <div key={f.id} className="card" style={{display:'flex',alignItems:'center',justifyContent:'space-between',gap:12}}>
                  <div style={{minWidth:0}}>
                    <div style={{fontSize:14,fontWeight:500,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{f.name}</div>
                    <div style={{display:'flex',gap:8,marginTop:4,fontSize:11,fontFamily:'var(--mono)'}}>

                        <div style={{fontSize:14,fontWeight:600}}>{t.name}</div>
                        <div style={{fontSize:11,color:'var(--text3)',fontFamily:'var(--mono)',marginTop:2}}>{totalCal} kcal · {slots.join(', ')}</div>
                      </div>
                      <div style={{display:'flex',gap:6,flexShrink:0}}>
                        <button className="btn btn-ghost btn-sm" style={{fontSize:11,padding:'4px 10px'}} onClick={()=>loadTemplate(t)}>Load into {selectedDate.slice(5)}</button>
                        <button className="btn btn-icon btn-danger" style={{padding:4}} onClick={()=>deleteTemplate(t.id)}><Icon name="trash" size={13}/></button>
                      </div>
                    </div>
                    {slots.map(s=>(
                      <div key={s} style={{fontSize:11,color:'var(--text2)',marginTop:4}}>
                        <span style={{textTransform:'capitalize',color:'var(--text3)'}}>{s}: </span>
                        {(t.meals[s]||[]).map(m=>m.name).join(', ')}
                      </div>
                    ))}
                  </div>
                );
