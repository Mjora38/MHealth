// ── Rest Timer component ───────────────────────────────────────────────────
const RestTimer = () => {
  const [seconds, setSeconds] = useState(0);
  const [total, setTotal] = useState(90);
  const [running, setRunning] = useState(false);
  const tickRef = useRef(null);

  const start = t => {
    clearInterval(tickRef.current);
    setTotal(t); setSeconds(t); setRunning(true);
    tickRef.current = setInterval(() => {
      setSeconds(s => {
        if (s <= 1) {
          clearInterval(tickRef.current);
          setRunning(false);
          if (navigator.vibrate) navigator.vibrate([300, 150, 300]);
          return 0;
        }
        return s - 1;
      });
    }, 1000);
  };

  const stop = () => { clearInterval(tickRef.current); setRunning(false); setSeconds(0); };
  useEffect(() => () => clearInterval(tickRef.current), []);

  const pct = total > 0 ? ((total - seconds) / total) : 0;
  const mins = Math.floor(seconds / 60), secs = seconds % 60;
  const timeStr = `${mins}:${String(secs).padStart(2,'0')}`;
  const urgent = seconds > 0 && seconds <= 10;

  return (
    <div className="card" style={{padding:'14px 16px'}}>
      <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:10}}>
        <div style={{fontSize:12,fontWeight:600,color:'var(--text3)',textTransform:'uppercase',letterSpacing:'0.8px'}}>⏱ Rest Timer</div>
        {running && <button className="btn btn-danger btn-sm" onClick={stop}>Stop</button>}
      </div>
      {running ? (
        <>
          <div style={{fontSize:36,fontWeight:700,fontFamily:'var(--mono)',color:urgent?'var(--red)':'var(--accent)',textAlign:'center',marginBottom:10,transition:'color 0.3s'}}>{timeStr}</div>
          <div style={{height:6,background:'var(--bg4)',borderRadius:3,overflow:'hidden',marginBottom:4}}>
            <div style={{height:'100%',borderRadius:3,background:urgent?'var(--red)':'var(--accent)',width:`${pct*100}%`,transition:'width 1s linear, background 0.3s'}}/>
          </div>
          <div style={{fontSize:11,color:'var(--text3)',textAlign:'right',fontFamily:'var(--mono)'}}>{seconds}s left</div>
        </>
      ) : (
        <div style={{display:'flex',gap:8,flexWrap:'wrap'}}>
          {[30,60,90,120].map(t => (
            <button key={t} className="btn btn-ghost btn-sm" onClick={()=>start(t)} style={{flex:1,justifyContent:'center',minWidth:52}}>
              {t < 60 ? `${t}s` : `${t/60}:00`}
            </button>
          ))}
        </div>
      )}
    </div>
  );
};

// ── GYM ───────────────────────────────────────────────────────────────────
const GymSection = ({ workoutSchemas, setWorkoutSchemas, workoutSessions, setWorkoutSessions, customExercises, setCustomExercises, markActive }) => {
  const [tab, setTab] = useState('log');
  // log
  const [showLogModal, setShowLogModal] = useState(false);
  const [logForm, setLogForm] = useState({ exercise:'', sets:'', reps:'', weight:'', date:TODAY });
  // schema workout
  const [schemaWorkout, setSchemaWorkout] = useState(null); // { schema, date, entries:[{exercise,sets,reps,weight}] }
  // schemas
  const [showSchemaModal, setShowSchemaModal] = useState(false);
  const [newSchema, setNewSchema] = useState({ name:'' });
  // exercises
  const [bodyPartFilter, setBodyPartFilter] = useState('All');
  const [categoryFilter, setCategoryFilter] = useState('All');
  const [exSearch, setExSearch] = useState('');
  const [showAddExModal, setShowAddExModal] = useState(false);
  const [newExForm, setNewExForm] = useState({ name:'', bodyPart:'Chest', category:'Barbell' });
  const [addToSchemaEx, setAddToSchemaEx] = useState(null);
  // progress
  const [chartExercise, setChartExercise] = useState('');
  const [chartMode, setChartMode] = useState('weight'); // 'weight' | 'volume'

  const loggedExercises = useMemo(()=>[...new Set(workoutSessions.map(w=>w.exercise))].sort(),[workoutSessions]);

  // PR map: exercise → { weight, date }
  const prMap = useMemo(()=>{
    const m = {};
    workoutSessions.forEach(s=>{
      const w = parseFloat(s.weight)||0;
      if (!m[s.exercise] || w > m[s.exercise].weight)
        m[s.exercise] = { weight: w, date: s.date, id: s.id };
    });
    return m;
  },[workoutSessions]);

  const chartData = useMemo(()=>{
    if(!chartExercise)return[];
    const sessions = workoutSessions.filter(w=>w.exercise===chartExercise).sort((a,b)=>a.date.localeCompare(b.date));
    const byDate = {};
    sessions.forEach(s=>{
      if(chartMode==='weight'){
        const w=parseFloat(s.weight)||0;
        if(!byDate[s.date]||w>byDate[s.date]) byDate[s.date]=w;
      } else {
        const vol=(parseInt(s.sets)||0)*(parseInt(s.reps)||0)*(parseFloat(s.weight)||0);
        byDate[s.date]=(byDate[s.date]||0)+vol;
      }
    });
    return Object.entries(byDate).map(([date,value])=>({date:date.slice(5),value:chartMode==='volume'?Math.round(value):value}));
  },[workoutSessions,chartExercise,chartMode]);

  // Monthly stats
  const stats = useMemo(()=>{
    const month = new Date().toISOString().slice(0,7);
    const ms = workoutSessions.filter(s=>s.date.startsWith(month));
    const days = new Set(ms.map(s=>s.date)).size;
    const exCount = {};
    ms.forEach(s=>{ exCount[s.exercise]=(exCount[s.exercise]||0)+1; });
    const topEx = Object.entries(exCount).sort((a,b)=>b[1]-a[1])[0]?.[0];
    const allEx = [...EXERCISE_DB,...customExercises];
    const bpCount = {};
    ms.forEach(s=>{ const ex=allEx.find(e=>e.name===s.exercise); if(ex) bpCount[ex.bodyPart]=(bpCount[ex.bodyPart]||0)+1; });
    const topBP = Object.entries(bpCount).sort((a,b)=>b[1]-a[1])[0]?.[0];
    const vol = Math.round(ms.reduce((sum,s)=>sum+(parseInt(s.sets)||0)*(parseInt(s.reps)||0)*(parseFloat(s.weight)||0),0));
    return { days, topEx, topBP, vol };
  },[workoutSessions,customExercises]);

  // Combined + filtered exercise list
  const allExercises = useMemo(()=>[
    ...EXERCISE_DB.map((e,i)=>({...e,id:`b${i}`,custom:false})),
    ...customExercises.map(e=>({...e,custom:true})),
  ],[customExercises]);

  const filteredExercises = useMemo(()=>{
    const q = exSearch.toLowerCase();
    return allExercises.filter(e=>
      (bodyPartFilter==='All'||e.bodyPart===bodyPartFilter)&&
      (categoryFilter==='All'||e.category===categoryFilter)&&
      (!q||e.name.toLowerCase().includes(q)||e.bodyPart.toLowerCase().includes(q))
    );
  },[allExercises,bodyPartFilter,categoryFilter,exSearch]);

  const addSchema=()=>{
    if(!newSchema.name.trim())return;
    const s={id:Date.now(),name:newSchema.name.trim(),exercises:[]};
    setWorkoutSchemas(prev=>{const n=[...prev,s];save('workoutSchemas',n);return n;});
    setNewSchema({name:''});setShowSchemaModal(false);
  };
  const deleteSchema=id=>setWorkoutSchemas(prev=>{const n=prev.filter(s=>s.id!==id);save('workoutSchemas',n);return n;});
  const removeFromSchema=(schemaId,exIdx)=>setWorkoutSchemas(prev=>{
    const n=prev.map(s=>s.id===schemaId?{...s,exercises:s.exercises.filter((_,i)=>i!==exIdx)}:s);
    save('workoutSchemas',n);return n;
  });

  const addExToSchema=(schemaId,exName)=>{
    setWorkoutSchemas(prev=>{
      const n=prev.map(s=>s.id===schemaId&&!s.exercises.includes(exName)?{...s,exercises:[...s.exercises,exName]}:s);
      save('workoutSchemas',n);return n;
    });
    setAddToSchemaEx(null);
  };

  // Detect PR when logging
  const detectPR = (exercise, weight) => {
    const prev = workoutSessions.filter(s=>s.exercise===exercise);
    const prevMax = prev.reduce((m,s)=>Math.max(m,parseFloat(s.weight)||0),0);
    return prev.length > 0 && (parseFloat(weight)||0) > prevMax;
  };

  const logWorkout=()=>{
    if(!logForm.exercise.trim())return;
    const isPR = detectPR(logForm.exercise.trim(), logForm.weight);
    const w={id:Date.now(),...logForm,exercise:logForm.exercise.trim(),isPR};
    setWorkoutSessions(prev=>{const n=[...prev,w];save('workoutSessions',n);return n;});
    markActive(logForm.date);setLogForm({exercise:'',sets:'',reps:'',weight:'',date:TODAY});setShowLogModal(false);
  };

  const logSchemaWorkout=()=>{
    if(!schemaWorkout)return;
    const newSessions = schemaWorkout.entries
      .filter(e=>e.exercise&&(e.sets||e.reps||e.weight))
      .map(e=>({ id:Date.now()+Math.random(), exercise:e.exercise, sets:e.sets, reps:e.reps, weight:e.weight, date:schemaWorkout.date, isPR:detectPR(e.exercise,e.weight) }));
    if(!newSessions.length)return;
    setWorkoutSessions(prev=>{const n=[...prev,...newSessions];save('workoutSessions',n);return n;});
    markActive(schemaWorkout.date);
    setSchemaWorkout(null);
  };

  const updateSchemaEntry=(idx,field,val)=>setSchemaWorkout(sw=>({...sw,entries:sw.entries.map((e,i)=>i===idx?{...e,[field]:val}:e)}));

  const deleteSession=id=>setWorkoutSessions(prev=>{const n=prev.filter(s=>s.id!==id);save('workoutSessions',n);return n;});
  const grouped=useMemo(()=>[...new Set(workoutSessions.map(w=>w.date))].sort().reverse().map(date=>({date,sessions:workoutSessions.filter(w=>w.date===date)})),[workoutSessions]);

  const addCustomEx=()=>{
    if(!newExForm.name.trim())return;
    const e={id:Date.now(),name:newExForm.name.trim(),bodyPart:newExForm.bodyPart,category:newExForm.category,custom:true};
    setCustomExercises(prev=>{const n=[...prev,e];save('customExercises',n);return n;});
    setNewExForm({name:'',bodyPart:'Chest',category:'Barbell'});setShowAddExModal(false);
  };
  const deleteCustomEx=id=>setCustomExercises(prev=>{const n=prev.filter(e=>e.id!==id);save('customExercises',n);return n;});

  return (
    <div className="section">
      <div style={{display:'flex',alignItems:'flex-start',justifyContent:'space-between',marginBottom:24,flexWrap:'wrap',gap:10}}>
        <div className="section-title">Gym</div>
        {tab==='log'       && <button className="btn btn-primary btn-sm" onClick={()=>setShowLogModal(true)}><Icon name="plus" size={15}/>Log Workout</button>}
        {tab==='exercises' && <button className="btn btn-ghost btn-sm" onClick={()=>setShowAddExModal(true)}><Icon name="plus" size={15}/>Add Exercise</button>}
      </div>

      <div className="tab-bar">
        {[['log','Log'],['schemas','Schemas'],['exercises','Exercises'],['progress','Progress']].map(([id,label])=>(
          <button key={id} className={`tab-btn ${tab===id?'active':''}`} onClick={()=>setTab(id)}>{label}</button>
        ))}
      </div>

      {/* ── LOG ── */}
      {tab==='log'&&<div className="col">
        {/* Rest Timer */}
        <RestTimer/>

        {/* Monthly Stats */}
        {workoutSessions.length > 0 && (
          <div className="card" style={{padding:'14px 16px'}}>
            <div className="card-title" style={{marginBottom:12}}>This Month</div>
            <div style={{display:'grid',gridTemplateColumns:'1fr 1fr 1fr',gap:8,textAlign:'center'}}>
              <div>
                <div style={{fontSize:22,fontWeight:700,fontFamily:'var(--mono)',color:'var(--accent)'}}>{stats.days}</div>
                <div style={{fontSize:11,color:'var(--text3)',marginTop:2}}>sessions</div>
              </div>
              <div>
                <div style={{fontSize:13,fontWeight:600,color:'var(--text)',overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}} title={stats.topEx||'—'}>{stats.topEx||'—'}</div>
                <div style={{fontSize:11,color:'var(--text3)',marginTop:2}}>top exercise</div>
              </div>
              <div>
                <div style={{fontSize:13,fontWeight:600,color:stats.topBP?bodyPartColor[stats.topBP]:'var(--text)'}}>{stats.topBP||'—'}</div>
                <div style={{fontSize:11,color:'var(--text3)',marginTop:2}}>top body part</div>
              </div>
            </div>
            {stats.vol > 0 && <div style={{marginTop:12,paddingTop:10,borderTop:'1px solid var(--border)',display:'flex',justifyContent:'space-between',alignItems:'center'}}>
              <span style={{fontSize:12,color:'var(--text3)'}}>Total volume</span>
              <span style={{fontSize:13,fontWeight:600,fontFamily:'var(--mono)',color:'var(--text)'}}>{stats.vol.toLocaleString()} kg</span>
            </div>}
          </div>
        )}

        {grouped.length===0&&<div className="empty-state">No workouts logged yet — tap "Log Workout" to start</div>}
        {grouped.map(({date,sessions})=>(
          <div key={date} className="card">
            <div className="card-title">{new Date(date+'T12:00').toLocaleDateString('en-US',{weekday:'long',month:'short',day:'numeric'})}</div>
            <div className="col" style={{gap:8}}>
              {sessions.map(w=>(
                <div key={w.id} style={{display:'flex',alignItems:'center',justifyContent:'space-between',gap:10}}>
                  <div style={{flex:1,minWidth:0}}>
                    <div style={{fontSize:14,fontWeight:500,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap',display:'flex',alignItems:'center',gap:6}}>
                      {w.exercise}
                      {w.isPR && <span style={{fontSize:10,background:'#f5a62322',color:'#f5a623',borderRadius:4,padding:'1px 5px',fontWeight:700,flexShrink:0}}>🏆 PR</span>}
                    </div>
                    <div style={{fontSize:11,color:'var(--text2)',fontFamily:'var(--mono)',marginTop:1}}>{w.sets}×{w.reps} @ {w.weight}kg</div>
                  </div>
                  <button className="btn btn-icon btn-danger" onClick={()=>deleteSession(w.id)}><Icon name="trash" size={15}/></button>
                </div>))}
            </div>
          </div>))}
      </div>}

      {/* ── SCHEMAS ── */}
      {tab==='schemas'&&<div className="col">
        <button className="btn btn-ghost" style={{width:'fit-content'}} onClick={()=>setShowSchemaModal(true)}><Icon name="plus" size={16}/>New Schema</button>
        {workoutSchemas.length===0&&<div className="empty-state">Create schemas like Push / Pull / Legs, then add exercises from the Exercises tab</div>}
        <div className="col">
          {workoutSchemas.map(s=>(
            <div key={s.id} className="card">
              <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:12}}>
                <div style={{fontSize:16,fontWeight:700}}>{s.name}</div>
                <div style={{display:'flex',gap:8}}>
                  {s.exercises.length > 0 && (
                    <button className="btn btn-primary btn-sm"
                      onClick={()=>setSchemaWorkout({schema:s, date:TODAY, entries:s.exercises.map(e=>({exercise:e,sets:'',reps:'',weight:''}))})}>
                      Start Workout
                    </button>
                  )}
                  <button className="btn btn-icon btn-danger" onClick={()=>deleteSchema(s.id)}><Icon name="trash" size={15}/></button>
                </div>
              </div>
              {s.exercises.length===0
                ? <div style={{fontSize:12,color:'var(--text3)'}}>No exercises yet — go to Exercises tab and tap + to add</div>
                : <div style={{display:'flex',flexWrap:'wrap',gap:6}}>
                    {s.exercises.map((e,i)=>(
                      <div key={i} style={{display:'flex',alignItems:'center',gap:4,background:'var(--bg4)',borderRadius:99,paddingLeft:10,paddingRight:4,paddingTop:3,paddingBottom:3}}>
                        <span style={{fontSize:12,fontWeight:500,color:'var(--text2)'}}>{e}</span>
                        <button onClick={()=>removeFromSchema(s.id,i)} style={{display:'flex',alignItems:'center',color:'var(--text3)',cursor:'pointer',padding:2,borderRadius:'50%',background:'none',border:'none'}}><Icon name="close" size={11}/></button>
                      </div>
                    ))}
                  </div>}
            </div>))}
        </div>
      </div>}

      {/* ── EXERCISES ── */}
      {tab==='exercises'&&<div className="col">
        <input value={exSearch} onChange={e=>setExSearch(e.target.value)} placeholder="Search exercises…"/>
        <FilterRow label="Body Part" options={BODY_PARTS} value={bodyPartFilter} onChange={setBodyPartFilter}/>
        <FilterRow label="Category" options={CATEGORIES} value={categoryFilter} onChange={setCategoryFilter}/>
        <div style={{fontSize:12,color:'var(--text3)'}}>{filteredExercises.length} exercise{filteredExercises.length!==1?'s':''}</div>
        {filteredExercises.length===0
          ? <div className="empty-state">No exercises match your filters</div>
          : <div className="col" style={{gap:8}}>
              {filteredExercises.map(ex=>(
                <div key={ex.id} className="card" style={{display:'flex',alignItems:'center',gap:12,padding:'12px 14px'}}>
                  <div style={{width:4,alignSelf:'stretch',borderRadius:2,background:bodyPartColor[ex.bodyPart]||'var(--border)',flexShrink:0}}/>
                  <div style={{flex:1,minWidth:0}}>
                    <div style={{fontSize:14,fontWeight:600,display:'flex',alignItems:'center',gap:6,flexWrap:'wrap'}}>
                      {ex.name}
                      {ex.custom&&<span style={{fontSize:10,background:'var(--accent-dim)',color:'var(--accent)',borderRadius:4,padding:'1px 5px',fontWeight:600}}>custom</span>}
                      {prMap[ex.name]&&<span style={{fontSize:10,background:'#f5a62322',color:'#f5a623',borderRadius:4,padding:'1px 5px',fontWeight:700}}>🏆 {prMap[ex.name].weight}kg</span>}
                    </div>
                    <div style={{display:'flex',gap:6,marginTop:5,flexWrap:'wrap'}}>
                      <span style={{fontSize:11,fontWeight:500,padding:'2px 8px',borderRadius:99,background:bodyPartColor[ex.bodyPart]+'22',color:bodyPartColor[ex.bodyPart]||'var(--text2)'}}>{ex.bodyPart}</span>
                      <span style={{fontSize:11,fontWeight:500,padding:'2px 8px',borderRadius:99,background:'var(--bg4)',color:'var(--text2)'}}>{ex.category}</span>
                    </div>
                  </div>
                  <div style={{display:'flex',gap:6,flexShrink:0}}>
                    {ex.custom&&<button className="btn btn-icon btn-danger" style={{padding:6}} onClick={()=>deleteCustomEx(ex.id)}><Icon name="trash" size={13}/></button>}
                    <button className="btn btn-icon btn-ghost" style={{padding:6}} onClick={()=>setAddToSchemaEx(ex)}><Icon name="plus" size={15}/></button>
                  </div>
                </div>
              ))}
            </div>}
      </div>}

      {/* ── PROGRESS ── */}
      {tab==='progress'&&<div className="col">
        {/* PR board */}
        {Object.keys(prMap).length > 0 && (
          <div className="card">
            <div className="card-title">Personal Records 🏆</div>
            <div className="col" style={{gap:6}}>
              {Object.entries(prMap).sort((a,b)=>b[1].weight-a[1].weight).slice(0,8).map(([ex,pr])=>(
                <div key={ex} style={{display:'flex',alignItems:'center',justifyContent:'space-between',gap:8,padding:'6px 0',borderBottom:'1px solid var(--border)'}}>
                  <span style={{fontSize:13,flex:1,minWidth:0,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{ex}</span>
                  <span style={{fontSize:13,fontWeight:700,fontFamily:'var(--mono)',color:'#f5a623',flexShrink:0}}>{pr.weight} kg</span>
                  <span style={{fontSize:11,color:'var(--text3)',fontFamily:'var(--mono)',flexShrink:0}}>{pr.date.slice(5)}</span>
                </div>
              ))}
            </div>
          </div>
        )}

        <div className="card">
          <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:16}}>
            <div className="card-title" style={{marginBottom:0}}>Progress Chart</div>
            <div style={{display:'flex',gap:4,background:'var(--bg3)',padding:3,borderRadius:8}}>
              {[['weight','Weight'],['volume','Volume']].map(([m,l])=>(
                <button key={m} onClick={()=>setChartMode(m)}
                  style={{padding:'4px 10px',borderRadius:6,fontSize:11,fontWeight:500,cursor:'pointer',transition:'all 0.15s',
                    background:chartMode===m?'var(--bg2)':'transparent',
                    color:chartMode===m?'var(--text)':'var(--text3)',
                    border:chartMode===m?'1px solid var(--border)':'1px solid transparent'}}>
                  {l}
                </button>
              ))}
            </div>
          </div>
          {loggedExercises.length===0?<div className="empty-state">Log workouts to see your progress</div>:<>
            <select value={chartExercise} onChange={e=>setChartExercise(e.target.value)} style={{marginBottom:16}}>
              <option value="">— Select exercise —</option>
              {loggedExercises.map(e=><option key={e} value={e}>{e}</option>)}
            </select>
            {chartExercise&&<>
              <LineChart data={chartData} label={chartExercise}/>
              <div style={{fontSize:11,color:'var(--text3)',marginTop:8,textAlign:'center',fontFamily:'var(--mono)'}}>
                {chartMode==='weight'?'Max weight (kg)':'Total volume (kg) per session'}
              </div>
            </>}
          </>}
        </div>
      </div>}

      {/* ── MODALS ── */}
      {showSchemaModal&&<Modal title="New Schema" onClose={()=>setShowSchemaModal(false)}>
        <div className="col">
          <div className="form-group"><label className="form-label">Schema Name</label>
            <input value={newSchema.name} onChange={e=>setNewSchema(p=>({...p,name:e.target.value}))} placeholder="Push Day" autoFocus onKeyDown={e=>e.key==='Enter'&&addSchema()}/></div>
          <button className="btn btn-primary" onClick={addSchema}>Create Schema</button>
        </div>
      </Modal>}

      {showLogModal&&<Modal title="Log Workout" onClose={()=>setShowLogModal(false)}>
        <div className="col">
          <div className="form-row">
            <div className="form-group"><label className="form-label">Exercise</label>
              <input value={logForm.exercise} onChange={e=>setLogForm(p=>({...p,exercise:e.target.value}))} placeholder="Bench Press" list="ex-list" autoFocus/>
              <datalist id="ex-list">{[...loggedExercises,...allExercises.map(e=>e.name)].filter((v,i,a)=>a.indexOf(v)===i).map(e=><option key={e} value={e}/>)}</datalist></div>
            <div className="form-group"><label className="form-label">Date</label>
              <input type="date" value={logForm.date} onChange={e=>setLogForm(p=>({...p,date:e.target.value}))}/></div>
          </div>
          <div className="form-row">
            <div className="form-group"><label className="form-label">Sets</label>
              <input type="number" min="1" value={logForm.sets} onChange={e=>setLogForm(p=>({...p,sets:e.target.value}))} placeholder="3"/></div>
            <div className="form-group"><label className="form-label">Reps</label>
              <input type="number" min="1" value={logForm.reps} onChange={e=>setLogForm(p=>({...p,reps:e.target.value}))} placeholder="8"/></div>
            <div className="form-group"><label className="form-label">Weight (kg)</label>
              <input type="number" min="0" step="0.5" value={logForm.weight} onChange={e=>setLogForm(p=>({...p,weight:e.target.value}))} placeholder="80"/></div>
          </div>
          <button className="btn btn-primary" onClick={logWorkout}>Log Workout</button>
        </div>
      </Modal>}

      {/* Schema workout modal */}
      {schemaWorkout&&<Modal title={`${schemaWorkout.schema.name} — ${schemaWorkout.date}`} onClose={()=>setSchemaWorkout(null)}>
        <div className="col">
          <div className="form-group" style={{marginBottom:4}}>
            <label className="form-label">Date</label>
            <input type="date" value={schemaWorkout.date} onChange={e=>setSchemaWorkout(sw=>({...sw,date:e.target.value}))}/>
          </div>
          <div className="divider"/>
          {schemaWorkout.entries.map((entry,idx)=>(
            <div key={idx} style={{padding:'12px 0',borderBottom:'1px solid var(--border)'}}>
              <div style={{fontSize:14,fontWeight:600,marginBottom:10,color:'var(--text)'}}>{entry.exercise}</div>
              <div className="form-row">
                <div className="form-group"><label className="form-label">Sets</label>
                  <input type="number" min="1" value={entry.sets} onChange={e=>updateSchemaEntry(idx,'sets',e.target.value)} placeholder="3"/></div>
                <div className="form-group"><label className="form-label">Reps</label>
                  <input type="number" min="1" value={entry.reps} onChange={e=>updateSchemaEntry(idx,'reps',e.target.value)} placeholder="8"/></div>
                <div className="form-group"><label className="form-label">Weight (kg)</label>
                  <input type="number" min="0" step="0.5" value={entry.weight} onChange={e=>updateSchemaEntry(idx,'weight',e.target.value)} placeholder="80"/></div>
              </div>
            </div>
          ))}
          <button className="btn btn-primary" style={{marginTop:8}} onClick={logSchemaWorkout}>Log All Exercises</button>
        </div>
      </Modal>}

      {showAddExModal&&<Modal title="Add Custom Exercise" onClose={()=>setShowAddExModal(false)}>
        <div className="col">
          <div className="form-group"><label className="form-label">Exercise name</label>
            <input value={newExForm.name} onChange={e=>setNewExForm(p=>({...p,name:e.target.value}))} placeholder="e.g. Cable Fly" autoFocus onKeyDown={e=>e.key==='Enter'&&addCustomEx()}/></div>
          <div className="form-row">
            <div className="form-group"><label className="form-label">Body Part</label>
              <select value={newExForm.bodyPart} onChange={e=>setNewExForm(p=>({...p,bodyPart:e.target.value}))}>
                {BODY_PARTS.filter(b=>b!=='All').map(b=><option key={b} value={b}>{b}</option>)}
              </select></div>
            <div className="form-group"><label className="form-label">Category</label>
              <select value={newExForm.category} onChange={e=>setNewExForm(p=>({...p,category:e.target.value}))}>
                {CATEGORIES.filter(c=>c!=='All').map(c=><option key={c} value={c}>{c}</option>)}
              </select></div>
          </div>
          <button className="btn btn-primary" onClick={addCustomEx}>Add Exercise</button>
        </div>
      </Modal>}

      {addToSchemaEx&&<Modal title={`Add "${addToSchemaEx.name}" to schema`} onClose={()=>setAddToSchemaEx(null)}>
        {workoutSchemas.length===0
          ? <div style={{textAlign:'center',padding:'20px 0'}}>
              <div style={{color:'var(--text3)',fontSize:13,marginBottom:16}}>No schemas yet.</div>
              <button className="btn btn-primary" onClick={()=>{setAddToSchemaEx(null);setShowSchemaModal(true);}}>Create a Schema first</button>
            </div>
          : <div className="col" style={{gap:8}}>
              {workoutSchemas.map(s=>{
                const already=s.exercises.includes(addToSchemaEx.name);
                return (
                  <button key={s.id} onClick={()=>!already&&addExToSchema(s.id,addToSchemaEx.name)}
                    style={{display:'flex',alignItems:'center',justifyContent:'space-between',padding:'14px 16px',borderRadius:'var(--radius-sm)',
                      border:`1px solid ${already?'var(--accent-border)':'var(--border)'}`,
                      background:already?'var(--accent-dim)':'var(--bg3)',cursor:already?'default':'pointer',transition:'all 0.15s',width:'100%',textAlign:'left'}}>
                    <span style={{fontSize:14,fontWeight:500,color:already?'var(--accent)':'var(--text)'}}>{s.name}</span>
                    {already
                      ? <span style={{fontSize:11,color:'var(--accent)',display:'flex',alignItems:'center',gap:4}}><Icon name="check" size={13}/>Added</span>
                      : <span style={{fontSize:11,color:'var(--text3)'}}>Tap to add</span>}
                  </button>
                );
              })}
            </div>}
      </Modal>}
    </div>
  );
};

// ── FOOD ──────────────────────────────────────────────────────────────────
const FoodSection = ({ meals, setMeals, favMeals, setFavMeals, markActive }) => {
  const [selectedDate, setSelectedDate] = useState(TODAY);
  const [showAddModal, setShowAddModal] = useState(false);
  const [addSlot, setAddSlot] = useState('breakfast');
  const [mealForm, setMealForm] = useState({ name:'', calories:'' });
  const [tab, setTab] = useState('plan');
  const SLOTS=['breakfast','lunch','dinner','snacks'];
  const slotIcon={breakfast:'☀️',lunch:'🌤️',dinner:'🌙',snacks:'🍎'};
  const dayMeals=meals[selectedDate]||{};
  const totalCals=SLOTS.reduce((s,slot)=>s+(dayMeals[slot]||[]).reduce((a,m)=>a+(m.calories||0),0),0);
  const openAdd=slot=>{setAddSlot(slot);setMealForm({name:'',calories:''});setShowAddModal(true);};
  const addMeal=()=>{
    if(!mealForm.name.trim())return;
    const m={id:Date.now(),name:mealForm.name.trim(),calories:parseInt(mealForm.calories)||0};
    setMeals(prev=>{const day=prev[selectedDate]||{};const updated={...prev,[selectedDate]:{...day,[addSlot]:[...(day[addSlot]||[]),m]}};save('meals',updated);return updated;});
    markActive(selectedDate);setShowAddModal(false);
  };
  const removeMeal=(slot,id)=>setMeals(prev=>{const day=prev[selectedDate]||{};const updated={...prev,[selectedDate]:{...day,[slot]:(day[slot]||[]).filter(m=>m.id!==id)}};save('meals',updated);return updated;});
  const saveFav=meal=>{
    if(favMeals.find(f=>f.name===meal.name))return;
    setFavMeals(prev=>{const n=[...prev,{...meal,id:Date.now()}];save('favMeals',n);return n;});
  };
  const addFavToSlot=(fav,slot)=>setMeals(prev=>{const day=prev[selectedDate]||{};const updated={...prev,[selectedDate]:{...day,[slot]:[...(day[slot]||[]),{...fav,id:Date.now()}]}};save('meals',updated);return updated;});
  const deleteFav=id=>setFavMeals(prev=>{const n=prev.filter(f=>f.id!==id);save('favMeals',n);return n;});
  return (
    <div className="section">
      <div style={{display:'flex',alignItems:'flex-start',justifyContent:'space-between',marginBottom:24,flexWrap:'wrap',gap:10}}>
        <div className="section-title">Food</div>
        <input type="date" value={selectedDate} onChange={e=>setSelectedDate(e.target.value)} style={{width:'auto',fontSize:13}}/>
      </div>
      <div className="tab-bar">
        {[['plan','Meal Plan'],['favorites','Favorites']].map(([id,label])=>(
          <button key={id} className={`tab-btn ${tab===id?'active':''}`} onClick={()=>setTab(id)}>{label}</button>
        ))}
      </div>
      {tab==='plan'&&<div className="col">
        <div style={{background:'var(--accent-dim)',border:'1px solid var(--accent-border)',borderRadius:12,padding:'14px 20px',display:'flex',alignItems:'center',justifyContent:'space-between'}}>
          <span style={{fontSize:13,color:'var(--text2)'}}>Daily Total</span>
          <span style={{fontSize:24,fontWeight:700,color:'var(--accent)',fontFamily:'var(--mono)'}}>{totalCals} <span style={{fontSize:14}}>kcal</span></span>
        </div>
        {SLOTS.map(slot=>{
          const items=dayMeals[slot]||[];const slotCals=items.reduce((s,m)=>s+(m.calories||0),0);
          return (
            <div key={slot} className="card">
              <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:12}}>
                <div style={{display:'flex',alignItems:'center',gap:8}}>
                  <span style={{fontSize:16}}>{slotIcon[slot]}</span>
                  <div className="card-title" style={{marginBottom:0,textTransform:'capitalize'}}>{slot}</div>
                </div>
                <div style={{display:'flex',alignItems:'center',gap:10}}>
                  <span style={{fontSize:12,color:'var(--text3)',fontFamily:'var(--mono)'}}>{slotCals} kcal</span>
                  <button className="btn btn-icon btn-ghost btn-sm" onClick={()=>openAdd(slot)}><Icon name="plus" size={14}/></button>
                </div>
              </div>
              {items.length===0?<div style={{fontSize:12,color:'var(--text3)'}}>No items — tap + to add</div>
                :<div className="col" style={{gap:8}}>{items.map(m=>(
                  <div key={m.id} style={{display:'flex',alignItems:'center',gap:8}}>
                    <span style={{fontSize:13,flex:1,minWidth:0,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{m.name}</span>
                    <span style={{fontSize:12,color:'var(--text2)',fontFamily:'var(--mono)',flexShrink:0}}>{m.calories} kcal</span>
                    <button className="btn btn-icon" style={{color:'var(--amber)',padding:4,flexShrink:0}} onClick={()=>saveFav(m)}><Icon name="starEmpty" size={13}/></button>
                    <button className="btn btn-icon btn-danger" style={{padding:4,flexShrink:0}} onClick={()=>removeMeal(slot,m.id)}><Icon name="close" size={13}/></button>
                  </div>))}</div>}
              {favMeals.length>0&&<div style={{marginTop:12,display:'flex',flexWrap:'wrap',gap:6}}>
                {favMeals.map(f=><button key={f.id} onClick={()=>addFavToSlot(f,slot)}
                  style={{fontSize:11,padding:'4px 10px',borderRadius:99,border:'1px dashed var(--border)',color:'var(--text3)',cursor:'pointer',background:'none',transition:'color 0.15s'}}
                  onMouseOver={e=>e.currentTarget.style.color='var(--accent)'}
                  onMouseOut={e=>e.currentTarget.style.color='var(--text3)'}>+ {f.name}</button>)}
              </div>}
            </div>);
        })}
      </div>}
      {tab==='favorites'&&<div className="col">
        {favMeals.length===0?<div className="empty-state">No favorites yet — tap ☆ on a meal to save it</div>
          :<div className="grid-2">{favMeals.map(f=>(
            <div key={f.id} className="card" style={{display:'flex',alignItems:'center',justifyContent:'space-between',gap:12}}>
              <div style={{minWidth:0}}>
                <div style={{fontSize:14,fontWeight:500,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{f.name}</div>
                <div style={{fontSize:12,color:'var(--text2)',fontFamily:'var(--mono)',marginTop:2}}>{f.calories} kcal</div>
              </div>
              <button className="btn btn-icon btn-danger" style={{flexShrink:0}} onClick={()=>deleteFav(f.id)}><Icon name="trash" size={15}/></button>
            </div>))}</div>}
      </div>}
      {showAddModal&&<Modal title={`Add to ${addSlot}`} onClose={()=>setShowAddModal(false)}>
        <div className="col">
          <div className="form-group">
            <label className="form-label">Food name</label>
            <FoodSearch
              value={mealForm.name}
              onChange={name => setMealForm(p=>({...p, name}))}
              onSelect={(name, cal) => setMealForm(p=>({...p, name, calories: cal}))}
              onKeyDown={e=>e.key==='Enter'&&addMeal()}
              autoFocus
            />
          </div>
          <div className="form-group">
            <div style={{display:'flex',justifyContent:'space-between',alignItems:'center'}}>
              <label className="form-label">Calories</label>
              {mealForm.calories && <span style={{fontSize:11,color:'var(--text3)'}}>edit if needed</span>}
            </div>
            <input type="number" min="0" value={mealForm.calories} onChange={e=>setMealForm(p=>({...p,calories:e.target.value}))} placeholder="kcal" onKeyDown={e=>e.key==='Enter'&&addMeal()}/>
          </div>
          <button className="btn btn-primary" onClick={addMeal}>Add Meal</button>
        </div>
      </Modal>}
    </div>
  );
};

// ── PLANNING ──────────────────────────────────────────────────────────────
const PlanningSection = ({ tasks, setTasks, habits, setHabits, habitLogs, setHabitLogs, markActive }) => {
  const [tab, setTab] = useState('calendar');
  const [calMonth, setCalMonth] = useState(() => new Date());
  const [selectedDate, setSelectedDate] = useState(TODAY);
  const [showTaskModal, setShowTaskModal] = useState(false);
  const [showHabitModal, setShowHabitModal] = useState(false);
  const [taskForm, setTaskForm] = useState({ text:'', priority:'medium' });
  const [habitForm, setHabitForm] = useState('');

  // Calendar grid
  const year = calMonth.getFullYear();
  const month = calMonth.getMonth();
  const monthLabel = calMonth.toLocaleDateString('en-US', { month:'long', year:'numeric' });
  const firstDay = new Date(year, month, 1).getDay();
  const daysInMonth = new Date(year, month + 1, 0).getDate();
  const calDays = useMemo(() => {
    const days = Array(firstDay).fill(null);
    for (let i = 1; i <= daysInMonth; i++)
      days.push(`${year}-${String(month+1).padStart(2,'0')}-${String(i).padStart(2,'0')}`);
    return days;
  }, [year, month, firstDay, daysInMonth]);

  const selectedTasks = tasks
    .filter(t => t.date === selectedDate)
    .sort((a,b) => ({high:0,medium:1,low:2}[a.priority] - {high:0,medium:1,low:2}[b.priority]));
  const doneCount = selectedTasks.filter(t => t.done).length;

  const addTask = () => {
    if (!taskForm.text.trim()) return;
    const t = { id:Date.now(), text:taskForm.text.trim(), priority:taskForm.priority, date:selectedDate, done:false };
    setTasks(prev => { const n=[...prev,t]; save('tasks',n); return n; });
    markActive(selectedDate);
    setTaskForm({ text:'', priority:'medium' }); setShowTaskModal(false);
  };
  const toggleDone = id => setTasks(prev => { const n=prev.map(t=>t.id===id?{...t,done:!t.done}:t); save('tasks',n); return n; });
  const deleteTask = id => setTasks(prev => { const n=prev.filter(t=>t.id!==id); save('tasks',n); return n; });

  // Habits
  const todayDone = habitLogs[TODAY] || [];
  const addHabit = () => {
    if (!habitForm.trim()) return;
    setHabits(prev => { const n=[...prev,{id:Date.now(),text:habitForm.trim()}]; save('habits',n); return n; });
    setHabitForm(''); setShowHabitModal(false);
  };
  const deleteHabit = id => setHabits(prev => { const n=prev.filter(h=>h.id!==id); save('habits',n); return n; });
  const toggleHabit = id => setHabitLogs(prev => {
    const day = prev[TODAY] || [];
    const updated = day.includes(id) ? day.filter(i=>i!==id) : [...day, id];
    const n = {...prev, [TODAY]: updated}; save('habitLogs',n); return n;
  });

  const pColor = p => p==='high'?'var(--red)':p==='medium'?'var(--amber)':'var(--text3)';
  const pClass = p => p==='high'?'badge-red':p==='medium'?'badge-amber':'badge-gray';

  return (
    <div className="section">
      <div style={{display:'flex',alignItems:'flex-start',justifyContent:'space-between',marginBottom:24,flexWrap:'wrap',gap:10}}>
        <div className="section-title">Planning</div>
        {tab==='calendar' && <button className="btn btn-primary btn-sm" onClick={()=>{setTaskForm({text:'',priority:'medium'});setShowTaskModal(true);}}><Icon name="plus" size={15}/>Add Task</button>}
        {tab==='habits'   && <button className="btn btn-primary btn-sm" onClick={()=>setShowHabitModal(true)}><Icon name="plus" size={15}/>Add Habit</button>}
      </div>

      <div className="tab-bar">
        {[['calendar','Calendar'],['habits','Daily Habits']].map(([id,label])=>(
          <button key={id} className={`tab-btn ${tab===id?'active':''}`} onClick={()=>setTab(id)}>{label}</button>
        ))}
      </div>

      {tab==='calendar' && <div className="col">
        {/* Month nav */}
        <div className="card" style={{padding:'16px 20px'}}>
          <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:16}}>
            <button className="btn btn-ghost btn-sm" onClick={()=>setCalMonth(new Date(year,month-1,1))} style={{padding:'6px 10px',fontSize:18,lineHeight:1}}>‹</button>
            <span style={{fontSize:15,fontWeight:700}}>{monthLabel}</span>
            <button className="btn btn-ghost btn-sm" onClick={()=>setCalMonth(new Date(year,month+1,1))} style={{padding:'6px 10px',fontSize:18,lineHeight:1}}>›</button>
          </div>

          {/* Weekday headers */}
          <div style={{display:'grid',gridTemplateColumns:'repeat(7,1fr)',marginBottom:6}}>
            {['Su','Mo','Tu','We','Th','Fr','Sa'].map(d=>(
              <div key={d} style={{textAlign:'center',fontSize:11,fontWeight:600,color:'var(--text3)',padding:'4px 0'}}>{d}</div>
            ))}
          </div>

          {/* Day cells */}
          <div style={{display:'grid',gridTemplateColumns:'repeat(7,1fr)',gap:3}}>
            {calDays.map((date, i) => {
              if (!date) return <div key={`e${i}`}/>;
              const dayNum = parseInt(date.split('-')[2]);
              const isToday = date === TODAY;
              const isSelected = date === selectedDate;
              const dayTasks = tasks.filter(t=>t.date===date);
              const dots = dayTasks.slice(0,3);
              return (
                <div key={date} onClick={()=>setSelectedDate(date)}
                  style={{textAlign:'center',padding:'6px 2px',borderRadius:8,cursor:'pointer',minHeight:44,display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',
                    background: isSelected ? 'var(--accent-dim)' : isToday ? 'var(--bg4)' : 'transparent',
                    border: `2px solid ${isSelected ? 'var(--accent)' : isToday ? 'var(--border)' : 'transparent'}`,
                    transition:'all 0.12s'}}>
                  <span style={{fontSize:13,fontWeight:isToday?700:400,color:isSelected?'var(--accent)':isToday?'var(--accent)':'var(--text)',lineHeight:1}}>{dayNum}</span>
                  {dots.length > 0 && (
                    <div style={{display:'flex',gap:2,marginTop:4,justifyContent:'center'}}>
                      {dots.map(t=><div key={t.id} style={{width:4,height:4,borderRadius:'50%',background:pColor(t.priority),opacity:t.done?0.35:1}}/>)}
                    </div>
                  )}
                </div>
              );
            })}
          </div>
        </div>

        {/* Tasks for selected day */}
        <div>
          <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:10}}>
            <div style={{fontSize:14,fontWeight:600,color:'var(--text)'}}>
              {new Date(selectedDate+'T12:00').toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric'})}
              {selectedDate===TODAY && <span style={{fontSize:12,color:'var(--accent)',marginLeft:8}}>today</span>}
            </div>
            {selectedTasks.length>0 && <span style={{fontSize:12,color:'var(--text3)'}}>{doneCount}/{selectedTasks.length}{doneCount===selectedTasks.length?' 🎉':''}</span>}
          </div>
          {selectedTasks.length===0
            ? <div style={{textAlign:'center',padding:'20px',color:'var(--text3)',fontSize:13,background:'var(--bg2)',border:'1px solid var(--border)',borderRadius:'var(--radius)'}}>No tasks — tap "Add Task" to add one for this day</div>
            : <div className="col" style={{gap:8}}>
                {selectedTasks.map(t=>(
                  <div key={t.id} className="card" style={{display:'flex',alignItems:'center',gap:12,padding:'12px 14px',opacity:t.done?0.55:1,transition:'opacity 0.2s'}}>
                    <button onClick={()=>toggleDone(t.id)} style={{width:22,height:22,borderRadius:6,flexShrink:0,display:'flex',alignItems:'center',justifyContent:'center',
                      border:`2px solid ${t.done?'var(--accent)':'var(--border)'}`,background:t.done?'var(--accent)':'transparent',transition:'all 0.15s',cursor:'pointer'}}>
                      {t.done&&<Icon name="check" size={12}/>}
                    </button>
                    <span style={{flex:1,fontSize:14,textDecoration:t.done?'line-through':'none',minWidth:0,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{t.text}</span>
                    <span className={`badge ${pClass(t.priority)}`} style={{flexShrink:0}}>{t.priority}</span>
                    <button className="btn btn-icon btn-danger" onClick={()=>deleteTask(t.id)}><Icon name="trash" size={14}/></button>
                  </div>
                ))}
              </div>}
        </div>
      </div>}

      {tab==='habits' && <div className="col">
        {habits.length > 0 && (
          <div style={{background:'var(--accent-dim)',border:'1px solid var(--accent-border)',borderRadius:12,padding:'14px 20px',display:'flex',alignItems:'center',justifyContent:'space-between'}}>
            <div>
              <div style={{fontSize:12,color:'var(--text2)',marginBottom:2}}>Today's Progress</div>
              <div style={{fontSize:13,color:'var(--text3)'}}>
                {todayDone.length === habits.length && habits.length > 0 ? '🎉 All done!' : `${todayDone.length} of ${habits.length} completed`}
              </div>
            </div>
            <span style={{fontSize:32,fontWeight:700,fontFamily:'var(--mono)',color:'var(--accent)'}}>{todayDone.length}<span style={{fontSize:16,color:'var(--text3)'}}>/{habits.length}</span></span>
          </div>
        )}
        {habits.length === 0
          ? <div className="empty-state">No daily habits yet.<br/>Add things you want to do every single day.</div>
          : <div className="col" style={{gap:8}}>
              {habits.map(h => {
                const done = todayDone.includes(h.id);
                return (
                  <div key={h.id} className="card" style={{display:'flex',alignItems:'center',gap:12,padding:'14px 16px',
                    opacity:done?0.65:1,transition:'all 0.2s',
                    borderColor:done?'var(--accent-border)':'var(--border)'}}>
                    <button onClick={()=>toggleHabit(h.id)} style={{width:24,height:24,borderRadius:6,flexShrink:0,display:'flex',alignItems:'center',justifyContent:'center',
                      border:`2px solid ${done?'var(--accent)':'var(--border)'}`,background:done?'var(--accent)':'transparent',transition:'all 0.15s',cursor:'pointer'}}>
                      {done && <Icon name="check" size={13}/>}
                    </button>
                    <span style={{flex:1,fontSize:14,textDecoration:done?'line-through':'none'}}>{h.text}</span>
                    <button className="btn btn-icon btn-danger" onClick={()=>deleteHabit(h.id)}><Icon name="trash" size={14}/></button>
                  </div>
                );
              })}
            </div>}
      </div>}

      {showTaskModal && (
        <Modal title={`Add task — ${new Date(selectedDate+'T12:00').toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'})}`} onClose={()=>setShowTaskModal(false)}>
          <div className="col">
            <div className="form-group"><label className="form-label">Task</label>
              <input value={taskForm.text} onChange={e=>setTaskForm(p=>({...p,text:e.target.value}))} placeholder="What needs to be done?" autoFocus onKeyDown={e=>e.key==='Enter'&&addTask()}/></div>
            <div className="form-group"><label className="form-label">Priority</label>
              <select value={taskForm.priority} onChange={e=>setTaskForm(p=>({...p,priority:e.target.value}))}>
                <option value="high">🔴 High</option><option value="medium">🟡 Medium</option><option value="low">⚪ Low</option>
              </select></div>
            <button className="btn btn-primary" onClick={addTask}>Add Task</button>
          </div>
        </Modal>
      )}

      {showHabitModal && (
        <Modal title="New Daily Habit" onClose={()=>setShowHabitModal(false)}>
          <div className="col">
            <div className="form-group"><label className="form-label">What do you want to do every day?</label>
              <input value={habitForm} onChange={e=>setHabitForm(e.target.value)} placeholder="e.g. Drink 8 glasses of water" autoFocus onKeyDown={e=>e.key==='Enter'&&addHabit()}/></div>
            <button className="btn btn-primary" onClick={addHabit}>Add Habit</button>
          </div>
        </Modal>
      )}
    </div>
  );
};

// ── PROGRESS ──────────────────────────────────────────────────────────────
const ProgressSection = ({ weightLogs, setWeightLogs, checkIns, setCheckIns, markActive }) => {
  const [showWeightModal, setShowWeightModal] = useState(false);
  const [showCheckInModal, setShowCheckInModal] = useState(false);
  const [weightForm, setWeightForm] = useState({ date:TODAY, weight:'' });
  const [checkForm, setCheckForm] = useState({ date:TODAY, energy:5, mood:5, notes:'' });
  const addWeight=()=>{
    if(!weightForm.weight)return;
    const w={id:Date.now(),date:weightForm.date,value:parseFloat(weightForm.weight)};
    setWeightLogs(prev=>{const n=[...prev.filter(x=>x.date!==weightForm.date),w].sort((a,b)=>a.date.localeCompare(b.date));save('weightLogs',n);return n;});
    markActive(weightForm.date);setWeightForm({date:TODAY,weight:''});setShowWeightModal(false);
  };
  const addCheckIn=()=>{
    const c={id:Date.now(),...checkForm};
    setCheckIns(prev=>{const n=[...prev.filter(x=>x.date!==checkForm.date),c].sort((a,b)=>a.date.localeCompare(b.date));save('checkIns',n);return n;});
    markActive(checkForm.date);setCheckForm({date:TODAY,energy:5,mood:5,notes:''});setShowCheckInModal(false);
  };
  const deleteWeight=id=>setWeightLogs(prev=>{const n=prev.filter(w=>w.id!==id);save('weightLogs',n);return n;});
  const deleteCheckIn=id=>setCheckIns(prev=>{const n=prev.filter(c=>c.id!==id);save('checkIns',n);return n;});
  const lw=weightLogs[weightLogs.length-1], lc=checkIns[checkIns.length-1];
  const wd=weightLogs.length>=2?(weightLogs[weightLogs.length-1].value-weightLogs[weightLogs.length-2].value).toFixed(1):null;
  return (
    <div className="section">
      <div className="section-title" style={{marginBottom:24}}>Progress</div>
      <div className="grid-2" style={{marginBottom:16}}>
        <div className="card" style={{display:'flex',alignItems:'center',justifyContent:'space-between',gap:12}}>
          <div style={{minWidth:0}}>
            <div className="card-title">Current Weight</div>
            <div style={{fontSize:28,fontWeight:700,fontFamily:'var(--mono)',color:'var(--accent)'}}>{lw?`${lw.value} kg`:'—'}</div>
            {wd!==null&&<div style={{fontSize:11,color:parseFloat(wd)<0?'var(--accent)':'var(--red)',marginTop:2,fontFamily:'var(--mono)'}}>{parseFloat(wd)>0?'+':''}{wd} kg from last</div>}
            {lw&&<div style={{fontSize:11,color:'var(--text3)',marginTop:2}}>{lw.date}</div>}
          </div>
          <button className="btn btn-ghost btn-sm" onClick={()=>setShowWeightModal(true)} style={{flexShrink:0}}><Icon name="plus" size={14}/>Log</button>
        </div>
        <div className="card" style={{display:'flex',alignItems:'center',justifyContent:'space-between',gap:12}}>
          <div style={{minWidth:0}}>
            <div className="card-title">Last Check-in</div>
            {lc?<div style={{display:'flex',gap:16,marginTop:4}}>
              <div><div style={{fontSize:11,color:'var(--text3)'}}>Mood</div><div style={{fontSize:20,fontWeight:700,fontFamily:'var(--mono)',color:'var(--amber)'}}>{lc.mood}<span style={{fontSize:13}}>/10</span></div></div>
              <div><div style={{fontSize:11,color:'var(--text3)'}}>Energy</div><div style={{fontSize:20,fontWeight:700,fontFamily:'var(--mono)',color:'var(--accent)'}}>{lc.energy}<span style={{fontSize:13}}>/10</span></div></div>
            </div>:<div style={{color:'var(--text3)',fontSize:13,marginTop:4}}>No check-in yet</div>}
            {lc&&<div style={{fontSize:11,color:'var(--text3)',marginTop:2}}>{lc.date}</div>}
          </div>
          <button className="btn btn-ghost btn-sm" onClick={()=>setShowCheckInModal(true)} style={{flexShrink:0}}><Icon name="plus" size={14}/>Log</button>
        </div>
      </div>
      <div className="col">
        <div className="card"><div className="card-title">Weight Over Time</div><LineChart data={weightLogs.map(w=>({date:w.date.slice(5),value:w.value}))} label="weight"/></div>
        <div className="grid-2">
          <div className="card"><div className="card-title">Mood</div><LineChart data={checkIns.map(c=>({date:c.date.slice(5),value:c.mood}))} color="var(--amber)" height={90} label="mood"/></div>
          <div className="card"><div className="card-title">Energy</div><LineChart data={checkIns.map(c=>({date:c.date.slice(5),value:c.energy}))} color="var(--blue)" height={90} label="energy"/></div>
        </div>
        {weightLogs.length>0&&<div className="card"><div className="card-title">Weight Log</div>
          <div className="col" style={{gap:6}}>{[...weightLogs].reverse().slice(0,8).map(w=>(
            <div key={w.id} style={{display:'flex',alignItems:'center',gap:12,padding:'6px 0',borderBottom:'1px solid var(--border)'}}>
              <div style={{fontSize:12,color:'var(--text3)',fontFamily:'var(--mono)',minWidth:80}}>{w.date}</div>
              <div style={{flex:1,fontSize:14,fontWeight:600,fontFamily:'var(--mono)',color:'var(--accent)'}}>{w.value} kg</div>
              <button className="btn btn-icon btn-danger" style={{padding:4}} onClick={()=>deleteWeight(w.id)}><Icon name="trash" size={13}/></button>
            </div>))}</div>
        </div>}
        {checkIns.length>0&&<div className="card"><div className="card-title">Check-in History</div>
          <div className="col" style={{gap:6}}>{[...checkIns].reverse().slice(0,6).map(c=>(
            <div key={c.id} style={{display:'flex',alignItems:'center',gap:12,padding:'8px 0',borderBottom:'1px solid var(--border)'}}>
              <div style={{fontSize:12,color:'var(--text3)',fontFamily:'var(--mono)',minWidth:80}}>{c.date}</div>
              <div style={{fontSize:12}}>Mood <span style={{color:'var(--amber)',fontWeight:600}}>{c.mood}/10</span></div>
              <div style={{fontSize:12}}>Energy <span style={{color:'var(--accent)',fontWeight:600}}>{c.energy}/10</span></div>
              {c.notes&&<div style={{fontSize:12,color:'var(--text2)',flex:1,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}} title={c.notes}>{c.notes}</div>}
              <button className="btn btn-icon btn-danger" style={{padding:4,flexShrink:0}} onClick={()=>deleteCheckIn(c.id)}><Icon name="trash" size={13}/></button>
            </div>))}</div>
        </div>}
      </div>
      {showWeightModal&&<Modal title="Log Weight" onClose={()=>setShowWeightModal(false)}>
        <div className="col">
          <div className="form-row">
            <div className="form-group"><label className="form-label">Weight (kg)</label>
              <input type="number" min="0" step="0.1" value={weightForm.weight} onChange={e=>setWeightForm(p=>({...p,weight:e.target.value}))} placeholder="75.5" autoFocus onKeyDown={e=>e.key==='Enter'&&addWeight()}/></div>
            <div className="form-group"><label className="form-label">Date</label>
              <input type="date" value={weightForm.date} onChange={e=>setWeightForm(p=>({...p,date:e.target.value}))}/></div>
          </div>
          <button className="btn btn-primary" onClick={addWeight}>Save Weight</button>
        </div>
      </Modal>}
      {showCheckInModal&&<Modal title="Weekly Check-in" onClose={()=>setShowCheckInModal(false)}>
        <div className="col">
          <div className="form-group"><label className="form-label">Date</label>
            <input type="date" value={checkForm.date} onChange={e=>setCheckForm(p=>({...p,date:e.target.value}))}/></div>
          <div className="form-group">
            <label className="form-label">Energy — <span style={{color:'var(--accent)',fontFamily:'var(--mono)'}}>{checkForm.energy}/10</span></label>
            <input type="range" min="1" max="10" value={checkForm.energy} onChange={e=>setCheckForm(p=>({...p,energy:parseInt(e.target.value)}))} style={{background:'var(--bg4)',accentColor:'var(--accent)',width:'100%'}}/></div>
          <div className="form-group">
            <label className="form-label">Mood — <span style={{color:'var(--amber)',fontFamily:'var(--mono)'}}>{checkForm.mood}/10</span></label>
            <input type="range" min="1" max="10" value={checkForm.mood} onChange={e=>setCheckForm(p=>({...p,mood:parseInt(e.target.value)}))} style={{background:'var(--bg4)',accentColor:'var(--amber)',width:'100%'}}/></div>
          <div className="form-group"><label className="form-label">Notes</label>
            <textarea value={checkForm.notes} onChange={e=>setCheckForm(p=>({...p,notes:e.target.value}))} rows={3} placeholder="How was your week?"/></div>
          <button className="btn btn-primary" onClick={addCheckIn}>Save Check-in</button>
        </div>
      </Modal>}
    </div>
  );
};

// ── APP ROOT ──────────────────────────────────────────────────────────────
const NAV = [
  {id:'home',label:'Home',icon:'home'},
  {id:'gym',label:'Gym',icon:'dumbbell'},
  {id:'food',label:'Food',icon:'food'},
  {id:'plan',label:'Plan',icon:'plan'},
  {id:'progress',label:'Progress',icon:'progress'},
];

const App = () => {
  const [authState, setAuthState] = useState('loading');
  const [user, setUser] = useState(null);
  const [activeSection, setActiveSection] = useState('home');

  const [workoutSchemas,  setWorkoutSchemas]  = useState(()=>ls.get('workoutSchemas',[]));
  const [workoutSessions, setWorkoutSessions] = useState(()=>ls.get('workoutSessions',[]));
  const [meals,           setMeals]           = useState(()=>ls.get('meals',{}));
  const [favMeals,        setFavMeals]        = useState(()=>ls.get('favMeals',[]));
  const [tasks,           setTasks]           = useState(()=>ls.get('tasks',[]));
  const [weightLogs,      setWeightLogs]      = useState(()=>ls.get('weightLogs',[]));
  const [checkIns,        setCheckIns]        = useState(()=>ls.get('checkIns',[]));
  const [activeDays,      setActiveDays]      = useState(()=>ls.get('activeDays',[]));
  const [habits,           setHabits]           = useState(()=>ls.get('habits',[]));
  const [habitLogs,        setHabitLogs]        = useState(()=>ls.get('habitLogs',{}));
  const [customExercises,  setCustomExercises]  = useState(()=>ls.get('customExercises',[]));

  const applyCloud = useCallback(cloud => {
    if (!cloud) return;
    const apply = (key, setter) => { if (cloud[key] !== undefined) { setter(cloud[key]); ls.set(key, cloud[key]); } };
    apply('workoutSchemas',  setWorkoutSchemas);
    apply('workoutSessions', setWorkoutSessions);
    apply('meals',           setMeals);
    apply('favMeals',        setFavMeals);
    apply('tasks',           setTasks);
    apply('weightLogs',      setWeightLogs);
    apply('checkIns',        setCheckIns);
    apply('activeDays',      setActiveDays);
    apply('habits',           setHabits);
    apply('habitLogs',        setHabitLogs);
    apply('customExercises',  setCustomExercises);
  }, []);

  const handleAuth = useCallback(async user => {
    _uid = user.id;
    setUser(user);
    const cloud = await loadCloud();
    applyCloud(cloud);
    setAuthState('app');
  }, [applyCloud]);

  const signOut = useCallback(async () => {
    await db.auth.signOut();
    _uid = null; setUser(null); ls.clear(); setAuthState('auth');
  }, []);

  const markActive = useCallback(date => {
    setActiveDays(prev => {
      if (prev.includes(date)) return prev;
      const n = [...prev, date]; save('activeDays', n); return n;
    });
  }, []);

  // Refresh from cloud whenever the tab/app becomes visible again
  useEffect(() => {
    const onVisible = () => {
      if (document.visibilityState === 'visible' && _uid) {
        loadCloud().then(cloud => { if (cloud) applyCloud(cloud); });
      }
    };
    document.addEventListener('visibilitychange', onVisible);
    return () => document.removeEventListener('visibilitychange', onVisible);
  }, [applyCloud]);

  useEffect(() => {
    db.auth.getSession().then(({ data: { session } }) => {
      if (session?.user) { handleAuth(session.user); }
      else { setAuthState('auth'); }
    });
    const { data: { subscription } } = db.auth.onAuthStateChange((event, session) => {
      if (event === 'SIGNED_OUT') { _uid = null; setUser(null); setAuthState('auth'); }
    });
    return () => subscription.unsubscribe();
  }, [handleAuth]);

  const navigate = section => { setActiveSection(section); document.querySelector('.main')?.scrollTo({top:0,behavior:'smooth'}); };
  const allData = { tasks, meals, workoutSessions, activeDays };

  if (authState === 'loading') return <Spinner text="Loading…"/>;
  if (authState === 'auth')    return <AuthScreen onSignIn={handleAuth}/>;

  return (
    <>
      <aside className="sidebar">
        <div className="sidebar-logo">M<span>Health</span></div>
        <nav className="sidebar-nav">
          {NAV.map(item=>(
            <div key={item.id} className={`sidebar-item ${activeSection===item.id?'active':''}`}
              onClick={()=>navigate(item.id)} role="button" tabIndex={0} onKeyDown={e=>e.key==='Enter'&&navigate(item.id)}>
              <Icon name={item.icon} size={18}/>{item.label}
            </div>
          ))}
        </nav>
        <div className="sidebar-footer">
          <div className="sidebar-email">{user?.email}</div>
          <button className="btn btn-ghost btn-sm" style={{width:'100%',justifyContent:'center',gap:8}} onClick={signOut}>
            <Icon name="logout" size={14}/>Sign out
          </button>
        </div>
      </aside>

      <main className="main">
        {activeSection==='home'     && <HomeSection allData={allData} signOut={signOut} userEmail={user?.email}/>}
        {activeSection==='gym'      && <GymSection workoutSchemas={workoutSchemas} setWorkoutSchemas={setWorkoutSchemas} workoutSessions={workoutSessions} setWorkoutSessions={setWorkoutSessions} customExercises={customExercises} setCustomExercises={setCustomExercises} markActive={markActive}/>}
        {activeSection==='food'     && <FoodSection meals={meals} setMeals={setMeals} favMeals={favMeals} setFavMeals={setFavMeals} markActive={markActive}/>}
        {activeSection==='plan'     && <PlanningSection tasks={tasks} setTasks={setTasks} habits={habits} setHabits={setHabits} habitLogs={habitLogs} setHabitLogs={setHabitLogs} markActive={markActive}/>}
        {activeSection==='progress' && <ProgressSection weightLogs={weightLogs} setWeightLogs={setWeightLogs} checkIns={checkIns} setCheckIns={setCheckIns} markActive={markActive}/>}
      </main>

      <nav className="bottom-nav">
        {NAV.map(item=>(
          <div key={item.id} className={`bottom-nav-item ${activeSection===item.id?'active':''}`}
            onClick={()=>navigate(item.id)} role="button" tabIndex={0} onKeyDown={e=>e.key==='Enter'&&navigate(item.id)}>
            <Icon name={item.icon} size={22}/><span>{item.label}</span>
          </div>
        ))}
      </nav>
    </>
  );
};

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
